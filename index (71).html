<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:-webkit-fill-available;-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#F0FAFB;color:#1B2631;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.SCR{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(env(safe-area-inset-bottom,0px)+58px)}
.SCR::-webkit-scrollbar{width:0}
:root{--gr:#43A047;--gr2:#2E7D32;--sky:#1976D2;--sky2:#1565C0;--warm:#FF6B35;--gold:#FFD60A;--gold2:#F59E0B;--rd:#EF4444;--bg:#F0FAFB;--t0:#1B2631;--t1:#4A5568;--t2:#9EA8B1}
.TB{background:#1976D2;padding:calc(env(safe-area-inset-top,0px)+10px) 14px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.TB-L{display:flex;align-items:center;gap:8px}
.AV{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:2px solid rgba(255,255,255,.6);flex-shrink:0}
.TB-NAME{color:#fff;font-size:.8rem;font-weight:700}
.LVB{background:var(--gold);color:#1B2631;font-size:.52rem;font-weight:900;padding:2px 6px;border-radius:6px;display:inline-block;margin-left:4px}
.COIN{background:rgba(255,255,255,.2);border-radius:20px;padding:5px 11px;display:flex;align-items:center;gap:5px;font-size:.88rem;font-weight:900;color:#fff}
.BN{background:#fff;border-top:2px solid #E8F5E9;display:flex;flex-shrink:0;position:sticky;bottom:0;z-index:90;padding-bottom:env(safe-area-inset-bottom,0)}
.BNB{flex:1;padding:8px 2px;background:none;border:none;font-size:.52rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--t2);font-family:inherit;-webkit-tap-highlight-color:transparent;transition:color .15s}
.BNB.ACT{color:var(--warm)}
.NI{font-size:1rem}
.BTN{border:none;border-radius:50px;padding:12px 18px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.88rem;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.BTN:active{transform:scale(.96)}
.B-OR{background:var(--warm);color:#fff}
.B-GR{background:var(--gr);color:#fff}
.B-SK{background:#1976D2;color:#fff}
.B-GD{background:var(--gold);color:#1B2631}
.B-WH{background:#fff;color:var(--t0);border:1.5px solid #E0E7EF}
.B-RD{background:var(--rd);color:#fff}
.BW{width:100%}
.CARD{background:#fff;border-radius:16px;border:1.5px solid #E8F5E9;padding:14px}
.INP{width:100%;background:#F7FBF7;border:1.5px solid #C8E6C9;border-radius:12px;padding:12px 14px;color:var(--t0);font-size:1rem;font-family:inherit;outline:none}
.INP:focus{border-color:var(--gr)}
.INP::placeholder{color:var(--t2)}
.SL{font-size:.58rem;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.OB{flex:1;min-width:44px;background:#F7FBF7;border:1.5px solid #C8E6C9;border-radius:10px;padding:9px 4px;text-align:center;cursor:pointer;color:var(--t0);-webkit-tap-highlight-color:transparent}
.OB.SEL{background:#FFF2EC;border-color:var(--warm)}
.OB .OV{font-size:.88rem;font-weight:900}
.OB .OU{font-size:.58rem;opacity:.65;margin-top:1px}
.GB{background:#F7FBF7;border:1.5px solid #C8E6C9;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;color:var(--t0);-webkit-tap-highlight-color:transparent}
.GB.SEL{background:#FFF2EC;border-color:var(--warm)}
.GB .GV{font-size:.76rem;font-weight:900}
.GB .GS{font-size:.52rem;opacity:.6;margin-top:2px}
.MI{background:#fff;border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;border:1.5px solid #E0E7EF;-webkit-tap-highlight-color:transparent;transition:background .15s}
.MI:active{background:#F7FBF7}
.QHD{background:#1976D2;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:90}
.QTMR{font-size:1.8rem;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.QTMR.URG{color:var(--gold);animation:blk .5s infinite alternate}
@keyframes blk{from{opacity:1}to{opacity:.3}}
.PBAR{height:5px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden;margin:0 14px;flex-shrink:0}
.PBR{height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.QEXPR{font-size:2.1rem;font-weight:900;text-align:center;color:var(--t0)}
.AINP{width:100%;background:#F7FBF7;border:2.5px solid #C8E6C9;border-radius:14px;padding:15px;color:var(--t0);font-size:1.9rem;font-weight:900;text-align:center;font-family:inherit;outline:none;-webkit-appearance:none;transition:border-color .2s,background .2s}
.AINP:focus{border-color:#1976D2;background:#EEF5FF}
.AINP.OK{border-color:#43A047;background:#E8F5E9;color:#2E7D32}
.AINP.NG{border-color:#EF4444;background:#FEF2F2;color:#C62828}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{display:none}
.SD{width:8px;height:8px;border-radius:50%;background:#E0E7EF}
.SD.LIT{background:var(--warm)}
.CL{background:#FFFDE7;border:1.5px solid #FFE082;border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
/* TOWN */
.TG{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:12px;background:#B7E4C7}
.TT{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;background:#74C69D;border:1.5px solid #52B788;-webkit-tap-highlight-color:transparent;transition:transform .12s;position:relative}
.TT:active{transform:scale(.86)}
.TT.HL{border-color:var(--gold);background:#D4F0B7;animation:glo .8s infinite alternate}
@keyframes glo{from{box-shadow:0 0 0 #FFD60A00}to{box-shadow:0 0 10px #FFD60A88}}
.TT.OCC{background:#95D5B2}
.TT.LOCKED{background:#D4E6D4;border-color:#A8C8A8;opacity:.6;cursor:not-allowed}
.COLLECT-BADGE{position:absolute;top:2px;right:2px;width:14px;height:14px;background:#FF6B35;border-radius:50%;font-size:.5rem;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;animation:pulse .8s infinite alternate;border:1.5px solid #fff}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.2)}}
.ICH{background:#fff;border:1.5px solid #E0E7EF;border-radius:10px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:7px}
.ICH.SEL{border-color:var(--gold);background:#FFFDE7}
/* SHOP */
.SG{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.SI{background:#fff;border-radius:12px;padding:10px 7px;text-align:center;cursor:pointer;border:1.5px solid #E8F5E9;-webkit-tap-highlight-color:transparent;transition:transform .12s;position:relative}
.SI:active{transform:scale(.95)}
.SI.AF{border-color:var(--gr);background:#F0FFF4}
.SI.LK{opacity:.4;cursor:not-allowed}
.PROD-TAG{display:inline-flex;align-items:center;gap:2px;background:#E8F5E9;border-radius:5px;padding:2px 5px;font-size:.56rem;font-weight:700;color:#2E7D32;margin-top:2px}
/* MINI-GAMES */
.MG-CARD{background:#fff;border-radius:16px;border:2px solid #E8F5E9;padding:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.MG-CARD:active{transform:scale(.97)}
.MG-CARD.DONE{opacity:.6;cursor:not-allowed}
.FLIP-GRID{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
.FCARD{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.78rem;font-weight:700;border:2px solid #C8E6C9;background:#F7FBF7;color:transparent;-webkit-tap-highlight-color:transparent;transition:all .2s;word-break:break-all;text-align:center;padding:3px;line-height:1.1}
.FCARD.FACE{background:#fff;color:var(--t0);border-color:#1976D2}
.FCARD.MATCH{background:#E8F5E9;color:#2E7D32;border-color:#43A047}
.BUBBLE-GRID{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.BUBBLE{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;font-weight:900;background:#E3F2FD;border:2.5px solid #90CAF9;color:#1565C0;-webkit-tap-highlight-color:transparent;transition:all .15s}
.BUBBLE:active{transform:scale(.9)}
.BUBBLE.OK{background:#E8F5E9;border-color:#43A047;color:#2E7D32}
.BUBBLE.NG{background:#FEEFEF;border-color:#EF4444;color:#C62828}
/* MISC */
.AG{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.AC{background:#fff;border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;border:1.5px solid #E8F5E9;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.AC:active{transform:scale(.95)}
.AC .AI{font-size:1.5rem;margin-bottom:5px}
.AC .AN{font-size:.8rem;font-weight:700}
.AC .AS{font-size:.58rem;color:var(--t2);margin-top:2px}
.XPW{background:#E8F5E9;border-radius:3px;height:5px;margin-top:5px;overflow:hidden}
.XPB{background:linear-gradient(90deg,#43A047,var(--gold));height:100%;border-radius:3px;transition:width .5s}
.BDR{background:#F7FBF7;border-radius:10px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;font-size:.8rem}
.PG{padding:14px;display:flex;flex-direction:column;gap:13px;background:var(--bg)}
.HL-BAND{background:#FFFDE7;border:1.5px solid #FFE082;border-radius:12px;padding:11px;font-size:.74rem;color:#7B5E00;text-align:center}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.FADE{animation:fade .22s ease}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* Canvas */
#CC{display:block;touch-action:none}
.FC{position:fixed;pointer-events:none;animation:fcu 1.2s ease forwards;font-size:.9rem;font-weight:900;color:var(--gold2);z-index:9999;white-space:nowrap}
@keyframes fcu{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-56px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ═══ BUILDINGS ═══ */
const B=[
  {id:'R',n:'岩石',e:'🪨',c:8},
  {id:'G',n:'草坪',e:'🌿',c:15},
  {id:'T',n:'大樹',e:'🌳',c:25},
  {id:'F',n:'花圃',e:'🌸',c:35},
  {id:'M',n:'蘑菇',e:'🍄',c:25},
  {id:'W',n:'噴水池',e:'⛲',c:180},
  {id:'V',n:'瞭望塔',e:'🗼',c:380},
  // coin producers
  {id:'H',n:'農舍',e:'🏠',c:80,coin:5},
  {id:'A',n:'農田',e:'🌾',c:90,coin:8},
  {id:'O',n:'果園',e:'🍎',c:130,coin:12},
  {id:'P',n:'池塘',e:'🏞️',c:110,coin:6},
  {id:'E',n:'麵包坊',e:'🥖',c:180,coin:15},
  {id:'K',n:'市集',e:'🏪',c:200,coin:20},
  {id:'J',n:'礦山',e:'⛏️',c:260,coin:28},

  {id:'N',n:'宮殿',e:'🏯',c:1200,coin:65},
  // exp producers
  {id:'S',n:'學校',e:'🏫',c:280,exp:20},
  {id:'L',n:'圖書館',e:'📚',c:350,exp:35},
  {id:'X',n:'神廟',e:'⛩️',c:480,exp:15},
  // boost
  {id:'Z',n:'魔法塔',e:'🔮',c:600,boost:0.5},
];
const LAND=[
  {id:'l1',n:'新土地 第6排',e:'🌱',c:400,row:6,lv:5},
  {id:'l2',n:'新土地 第7排',e:'🌿',c:900,row:7,lv:10},
  {id:'l3',n:'新土地 第8排',e:'🌳',c:1800,row:8,lv:15},
];
const MODES=[
  {id:'add',sym:'+',n:'純加法',c:'#1976D2',g:true,tO:[40,30,20,10]},
  {id:'sub',sym:'−',n:'純減法',c:'#7B1FA2',g:true,tO:[40,30,20,10]},
  {id:'mul',sym:'×',n:'純乘法',c:'#E65100',g:true,tO:[40,30,20,10]},
  {id:'div',sym:'÷',n:'純除法',c:'#00695C',g:true,tO:[40,30,20,10]},
  {id:'as',sym:'±',n:'加減四則',c:'#AD1457',g:true,tO:[40,30,20,10]},
  {id:'md',sym:'×÷',n:'乘除四則',c:'#5D4037',g:true,tO:[40,30,20,10]},
  {id:'a4',sym:'÷±',n:'四則運算',c:'#4A148C',g:true,tO:[40,30,20,10]},
  {id:'99',sym:'9×',n:'九九乘法',c:'#BF360C',g:false,tO:[15,10,5]},
  {id:'ck',sym:'⏰',n:'時鐘題目',c:'#0277BD',g:false,tO:[15,10,5]},
];
const GRADES=[{id:'d1',n:'一位數',m:1},{id:'d2',n:'二位數',m:1.5},{id:'d3',n:'三位數',m:2.5},{id:'d4',n:'四位數',m:4}];
const MG_PAIRS=[['3×4','12'],['8+7','15'],['20÷4','5'],['6×6','36'],['15−8','7'],['9×3','27'],['48÷6','8'],['14+9','23']];

/* ═══ STATE ═══ */
const S={p:null,screen:'login',mode:null,grade:'d1',tl:20,qs:[],qi:0,qAns:[],streak:0,maxStreak:0,earned:0,t:0,tid:null,QS:0,placing:null,mg:{}};

/* ═══ STORAGE ═══ */
async function saveP(){
  if(!S.p)return;
  const key='mtown6_'+S.p.name+'_'+S.p.pin,d=JSON.stringify(S.p);
  try{if(window.storage)await window.storage.set(key,d,true)}catch(e){}
  try{localStorage.setItem(key,d)}catch(e){}
}
async function loadP(n,p){
  const k='mtown6_'+n+'_'+p;
  try{if(window.storage){const r=await window.storage.get(k,true);if(r?.value)return JSON.parse(r.value)}}catch(e){}
  try{const d=localStorage.getItem(k);if(d)return JSON.parse(d)}catch(e){}
  return null
}
function today(){return new Date().toISOString().slice(0,10)}
function expN(lv){return lv*100}
function newP(name,pin){return{name,pin,coins:120,level:1,exp:0,totalC:0,totalA:0,bestStreak:0,totalCE:120,inv:{},town:Array(40).fill(null),landR:5,collect:{},mgDone:{},loginDays:1,lastDay:today()}}

/* ═══ GENERATORS ═══ */
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[rnd(0,a.length-1)]}
const GR={d1:[1,9],d2:[10,99],d3:[100,999],d4:[1000,9999]};
const GENS={
  add(g){const[mn,mx]=GR[g]||[1,9],a=rnd(mn,mx),b=rnd(mn,mx);return{q:`${a} + ${b}`,a:a+b}},
  sub(g){const[mn,mx]=GR[g]||[1,9];let a=rnd(mn,mx),b=rnd(mn,mx);if(a<b)[a,b]=[b,a];return{q:`${a} − ${b}`,a:a-b}},
  mul(g){const m={d1:()=>[rnd(2,9),rnd(2,9)],d2:()=>[rnd(10,99),rnd(2,9)],d3:()=>[rnd(11,99),rnd(11,99)],d4:()=>[rnd(100,999),rnd(11,99)]};const[a,b]=(m[g]||m.d1)();return{q:`${a} × ${b}`,a:a*b}},
  div(g){const[mn,mx]=GR[g]||[1,9],d=rnd(2,9),q=rnd(Math.max(2,Math.ceil(mn/d)),Math.max(2,Math.floor(mx/d)));return{q:`${d*q} ÷ ${d}`,a:q}},
  as(g){const[mn,mx]=GR[g]||[1,9],r=()=>rnd(mn,mx);const ps=[()=>{const a=r(),b=r(),c=r(),v=a+b-c;if(v<0)return null;return{q:`(${a}+${b})−${c}`,a:v}},()=>{const a=r(),b=r();if(a<b)return null;const c=r();return{q:`(${a}−${b})+${c}`,a:a-b+c}}];let res=null,t=0;while(!res&&t++<40)res=pick(ps)();return res||{q:`10+5−3`,a:12}},
  md(g){const[mn,mx]=GR[g]||[1,9],s=()=>rnd(2,9),ps=[()=>{const a=rnd(mn,mx),b=s(),p=a*b;const ds=[];for(let i=2;i<=9;i++)if(p%i===0)ds.push(i);if(!ds.length)return null;const c=pick(ds);return{q:`(${a}×${b})÷${c}`,a:p/c}},()=>{const d=s(),q=rnd(Math.max(2,Math.ceil(mn/d)),Math.max(2,Math.floor(mx/d)));return{q:`${d*q}÷${d}+${rnd(mn,mx)}`,a:q+rnd(mn,mx)}}];let res=null,t=0;while(!res&&t++<50)res=pick(ps)();return res||GENS.mul(g)},
  a4(g){const[mn,mx]=GR[g]||[1,9],r=()=>rnd(mn,mx),s=()=>rnd(2,9);const ps=[()=>{const a=r(),b=r(),c=s();return{q:`(${a}+${b})×${c}`,a:(a+b)*c}},()=>{const a=r(),b=r();if(a<b)return null;const c=s();return{q:`(${a}−${b})×${c}`,a:(a-b)*c}},()=>{const a=r(),b=s(),c=r();return{q:`${a}×${b}+${c}`,a:a*b+c}}];let res=null,t=0;while(!res&&t++<60)res=pick(ps)();return res||{q:`(3+4)×2`,a:14}},
  '99'(){const a=rnd(1,9),b=rnd(1,9);return{q:`${a} × ${b}`,a:a*b}},
  ck(){const h=rnd(1,12),m=[0,5,10,15,20,25,30,35,40,45,50,55][rnd(0,11)];return{q:'',h,m,a:`${h}:${String(m).padStart(2,'0')}`,isClock:true}},
};
function makeQs(mode,grade,n){const g=GENS[mode];return Array.from({length:n},()=>['99','ck'].includes(mode)?g():g(grade))}

/* ═══ CLOCK ═══ */
function clockSVG(h,m,sz=160){
  const cx=sz/2,cy=sz/2,R=sz/2-5;
  const ma=(m/60)*2*Math.PI-Math.PI/2,ha=((h%12)/12+m/720)*2*Math.PI-Math.PI/2;
  const mx=(cx+R*.72*Math.cos(ma)).toFixed(1),my=(cy+R*.72*Math.sin(ma)).toFixed(1);
  const hx=(cx+R*.5*Math.cos(ha)).toFixed(1),hy=(cy+R*.5*Math.sin(ha)).toFixed(1);
  let tks='';for(let i=0;i<60;i++){const a=(i/60)*2*Math.PI-Math.PI/2,iH=i%5===0;tks+=`<line x1="${(cx+(R)*Math.cos(a)).toFixed(1)}" y1="${(cy+(R)*Math.sin(a)).toFixed(1)}" x2="${(cx+(R-(iH?7:3))*Math.cos(a)).toFixed(1)}" y2="${(cy+(R-(iH?7:3))*Math.sin(a)).toFixed(1)}" stroke="${iH?'#4A5568':'#CBD5E0'}" stroke-width="${iH?1.8:.8}"/>`}
  let nms='';for(let i=1;i<=12;i++){const a=(i/12)*2*Math.PI-Math.PI/2,nr=R-17;nms+=`<text x="${(cx+nr*Math.cos(a)).toFixed(1)}" y="${(cy+nr*Math.sin(a)).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="Arial" font-weight="700" fill="#2D3748">${i}</text>`}
  return`<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" xmlns="http://www.w3.org/2000/svg"><circle cx="${cx}" cy="${cy}" r="${R}" fill="#EBF8FF" stroke="#90CDF4" stroke-width="2.5"/>${tks}${nms}<line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#1A365D" stroke-width="4" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#2B6CB0" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4.5" fill="#E53E3E"/></svg>`
}
function parseTime(s){if(!s)return null;s=s.trim();let m;if((m=s.match(/^(\d{1,2})[:\.](\d{2})$/)))return{h:+m[1],min:+m[2]};const ds=s.match(/\d+/g);if(ds?.length>=2)return{h:+ds[0],min:+ds[1]};return null}
function matchTime(s,h,min){const p=parseTime(s);return!!(p&&p.h===h&&p.min===min)}

function fmt(s){if(s<0)s=0;return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

function Grd(id){return GRADES.find(x=>x.id===id)||GRADES[0]}
function Bd(id){return B.find(x=>x.id===id)}

function floatC(el,txt){try{const fc=Object.assign(document.createElement('div'),{className:'FC',textContent:txt});const r=el.getBoundingClientRect();fc.style.cssText=`left:${r.left+r.width/2-20}px;top:${r.top-10}px;`;document.body.appendChild(fc);setTimeout(()=>fc.remove(),1300)}catch(e){}}

/* ═══ CANVAS ═══ */
function initCanvas(){
  const cv=document.getElementById('CC');if(!cv)return;
  const ctx=cv.getContext('2d');S.cvCtx=ctx;S.drawing=false;
  ctx.strokeStyle='#1B2631';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  function gp(e){const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height}}
  cv.addEventListener('pointerdown',e=>{e.preventDefault();S.drawing=true;const p=gp(e);ctx.beginPath();ctx.moveTo(p.x,p.y)},{passive:false});
  cv.addEventListener('pointermove',e=>{e.preventDefault();if(!S.drawing)return;const p=gp(e);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y)},{passive:false});
  cv.addEventListener('pointerup',()=>{S.drawing=false;ctx.beginPath()});
  cv.addEventListener('pointercancel',()=>{S.drawing=false});
}
function clearCanvas(){const cv=document.getElementById('CC');if(cv&&S.cvCtx)S.cvCtx.clearRect(0,0,cv.width,cv.height)}

/* ═══ API ═══ */
async function recognizeHW(isClock){
  const cv=document.getElementById('CC');if(!cv)return null;
  const b64=cv.toDataURL('image/png').split(',')[1];
  const prompt=isClock?'Extract the handwritten time in format H:MM. Respond with ONLY the time.':'Extract the handwritten number. Respond with ONLY the integer number.';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:30,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/png',data:b64}},{type:'text',text:prompt}]}]})});
    const d=await r.json();return d.content?.[0]?.text?.trim()||null;
  }catch(e){return null}
}

function canCollect(i){const c=S.p.collect[i];return c&&c.lastD!==today()}
function collectAll(){
  let total=0,exp=0;
  Object.keys(S.p.collect).forEach(i=>{
    if(!canCollect(i))return;
    const b=Bd(S.p.collect[i].bldId);
    if(!b)return;
    if(b.coin){total+=b.coin;S.p.totalCE=(S.p.totalCE||0)+b.coin}
    if(b.exp)exp+=b.exp;
    S.p.collect[i].lastD=today();
  });
  S.p.coins+=total;if(exp>0){S.p.exp+=exp;checkLevelUp()}
  saveP();return{total,exp}
}

async function submitHW(){
  const btn=document.getElementById('SUB');if(btn)btn.disabled=true;
  const q=S.qs[S.qi],st=document.getElementById('OCR');
  if(st)st.textContent='辨識中…';
  const result=await recognizeHW(q.isClock);
  if(!result){if(st)st.textContent='辨識失敗，請重寫';if(btn)btn.disabled=false;return}
  const ok=q.isClock?matchTime(result,q.h,q.m):!isNaN(parseInt(result))&&parseInt(result)===q.a;
  const gm=Grd(S.grade).m*boostMul();let c=0;
  if(ok){
    S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;
    c=Math.round(10*gm);if(S.streak>=10)c+=25;else if(S.streak>=5)c+=10;else if(S.streak>=3)c+=5;
    if((Date.now()-S.QS)<5000)c+=3;
    S.earned+=c;if(st)st.textContent=`✓ 正確！辨識：${result}`;
    const sb=document.getElementById('SUB');if(sb)floatC(sb,`+${c}🪙`);
  } else {
    S.streak=0;if(st)st.textContent=`✗ 正確答案：${q.a}　辨識：${result}`;
  }
  S.qAns.push({q,ok,c});
  setTimeout(()=>{S.qi++;if(S.qi>=S.qs.length){clrT();finishQ()}else rQuizQ()},ok?700:1300)
}
function startTimer(){clrT();S.tid=setInterval(()=>{S.t--;const el=document.getElementById('QT');if(el){el.textContent=fmt(S.t);el.classList.toggle('URG',S.t<=30)}if(S.t<=0){clrT();finishQ()}},1000)}
function finishQ(){
  while(S.qi<S.qs.length){S.qAns.push({ok:false,c:0});S.qi++}
  const cor=S.qAns.filter(x=>x.ok).length,n=S.qAns.length,pct=cor/n;
  const tB=Math.floor(S.t/60)*5,aB=pct===1?50:pct>=.8?20:pct>=.6?10:0;
  S.earned+=tB+aB;S.p.coins+=S.earned;S.p.totalC=(S.p.totalC||0)+cor;S.p.totalA=(S.p.totalA||0)+n;
  S.p.totalCE=(S.p.totalCE||0)+S.earned;if(S.maxStreak>(S.p.bestStreak||0))S.p.bestStreak=S.maxStreak;

/* ═══ MINI-GAME 1: FLIP CARD ═══ */
function rMg1(){
  // init
  const pairs=MG_PAIRS;
  const cards=[];
  pairs.forEach((pair,pid)=>{
    cards.push({id:cards.length,pairId:pid,text:pair[0],faceUp:false,matched:false});
    cards.push({id:cards.length,pairId:pid,text:pair[1],faceUp:false,matched:false});
  });
  // shuffle
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}
  S.mg={type:'mg1',cards,sel:[],matched:0,t:120,moves:0,done:false};
  clrT();S.tid=setInterval(()=>{
    S.mg.t--;const el=document.getElementById('MG-T');if(el){el.textContent=fmt(S.mg.t);el.style.color=S.mg.t<=20?'#EF4444':'#1976D2'}
    if(S.mg.t<=0){clrT();endMg1()}
  },1000);
  renderMg1()
}
function renderMg1(){
  const mg=S.mg;
  app().innerHTML=`
    <div style="background:#1976D2;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <div><div style="font-size:.78rem;font-weight:700;color:#fff">🃏 翻牌配對</div><div style="font-size:.6rem;color:rgba(255,255,255,.75)">已配 ${mg.matched}/8 對 · ${mg.moves} 步</div></div>

      <button class="BTN B-WH" style="padding:6px 12px;font-size:.75rem" onclick="clrT();go('mghub')">放棄</button>
    </div>
    <div class="SCR" style="background:#F0FAFB">
      <div class="FLIP-GRID">
        ${mg.cards.map((c,i)=>`<div class="FCARD${c.faceUp?' FACE':''}${c.matched?' MATCH':''}" onclick="${c.matched?'':c.faceUp?'':mg.sel.length<2?`flipCard(${i})`:''}">
          ${c.faceUp||c.matched?c.text:'?'}
        </div>`).join('')}
      </div>
    </div>`;
}
function flipCard(i){
  const mg=S.mg;if(mg.done)return;
  const c=mg.cards[i];if(c.faceUp||c.matched||mg.sel.length>=2)return;
  c.faceUp=true;mg.sel.push(i);renderMg1();
  if(mg.sel.length===2){
    mg.moves++;
    const[a,b]=mg.sel.map(x=>mg.cards[x]);
    if(a.pairId===b.pairId){
      a.matched=b.matched=true;mg.matched++;mg.sel=[];
      if(mg.matched>=8){clrT();endMg1()}else renderMg1();
    } else {
      setTimeout(()=>{a.faceUp=b.faceUp=false;mg.sel=[];renderMg1()},900);
    }
  }
}
function endMg1(){
  const mg=S.mg;
  const base=40,timeBonus=mg.matched>=8?Math.min(40,Math.floor(mg.t/3)):0;
  const total=mg.matched>=8?base+timeBonus:Math.round(base*mg.matched/8*0.5);

/* ═══ MINI-GAME 2: SPEED BUBBLES ═══ */
function rMg2(){
  S.mg={type:'mg2',round:0,score:0,t:60,tid:null,done:false,eq:null,opts:[],processing:false};
  clrT();S.tid=setInterval(()=>{S.mg.t--;const el=document.getElementById('MG2-T');if(el){el.textContent=fmt(S.mg.t);el.style.color=S.mg.t<=10?'#EF4444':'#1976D2'}if(S.mg.t<=0){clrT();endMg2()}},1000);
  nextBubble()
}
function nextBubble(){
  const mg=S.mg;if(mg.done||mg.round>=10){clrT();endMg2();return}
  // gen question
  const ops=[['add','+'],['sub','−'],['mul','×'],['div','÷']];
  const[type,sym]=pick(ops);let q,ans;
  if(type==='add'){const a=rnd(2,20),b=rnd(2,20);q=`${a} + ${b}`;ans=a+b}
  else if(type==='sub'){const a=rnd(5,30),b=rnd(1,a-1);q=`${a} − ${b}`;ans=a-b}
  else if(type==='mul'){const a=rnd(2,9),b=rnd(2,9);q=`${a} × ${b}`;ans=a*b}
  else{const a=rnd(2,9),b=rnd(2,9);q=`${a*b} ÷ ${a}`;ans=b}
  mg.eq={q,ans};
  // generate 9 options (1 correct, 8 wrong unique)
  const opts=new Set([ans]);
  while(opts.size<9)opts.add(ans+rnd(-8,8)||(ans+rnd(1,9)));
  const arr=[...opts].sort(()=>Math.random()-.5);
  mg.opts=arr;mg.round++;mg.processing=false;
  renderMg2()
}
function renderMg2(){
  const mg=S.mg;
  app().innerHTML=`
    <div style="background:#E65100;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <div><div style="font-size:.78rem;font-weight:700;color:#fff">⚡ 速算泡泡</div><div style="font-size:.6rem;color:rgba(255,255,255,.8)">${mg.round}/10 回合 · ${mg.score}分</div></div>
      <div id="MG2-T" style="font-size:1.6rem;font-weight:900;color:#fff;font-variant-numeric:tabular-nums">${fmt(mg.t)}</div>
      <button class="BTN B-WH" style="padding:6px 12px;font-size:.75rem" onclick="clrT();go('mghub')">放棄</button>
    </div>
    <div class="SCR" style="background:#FFF3E0">
      <div style="padding:16px 14px;text-align:center">
        <div style="font-size:.74rem;color:#795548;margin-bottom:6px">找出正確答案！</div>
        <div style="font-size:2.2rem;font-weight:900;color:#BF360C;background:#fff;border-radius:14px;padding:12px;border:2px solid #FFCCBC">${mg.eq.q} = ?</div>
      </div>
      <div class="BUBBLE-GRID">
        ${mg.opts.map((v,i)=>`<div class="BUBBLE" id="bb${i}" onclick="tapBubble(${i},${v})">${v}</div>`).join('')}
      </div>
    </div>`;
}
function tapBubble(idx,val){
  const mg=S.mg;if(mg.processing)return;mg.processing=true;
  const el=document.getElementById('bb'+idx);
  if(val===mg.eq.ans){
    mg.score++;if(el){el.classList.add('OK');el.textContent='✓'}
    setTimeout(nextBubble,500)
  } else {
    if(el){el.classList.add('NG');el.textContent='✗'}
    // show correct
    mg.opts.forEach((v,i)=>{if(v===mg.eq.ans){const e=document.getElementById('bb'+i);if(e){e.classList.add('OK');e.textContent='✓'}}});
    setTimeout(nextBubble,1000)
  }
}
function endMg2(){
  const mg=S.mg;
  const base=mg.score*5,timeBonus=Math.min(10,Math.floor(mg.t/6));
  const total=base+timeBonus;
  S.p.coins+=total;S.p.totalCE=(S.p.totalCE||0)+total;
  if(!S.p.mgDone)S.p.mgDone={};S.p.mgDone.mg2=today();saveP();
  app().innerHTML=`<div class="SCR FADE" style="padding-bottom:0">
    <div style="background:#BF360C;padding:30px 14px 20px;text-align:center">
      <div style="font-size:2.5rem;margin-bottom:6px">${mg.score>=9?'🌟🌟🌟':mg.score>=7?'⭐⭐⭐':mg.score>=5?'⭐⭐':'⭐'}</div>
      <div style="font-size:.9rem;color:rgba(255,255,255,.9)">${mg.score>=9?'超強！幾乎全對！':mg.score>=7?'非常棒！':'繼續練習！'}</div>
      <div style="font-size:2.4rem;font-weight:900;color:var(--gold);margin-top:10px;animation:pop .5s ease">+${total}🪙</div>
    </div>
    <div class="PG">
      ${[['答對回合',`${mg.score} / ${mg.round}`],['時間加成',`+🪙 ${timeBonus}`],['合計',`🪙 ${total}`]].map(([l,v])=>`<div class="BDR"><span style="color:var(--t1)">${l}</span><span style="font-weight:900;color:var(--gold2)">${v}</span></div>`).join('')}
      <button class="BTN B-OR BW" onclick="go('mghub')">回小遊戲</button>
      <button class="BTN B-GR BW" onclick="go('home')">回首頁 🏡</button>
    </div>
  </div>`
}

/* ═══ STATS ═══ */
function rStats(){
  const p=S.p,acc=p.totalA?Math.round(p.totalC/p.totalA*100):0;
  const title=p.level>=15?'🏰 傳說城主':p.level>=10?'⚔️ 數學大師':p.level>=7?'📚 知識達人':p.level>=4?'🌟 勤奮學生':'🌱 數學新手';
  const dailyTotal=Object.values(p.collect||{}).reduce((s,c)=>{const b=Bd(c.bldId);return s+(b?.coin||0)+(b?.exp||0)},0);
  app().innerHTML=tbH()+`<div class="SCR FADE"><div class="PG">
    <div class="CARD" style="background:#FFF8E1;border-color:#FFE082;text-align:center;padding:16px">
      <div style="font-size:2rem">${title.split(' ')[0]}</div>
      <div style="font-size:1rem;font-weight:900;color:#1976D2;margin-top:3px">${title.split(' ').slice(1).join(' ')}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
      ${[['🪙','累積金幣',(p.totalCE||0).toLocaleString()],['📝','答題數',(p.totalA||0)+'題'],['✅','答對數',(p.totalC||0)+'題'],['🎯','正確率',acc+'%'],['🔥','最佳連答',(p.bestStreak||0)+'連'],['🏘','小鎮格數',p.landR*5+'格'],['📅','登入天數',(p.loginDays||1)+'天'],['🏠','每日收益',dailyTotal+'🪙/EXP']].map(([ic,l,v])=>`<div style="background:#fff;border-radius:12px;padding:11px 8px;text-align:center;border:1.5px solid #E8F5E9"><div style="font-size:1.3rem">${ic}</div><div style="font-size:1.1rem;font-weight:900;color:#1976D2">${v}</div><div style="font-size:.58rem;color:var(--t2);margin-top:2px">${l}</div></div>`).join('')}
    </div>
    <button class="BTN B-GR BW" style="padding:12px" onclick="go('home')">回首頁 🏡</button>
  </div></div>${bnH('stats')}`
}

/* ═══ INIT ═══ */
function go(s){S.screen=s;if(s==='setup')S.mode=null;if(s==='stats'){rStats();return}render()}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
