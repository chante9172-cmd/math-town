<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1976D2">
<title>數學小鎮</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{font-family:system-ui,sans-serif;background:#F0FAFB;color:#1B2631;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.SCR{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:60px}
.SCR::-webkit-scrollbar{width:0}
:root{--gr:#43A047;--sky:#1976D2;--warm:#FF6B35;--gold:#FFD60A;--gold2:#F59E0B;--rd:#EF4444;--t0:#1B2631;--t1:#4A5568;--t2:#9EA8B1}
.TB{background:#1976D2;padding:12px 14px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.AV{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:2px solid rgba(255,255,255,.6);flex-shrink:0}
.LVB{background:var(--gold);color:#000;font-size:.52rem;font-weight:900;padding:2px 5px;border-radius:5px;margin-left:4px}
.COIN{background:rgba(255,255,255,.2);border-radius:20px;padding:5px 11px;font-size:.88rem;font-weight:900;color:#fff}
.BN{background:#fff;border-top:2px solid #E8F5E9;display:flex;flex-shrink:0;position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;z-index:90}
.BNB{flex:1;padding:8px 2px;background:none;border:none;font-size:.52rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--t2);font-family:inherit}
.BNB.ACT{color:var(--warm)}
.BTN{border:none;border-radius:50px;padding:12px 18px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.88rem}
.BTN:active{transform:scale(.96)}
.B-OR{background:var(--warm);color:#fff}
.B-GR{background:var(--gr);color:#fff}
.B-SK{background:#1976D2;color:#fff}
.B-GD{background:var(--gold);color:#000}
.B-WH{background:#fff;color:var(--t0);border:1.5px solid #E0E7EF}
.B-RD{background:var(--rd);color:#fff}
.BW{width:100%}
.CARD{background:#fff;border-radius:16px;border:1.5px solid #E8F5E9;padding:14px}
.INP{width:100%;background:#F7FBF7;border:1.5px solid #C8E6C9;border-radius:12px;padding:12px 14px;color:var(--t0);font-size:1rem;font-family:inherit;outline:none}
.INP:focus{border-color:var(--gr)}
.INP::placeholder{color:var(--t2)}
.SL{font-size:.58rem;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.OB{flex:1;background:#F7FBF7;border:1.5px solid #C8E6C9;border-radius:10px;padding:9px 4px;text-align:center;cursor:pointer;color:var(--t0)}
.OB.SEL{background:#FFF2EC;border-color:var(--warm)}
.OB .OV{font-size:.88rem;font-weight:900}
.OB .OU{font-size:.58rem;opacity:.65;margin-top:1px}
.GB{background:#F7FBF7;border:1.5px solid #C8E6C9;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;color:var(--t0)}
.GB.SEL{background:#FFF2EC;border-color:var(--warm)}
.MI{background:#fff;border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;border:1.5px solid #E0E7EF}
.MI:active{background:#F7FBF7}
.QHD{background:#1976D2;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.QTMR{font-size:1.8rem;font-weight:900;color:#fff}
.QTMR.URG{color:var(--gold)}
.QEXPR{font-size:2.1rem;font-weight:900;text-align:center}
.AINP{width:100%;background:#F7FBF7;border:2.5px solid #C8E6C9;border-radius:14px;padding:15px;color:var(--t0);font-size:1.9rem;font-weight:900;text-align:center;font-family:inherit;outline:none;-webkit-appearance:none}
.AINP:focus{border-color:#1976D2;background:#EEF5FF}
.AINP.OK{border-color:#43A047;background:#E8F5E9;color:#2E7D32}
.AINP.NG{border-color:#EF4444;background:#FEF2F2;color:#C62828}
input[type=number]::-webkit-inner-spin-button{display:none}
.SD{width:8px;height:8px;border-radius:50%;background:#E0E7EF;display:inline-block;margin:0 1px}
.SD.LIT{background:var(--warm)}
.CL{background:#FFFDE7;border:1.5px solid #FFE082;border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
.TG{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:12px;background:#B7E4C7}
.TT{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;background:#74C69D;border:1.5px solid #52B788;position:relative;flex-direction:column;gap:1px}
.TT:active{transform:scale(.86)}
.TT.HL{border-color:var(--gold);background:#D4F0B7}
.TT.OCC{background:#95D5B2}
.TT.LOCKED{background:#D4E6D4;border-color:#A8C8A8;opacity:.5;cursor:not-allowed}
.CB{position:absolute;top:2px;right:2px;width:13px;height:13px;background:#FF6B35;border-radius:50%;font-size:.48rem;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.ICH{background:#fff;border:1.5px solid #E0E7EF;border-radius:10px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:7px}
.ICH.SEL{border-color:var(--gold);background:#FFFDE7}
.SG{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.SI{background:#fff;border-radius:12px;padding:10px 7px;text-align:center;cursor:pointer;border:1.5px solid #E8F5E9;position:relative}
.SI:active{transform:scale(.95)}
.SI.AF{border-color:var(--gr);background:#F0FFF4}
.SI.LK{opacity:.4;cursor:not-allowed}
.PTAG{display:inline-flex;align-items:center;background:#E8F5E9;border-radius:5px;padding:2px 5px;font-size:.56rem;font-weight:700;color:#2E7D32;margin-top:2px}
.AG{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.AC{background:#fff;border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;border:1.5px solid #E8F5E9}
.AC:active{transform:scale(.95)}
.AC .AI{font-size:1.5rem;margin-bottom:5px}
.AC .AN{font-size:.8rem;font-weight:700}
.AC .AS{font-size:.58rem;color:var(--t2);margin-top:2px}
.XPW{background:#E8F5E9;border-radius:3px;height:5px;margin-top:5px;overflow:hidden}
.XPB{background:linear-gradient(90deg,#43A047,var(--gold));height:100%;border-radius:3px}
.BDR{background:#F7FBF7;border-radius:10px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;font-size:.8rem}
.PG{padding:14px;display:flex;flex-direction:column;gap:13px;background:#F0FAFB}
.HL{background:#FFFDE7;border:1.5px solid #FFE082;border-radius:12px;padding:11px;font-size:.74rem;color:#7B5E00;text-align:center}
.MG-CARD{background:#fff;border-radius:16px;border:2px solid #E8F5E9;padding:16px;cursor:pointer}
.MG-CARD:active{transform:scale(.97)}
.MG-CARD.DONE{opacity:.6;cursor:not-allowed}
.FLIP-GRID{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
.FC{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.72rem;font-weight:700;border:2px solid #C8E6C9;background:#F7FBF7;color:transparent;text-align:center;padding:4px;line-height:1.2}
.FC.FACE{background:#fff;color:var(--t0);border-color:#1976D2}
.FC.MATCH{background:#E8F5E9;color:#2E7D32;border-color:#43A047}
.BUB-GRID{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.BUB{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;font-weight:900;background:#E3F2FD;border:2.5px solid #90CAF9;color:#1565C0}
.BUB:active{transform:scale(.9)}
.BUB.OK{background:#E8F5E9;border-color:#43A047;color:#2E7D32}
.BUB.NG{background:#FEEFEF;border-color:#EF4444;color:#C62828}
.FLOAT{position:fixed;pointer-events:none;animation:fcu 1.2s ease forwards;font-size:.9rem;font-weight:900;color:var(--gold2);z-index:9999;white-space:nowrap}
@keyframes fcu{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-56px)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.FADE{animation:fade .22s ease}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var B=[
  {id:'R',n:'岩石',e:'🪨',c:8},{id:'G',n:'草坪',e:'🌿',c:15},{id:'T',n:'大樹',e:'🌳',c:25},
  {id:'F',n:'花圃',e:'🌸',c:35},{id:'M',n:'蘑菇',e:'🍄',c:25},{id:'W',n:'噴水池',e:'⛲',c:180},
  {id:'V',n:'瞭望塔',e:'🗼',c:380},{id:'Z',n:'魔法塔',e:'🔮',c:600,boost:0.5},
  {id:'H',n:'農舍',e:'🏠',c:80,coin:5},{id:'A',n:'農田',e:'🌾',c:90,coin:8},
  {id:'O',n:'果園',e:'🍎',c:130,coin:12},{id:'P',n:'池塘',e:'🏞️',c:110,coin:6},
  {id:'E',n:'麵包坊',e:'🥖',c:180,coin:15},{id:'K',n:'市集',e:'🏪',c:200,coin:20},
  {id:'J',n:'礦山',e:'⛏️',c:260,coin:28},{id:'C',n:'城堡',e:'🏰',c:800,coin:45},
  {id:'N',n:'宮殿',e:'🏯',c:1200,coin:65},
  {id:'S',n:'學校',e:'🏫',c:280,exp:20},{id:'L',n:'圖書館',e:'📚',c:350,exp:35},{id:'X',n:'神廟',e:'⛩️',c:480,exp:15}
];
var LAND=[{row:6,n:'第6排',c:400,lv:5},{row:7,n:'第7排',c:900,lv:10},{row:8,n:'第8排',c:1800,lv:15}];
var MODES=[
  {id:'add',sym:'+',n:'純加法',c:'#1976D2',g:true,tO:[40,30,20,10]},
  {id:'sub',sym:'−',n:'純減法',c:'#7B1FA2',g:true,tO:[40,30,20,10]},
  {id:'mul',sym:'×',n:'純乘法',c:'#E65100',g:true,tO:[40,30,20,10]},
  {id:'div',sym:'÷',n:'純除法',c:'#00695C',g:true,tO:[40,30,20,10]},
  {id:'as',sym:'±',n:'加減四則',c:'#AD1457',g:true,tO:[40,30,20,10]},
  {id:'a4',sym:'÷±',n:'四則運算',c:'#4A148C',g:true,tO:[40,30,20,10]},
  {id:'99',sym:'9×',n:'九九乘法',c:'#BF360C',g:false,tO:[15,10,5]},
  {id:'ck',sym:'⏰',n:'時鐘題目',c:'#0277BD',g:false,tO:[15,10,5]}
];
var GRADES=[{id:'d1',n:'一位數',m:1},{id:'d2',n:'二位數',m:1.5},{id:'d3',n:'三位數',m:2.5},{id:'d4',n:'四位數',m:4}];
var MG_PAIRS=[['3×4','12'],['8+7','15'],['20÷4','5'],['6×6','36'],['15−8','7'],['9×3','27'],['48÷6','8'],['14+9','23']];
var S={p:null,screen:'login',mode:null,grade:'d1',tl:20,qs:[],qi:0,qAns:[],streak:0,maxStreak:0,earned:0,t:0,tid:null,QS:0,placing:null,cvCtx:null,drawing:false,mg:{}};

async function saveP(){if(!S.p)return;var k='mt6_'+S.p.name+'_'+S.p.pin,d=JSON.stringify(S.p);try{if(window.storage)await window.storage.set(k,d,true)}catch(e){}try{localStorage.setItem(k,d)}catch(e){}}
async function loadP(n,p){var k='mt6_'+n+'_'+p;try{if(window.storage){var r=await window.storage.get(k,true);if(r&&r.value)return JSON.parse(r.value)}}catch(e){}try{var d=localStorage.getItem(k);if(d)return JSON.parse(d)}catch(e){}return null}
function today(){return new Date().toISOString().slice(0,10)}
function expN(lv){return lv*100}
function newP(nm,pn){return{name:nm,pin:pn,coins:120,level:1,exp:0,totalC:0,totalA:0,bestStreak:0,totalCE:120,inv:{},town:Array(40).fill(null),landR:5,collect:{},mgDone:{},loginDays:1,lastDay:today()}}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[rnd(0,a.length-1)]}
function Bd(id){for(var i=0;i<B.length;i++){if(B[i].id===id)return B[i]}return null}
function Md(id){for(var i=0;i<MODES.length;i++){if(MODES[i].id===id)return MODES[i]}return null}
function Gd(id){for(var i=0;i<GRADES.length;i++){if(GRADES[i].id===id)return GRADES[i]}return GRADES[0]}
function fmt(s){if(s<0)s=0;return('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2)}
function clrT(){if(S.tid){clearInterval(S.tid);S.tid=null}}
function app(){return document.getElementById('app')}
function floatC(el,txt){try{var f=document.createElement('div');f.className='FLOAT';f.textContent=txt;var r=el.getBoundingClientRect();f.style.cssText='left:'+(r.left+r.width/2-20)+'px;top:'+(r.top-10)+'px;';document.body.appendChild(f);setTimeout(function(){f.remove()},1300)}catch(e){}}
function boostMul(){for(var i=0;i<S.p.town.length;i++){if(S.p.town[i]==='Z')return 1.5}return 1}
function canCollect(idx){var c=S.p.collect[idx];return c&&c.lastD!==today()}

function initCanvas(){
  var cv=document.getElementById('CC');if(!cv)return;
  var ctx=cv.getContext('2d');S.cvCtx=ctx;S.drawing=false;
  ctx.strokeStyle='#1B2631';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  function gp(e){var r=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*cv.width/r.width,y:(s.clientY-r.top)*cv.height/r.height}}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();S.drawing=true;var p=gp(e);ctx.beginPath();ctx.moveTo(p.x,p.y)},{passive:false});
  cv.addEventListener('pointermove',function(e){e.preventDefault();if(!S.drawing)return;var p=gp(e);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y)},{passive:false});
  cv.addEventListener('pointerup',function(){S.drawing=false;ctx.beginPath()});
  cv.addEventListener('pointercancel',function(){S.drawing=false});
}
function clearCanvas(){var cv=document.getElementById('CC');if(cv&&S.cvCtx)S.cvCtx.clearRect(0,0,cv.width,cv.height)}

async function recognizeHW(isClock){
  var cv=document.getElementById('CC');if(!cv)return null;
  var b64=cv.toDataURL('image/png').split(',')[1];
  var prompt=isClock?'Extract handwritten time as H:MM, respond ONLY with the time.':'Extract handwritten number, respond ONLY with the integer.';
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:30,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/png',data:b64}},{type:'text',text:prompt}]}]})});
    var d=await r.json();return d.content&&d.content[0]?d.content[0].text.trim():null
  }catch(e){return null}
}

function makeQ(mode,grade){
  var r=({d1:[1,9],d2:[10,99],d3:[100,999],d4:[1000,9999]})[grade]||[1,9];
  var a,b;
  if(mode==='add'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);return{q:a+' + '+b,a:a+b}}
  if(mode==='sub'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);if(a<b){var t=a;a=b;b=t}return{q:a+' − '+b,a:a-b}}
  if(mode==='mul'){if(grade==='d1'){a=rnd(2,9);b=rnd(2,9)}else if(grade==='d2'){a=rnd(10,99);b=rnd(2,9)}else{a=rnd(11,99);b=rnd(11,99)}return{q:a+' × '+b,a:a*b}}
  if(mode==='div'){var d=rnd(2,9),q=rnd(Math.max(2,Math.ceil(r[0]/d)),Math.max(2,Math.floor(r[1]/d)));return{q:(d*q)+' ÷ '+d,a:q}}
  if(mode==='as'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);var c=rnd(r[0],r[1]);var v=a+b-c;if(v<0)v=0;return{q:'('+a+'+'+b+')−'+c,a:v}}
  if(mode==='a4'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);var m=rnd(2,9);return{q:'('+a+'+'+b+')×'+m,a:(a+b)*m}}
  if(mode==='99'){a=rnd(1,9);b=rnd(1,9);return{q:a+' × '+b,a:a*b}}
  if(mode==='ck'){var h=rnd(1,12),mn=[0,5,10,15,20,25,30,35,40,45,50,55][rnd(0,11)];return{q:'',h:h,m:mn,a:h+':'+(mn<10?'0':'')+mn,isClock:true}}
  return{q:'1+1',a:2}
}
function makeQs(mode,grade,n){var o=[];for(var i=0;i<n;i++)o.push(makeQ(mode,grade));return o}

function clockSVG(h,m){
  var cx=80,cy=80,R=75;
  var ma=(m/60)*2*Math.PI-Math.PI/2,ha=((h%12)/12+m/720)*2*Math.PI-Math.PI/2;
  var mx=(cx+R*.72*Math.cos(ma)).toFixed(1),my=(cy+R*.72*Math.sin(ma)).toFixed(1);
  var hx=(cx+R*.5*Math.cos(ha)).toFixed(1),hy=(cy+R*.5*Math.sin(ha)).toFixed(1);
  var s='';for(var i=0;i<60;i++){var a=(i/60)*2*Math.PI-Math.PI/2,iH=i%5===0;s+='<line x1="'+(cx+R*Math.cos(a)).toFixed(1)+'" y1="'+(cy+R*Math.sin(a)).toFixed(1)+'" x2="'+(cx+(R-(iH?7:3))*Math.cos(a)).toFixed(1)+'" y2="'+(cy+(R-(iH?7:3))*Math.sin(a)).toFixed(1)+'" stroke="'+(iH?'#555':'#aaa')+'" stroke-width="'+(iH?1.8:.8)+'"/>'}
  var n2='';for(var i=1;i<=12;i++){var a2=(i/12)*2*Math.PI-Math.PI/2;n2+='<text x="'+(cx+(R-17)*Math.cos(a2)).toFixed(1)+'" y="'+(cy+(R-17)*Math.sin(a2)).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="Arial" font-weight="700" fill="#333">'+i+'</text>'}
  return '<svg viewBox="0 0 160 160" width="160" height="160" xmlns="http://www.w3.org/2000/svg"><circle cx="80" cy="80" r="75" fill="#EBF8FF" stroke="#90CDF4" stroke-width="2.5"/>'+s+n2+'<line x1="80" y1="80" x2="'+hx+'" y2="'+hy+'" stroke="#1A365D" stroke-width="4" stroke-linecap="round"/><line x1="80" y1="80" x2="'+mx+'" y2="'+my+'" stroke="#2B6CB0" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="80" r="4.5" fill="#E53E3E"/></svg>'
}
function parseTime(s){if(!s)return null;s=s.trim();var m=s.match(/^(\d{1,2})[:\.](\d{2})$/);if(m)return{h:+m[1],min:+m[2]};var ds=s.match(/\d+/g);if(ds&&ds.length>=2)return{h:+ds[0],min:+ds[1]};return null}
function matchTime(s,h,min){var p=parseTime(s);return!!(p&&p.h===h&&p.min===min)}

function tbH(){
  if(!S.p)return'';
  var p=S.p,ready=0,keys=Object.keys(p.collect||{});
  for(var i=0;i<keys.length;i++){if(canCollect(keys[i]))ready++}
  return'<div class="TB"><div style="display:flex;align-items:center;gap:8px"><div class="AV">🧒</div><div><div style="color:#fff;font-size:.8rem;font-weight:700">'+p.name+'<span class="LVB">Lv.'+p.level+'</span></div><div style="font-size:.54rem;color:rgba(255,255,255,.75)">第'+p.loginDays+'天'+(ready>0?' · 🏠'+ready+'可收':'')+'</div></div></div><div class="COIN">🪙 '+p.coins.toLocaleString()+'</div></div>'
}
function bnH(act){
  var tabs=[['home','🏠','首頁'],['setup','📝','練習'],['shop','🏪','商店'],['town','🏘','小鎮'],['mghub','🎮','小遊戲']];
  var o='<div class="BN">';
  for(var i=0;i<tabs.length;i++){var t=tabs[i];o+='<button class="BNB'+(act===t[0]?' ACT':'')+'" onclick="go(\''+t[0]+'\')"><span style="font-size:1rem">'+t[1]+'</span>'+t[2]+'</button>'}
  return o+'</div>'
}
function go(s){S.screen=s;if(s==='setup')S.mode=null;render()}
function render(){
  clrT();

async function doLogin(){
  var ni=document.getElementById('ni'),pi=document.getElementById('pi'),err=document.getElementById('lerr');
  var name=(ni?ni.value:'').trim().toLowerCase(),pin=(pi?pi.value:'').trim();
  if(!name){if(err)err.textContent='請輸入名字';return}
  if(!/^\d{4}$/.test(pin)){if(err)err.textContent='PIN 需為 4 位數字';return}
  var lb=document.getElementById('lb');if(lb){lb.textContent='載入中...';lb.disabled=true}
  var p=await loadP(name,pin);
  if(!p)p=newP(name,pin);
  if(!p.collect)p.collect={};if(!p.mgDone)p.mgDone={};if(!p.landR)p.landR=5;
  while(p.town.length<40)p.town.push(null);
  if(p.lastDay!==today()){p.coins+=20;p.totalCE=(p.totalCE||0)+20;p.lastDay=today();p.loginDays=(p.loginDays||0)+1}
  S.p=p;await saveP();S.screen='home';render()
}

function checkLvUp(){
  while(S.p.exp>=expN(S.p.level)){
    S.p.exp-=expN(S.p.level);S.p.level++;
    var b=S.p.level*15;S.p.coins+=b;S.p.totalCE=(S.p.totalCE||0)+b;
    var el=document.createElement('div');
    el.style.cssText='position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--gold);border-radius:20px;padding:22px 28px;text-align:center;z-index:9999;animation:pop .4s ease;max-width:240px';
    el.innerHTML='<div style="font-size:2rem">⭐</div><div style="font-size:1.2rem;font-weight:900;color:#1976D2;margin-top:4px">升級！Lv.'+S.p.level+'</div><div style="font-size:.8rem;color:#2E7D32;margin-top:3px">+'+b+'🪙</div>';
    document.body.appendChild(el);setTimeout(function(){el.remove()},2500)
  }
}

function collectAll(){
  var total=0,exp=0,keys=Object.keys(S.p.collect);
  for(var i=0;i<keys.length;i++){
    var k=keys[i];if(!canCollect(k))continue;
    var b=Bd(S.p.collect[k].bldId);if(!b)continue;
    if(b.coin){total+=b.coin;S.p.totalCE=(S.p.totalCE||0)+b.coin}
    if(b.exp)exp+=b.exp;
    S.p.collect[k].lastD=today()
  }
  S.p.coins+=total;if(exp>0){S.p.exp+=exp;checkLvUp()}
  saveP();return{total:total,exp:exp}
}

async function submitHW(){
  var btn=document.getElementById('SUB');if(btn)btn.disabled=true;
  var q=S.qs[S.qi],st=document.getElementById('OCR');
  if(st)st.textContent='辨識中…';
  var result=await recognizeHW(q.isClock);
  if(!result){if(st)st.textContent='辨識失敗，請重寫';if(btn)btn.disabled=false;return}
  var ok=q.isClock?matchTime(result,q.h,q.m):(!isNaN(parseInt(result))&&parseInt(result)===q.a);
  var gm=Gd(S.grade).m*boostMul(),c=0;
  if(ok){S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;c=Math.round(10*gm);if(S.streak>=10)c+=25;else if(S.streak>=5)c+=10;else if(S.streak>=3)c+=5;if((Date.now()-S.QS)<5000)c+=3;S.earned+=c;if(st)st.textContent='✓ 正確！辨識：'+result;var sb=document.getElementById('SUB');if(sb)floatC(sb,'+'+c+'🪙')}
  else{S.streak=0;if(st)st.textContent='✗ 正確答案：'+q.a+'　辨識：'+result}
  S.qAns.push({ok:ok,c:c});
  setTimeout(function(){S.qi++;if(S.qi>=S.qs.length){clrT();finishQ()}else rQuizQ()},ok?700:1300)
}

function startTimer(){clrT();S.tid=setInterval(function(){S.t--;var el=document.getElementById('QT');if(el){el.textContent=fmt(S.t);if(S.t<=30)el.classList.add('URG');else el.classList.remove('URG')}if(S.t<=0){clrT();finishQ()}},1000)}

function finishQ(){
  while(S.qi<S.qs.length){S.qAns.push({ok:false,c:0});S.qi++}
  var cor=0;for(var i=0;i<S.qAns.length;i++){if(S.qAns[i].ok)cor++}
  var n=S.qAns.length,pct=cor/n,tB=Math.floor(S.t/60)*5,aB=pct===1?50:pct>=.8?20:pct>=.6?10:0;
  S.earned+=tB+aB;S.p.coins+=S.earned;S.p.totalC=(S.p.totalC||0)+cor;S.p.totalA=(S.p.totalA||0)+n;
  S.p.totalCE=(S.p.totalCE||0)+S.earned;if(S.maxStreak>(S.p.bestStreak||0))S.p.bestStreak=S.maxStreak;
  S.p.exp+=cor*5;checkLvUp();saveP();rResults(tB,aB)
}

function rResults(tB,aB){
  var cor=0;for(var i=0;i<S.qAns.length;i++){if(S.qAns[i].ok)cor++}
  var n=S.qAns.length,pct=Math.round(cor/n*100),stars=pct===100?'🌟🌟🌟':pct>=80?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
  var base=0;for(var i=0;i<S.qAns.length;i++)base+=(S.qAns[i].c||0);
  var rows=[['📝 答題','🪙 '+base],['🔥 連答','×'+S.maxStreak],['⏰ 時間','+🪙 '+tB],['🎯 正確率','+🪙 '+aB],['💰 合計','🪙 '+S.earned]];
  var rH='';for(var i=0;i<rows.length;i++)rH+='<div class="BDR"><span style="color:var(--t1)">'+rows[i][0]+'</span><span style="font-weight:900;color:var(--gold2)">'+rows[i][1]+'</span></div>';
  app().innerHTML='<div class="SCR FADE" style="padding-bottom:0"><div style="background:#1565C0;padding:28px 14px 18px;text-align:center"><div style="font-size:2.5rem;margin-bottom:6px">'+stars+'</div><div style="font-size:.88rem;color:rgba(255,255,255,.9)">'+(pct===100?'完美全對！':pct>=80?'非常棒！':pct>=60?'不錯！':'繼續加油！')+'</div><div style="font-size:2.5rem;font-weight:900;color:var(--gold);margin-top:10px;animation:pop .5s ease">+'+S.earned+' 🪙</div><div style="font-size:.7rem;color:rgba(255,255,255,.7);margin-top:3px">現有 '+S.p.coins.toLocaleString()+' 🪙</div></div><div class="PG">'+rH+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><button class="BTN B-OR" onclick="startQ()">再練一次</button><button class="BTN B-GR" onclick="go(\'shop\')">去商店</button></div><button class="BTN B-WH BW" onclick="go(\'home\')">回首頁 🏡</button></div></div>'

}
function buyB(id){var b=Bd(id);if(!b||S.p.coins<b.c)return;S.p.coins-=b.c;S.p.inv[id]=(S.p.inv[id]||0)+1;var el=document.getElementById('si_'+id);if(el)floatC(el,'-'+b.c+'🪙');setTimeout(function(){saveP();rShop()},300)}
function buyLand(row){var l=null;for(var i=0;i<LAND.length;i++){if(LAND[i].row===row){l=LAND[i];break}}if(!l||S.p.coins<l.c||S.p.level<l.lv||S.p.landR>=row)return;S.p.coins-=l.c;S.p.landR=row;saveP();rShop()}

function rTown(){
  var p=S.p,pl=S.placing,tiles=p.landR*5,ready=0,keys=Object.keys(p.collect||{});
  for(var i=0;i<keys.length;i++){if(canCollect(keys[i]))ready++}
  var inv=[];var invK=Object.keys(p.inv||{});for(var i=0;i<invK.length;i++){if(p.inv[invK[i]]>0){var b=Bd(invK[i]);if(b)inv.push(Object.assign({},b,{cnt:p.inv[invK[i]]}))}}
  var gH='';
  for(var i=0;i<40;i++){
    var inR=i<tiles,b=inR?p.town[i]:null,bd=Bd(b),isHL=pl&&inR&&!b,rdy=inR&&b&&canCollect(i.toString()),prod=b&&Bd(b)&&(Bd(b).coin||Bd(b).exp);
    if(!inR){gH+='<div class="TT LOCKED" style="font-size:.6rem;color:#888">🔒</div>'}
    else if(b){var fn=rdy&&prod?'collectTile('+i+')':'showTileMenu('+i+')';gH+='<div class="TT OCC" onclick="'+fn+'">'+(bd?bd.e:'')+(rdy&&prod?'<div class="CB">!</div>':'')+'</div>'}
    else if(isHL){gH+='<div class="TT HL" onclick="plcT('+i+')" style="animation:none;border-color:var(--gold);background:#D4F0B7">　</div>'}
    else{gH+='<div class="TT">　</div>'}
  }
  var iH='';
  if(inv.length>0){iH='<div><div class="SL">📦 庫存</div><div style="display:flex;flex-wrap:wrap;gap:6px">';for(var i=0;i<inv.length;i++){var b=inv[i],prod=b.coin?'+🪙'+b.coin+'/天':b.exp?'+⭐'+b.exp+'/天':b.boost?'×'+(1+b.boost):'裝飾';iH+='<div class="ICH'+(pl===b.id?' SEL':'')+'" onclick="S.placing=\''+b.id+'\';rTown()"><span style="font-size:1.2rem">'+b.e+'</span><div><div style="font-size:.7rem;font-weight:700">'+b.n+'</div><div style="font-size:.56rem;color:var(--t2)">'+prod+' ×'+b.cnt+'</div></div></div>'}iH+='</div></div>'}
  else iH='<div style="text-align:center;font-size:.74rem;color:var(--t2);padding:6px">庫存空，去商店購買！</div>';
  app().innerHTML=tbH()+'<div class="SCR FADE"><div style="background:#1565C0;padding:10px 14px"><div style="font-size:.76rem;font-weight:700;color:#fff">🏘 我的小鎮 ('+tiles+'格·'+p.landR+'行) '+(ready>0?'· 🔔'+ready+'棟可收':'')+'</div>'+(pl?'<div style="font-size:.68rem;color:var(--gold);margin-top:3px">放置 '+Bd(pl).e+' '+Bd(pl).n+' · 點空格放置 <span onclick="S.placing=null;rTown()" style="color:#FF8A80;cursor:pointer;text-decoration:underline">取消</span></div>':'')+'</div><div class="TG">'+gH+'</div><div class="PG">'+iH+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><button class="BTN B-SK" style="padding:10px;font-size:.78rem" onclick="go(\'shop\')">🏪 商店</button>'+(ready>0?'<button class="BTN B-GD" style="padding:10px;font-size:.78rem" onclick="doCollectAll();go(\'home\')">🌾 一鍵收取('+ready+')</button>':'<button class="BTN B-WH" style="padding:10px;font-size:.78rem" onclick="go(\'home\')">🏡 回首頁</button>')+'</div></div></div>'+bnH('town')
}
function collectTile(i){if(!canCollect(i.toString()))return;var b=Bd(S.p.town[i]);if(!b)return;var coins=0,exp=0;if(b.coin){coins=b.coin;S.p.coins+=coins;S.p.totalCE=(S.p.totalCE||0)+coins}if(b.exp){exp=b.exp;S.p.exp+=exp;checkLvUp()}S.p.collect[i.toString()].lastD=today();var tiles=document.querySelectorAll('.TT');if(tiles[i])floatC(tiles[i],coins?'+'+coins+'🪙':'+'+exp+'⭐');saveP();setTimeout(rTown,300)}
function plcT(i){if(!S.placing||S.p.town[i]||i>=S.p.landR*5)return;S.p.town[i]=S.placing;S.p.inv[S.placing]--;if(S.p.inv[S.placing]<=0)delete S.p.inv[S.placing];var b=Bd(S.placing);if(b&&(b.coin||b.exp))S.p.collect[i.toString()]={bldId:S.placing,lastD:''};var hasMore=false,kk=Object.keys(S.p.inv);for(var k=0;k<kk.length;k++){if(S.p.inv[kk[k]]>0){hasMore=true;break}}if(!hasMore)S.placing=null;saveP();rTown()}
function showTileMenu(i){var b=S.p.town[i];if(!b)return;var bd=Bd(b),ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9998';ov.innerHTML='<div style="background:#fff;border-radius:20px 20px 0 0;padding:18px 16px 28px;width:100%;max-width:480px;margin:0 auto"><div style="text-align:center;font-size:2.2rem;margin-bottom:6px">'+bd.e+'</div><div style="text-align:center;font-weight:700;font-size:.95rem;margin-bottom:4px">'+bd.n+'</div>'+(bd.coin?'<div style="text-align:center;font-size:.72rem;color:var(--gr);margin-bottom:12px">每日生產 🪙 '+bd.coin+'</div>':'')+(bd.exp?'<div style="text-align:center;font-size:.72rem;color:#1976D2;margin-bottom:12px">每日生產 ⭐ '+bd.exp+' EXP</div>':'')+'<button onclick="rmT('+i+')" style="display:block;width:100%;padding:13px;background:var(--rd);color:#fff;border:none;border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px">🗑 收回到庫存</button><button onclick="this.parentElement.parentElement.remove()" style="display:block;width:100%;padding:11px;background:#F7F9FA;border:1.5px solid #E0E7EF;color:var(--t0);border-radius:12px;font-size:.88rem;cursor:pointer;font-family:inherit">取消</button></div>';ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()});document.body.appendChild(ov)}
function rmT(i){var id=S.p.town[i];if(!id)return;S.p.town[i]=null;S.p.inv[id]=(S.p.inv[id]||0)+1;delete S.p.collect[i.toString()];saveP();var ovs=document.querySelectorAll('[style*="inset:0"]');for(var i2=0;i2<ovs.length;i2++)ovs[i2].remove();rTown()}

function rMgHub(){
  var p=S.p,mg1done=p.mgDone&&p.mgDone.mg1===today(),mg2done=p.mgDone&&p.mgDone.mg2===today();
  app().innerHTML=tbH()+'<div class="SCR FADE"><div class="PG"><div style="font-size:.9rem;font-weight:700">🎮 每日小遊戲</div><div style="font-size:.72rem;color:var(--t2)">每個遊戲每天可玩一次，明天重置！</div><div class="MG-CARD'+(mg1done?' DONE':'')+'" onclick="'+(mg1done?'':'go(\'mg1\')')+'""><div style="display:flex;align-items:center;gap:12px"><div style="width:50px;height:50px;border-radius:14px;background:#E3F2FD;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0">🃏</div><div style="flex:1"><div style="font-weight:700;font-size:.9rem">翻牌配對</div><div style="font-size:.68rem;color:var(--t2);margin-top:2px">翻開卡片，配對算式和答案</div><div style="font-size:.68rem;color:var(--gr);margin-top:2px">獎勵：最高 🪙 80</div></div><div style="font-size:.75rem;font-weight:700;color:'+(mg1done?'var(--t2)':'#1976D2')+'">'+(mg1done?'✅ 完成':'▶ 開始')+'</div></div></div><div class="MG-CARD'+(mg2done?' DONE':'')+'" onclick="'+(mg2done?'':'go(\'mg2\')')+'""><div style="display:flex;align-items:center;gap:12px"><div style="width:50px;height:50px;border-radius:14px;background:#FFF3E0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0">⚡</div><div style="flex:1"><div style="font-weight:700;font-size:.9rem">速算泡泡</div><div style="font-size:.68rem;color:var(--t2);margin-top:2px">60秒快速選出正確答案</div><div style="font-size:.68rem;color:var(--gr);margin-top:2px">獎勵：最高 🪙 60</div></div><div style="font-size:.75rem;font-weight:700;color:'+(mg2done?'var(--t2)':'#E65100')+'">'+(mg2done?'✅ 完成':'▶ 開始')+'</div></div></div><div class="CARD" style="background:#FFF8E1;border-color:#FFE082;font-size:.72rem;color:#7B5E00;text-align:center">🎁 今日已獲 '+((mg1done?40:0)+(mg2done?30:0))+'🪙+ 獎勵</div></div></div>'+bnH('mghub')
}

function rMg1(){
  var cards=[];for(var i=0;i<MG_PAIRS.length;i++){cards.push({id:cards.length,pairId:i,text:MG_PAIRS[i][0],faceUp:false,matched:false});cards.push({id:cards.length,pairId:i,text:MG_PAIRS[i][1],faceUp:false,matched:false})}
  for(var i=cards.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=cards[i];cards[i]=cards[j];cards[j]=t}
  S.mg={type:'mg1',cards:cards,sel:[],matched:0,t:120,moves:0};
  clrT();S.tid=setInterval(function(){S.mg.t--;var el=document.getElementById('MG-T');if(el){el.textContent=fmt(S.mg.t);el.style.color=S.mg.t<=20?'#EF4444':'#1976D2'}if(S.mg.t<=0){clrT();endMg1()}},1000);renderMg1()
}
function renderMg1(){
  var mg=S.mg,gH='';
  for(var i=0;i<mg.cards.length;i++){var c=mg.cards[i],oc=(!c.matched&&!c.faceUp&&mg.sel.length<2)?'flipCard('+i+')':'';gH+='<div class="FC'+(c.faceUp?' FACE':'')+(c.matched?' MATCH':'')+'" onclick="'+oc+'">'+(c.faceUp||c.matched?c.text:'?')+'</div>'}
  app().innerHTML='<div style="background:#1976D2;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0"><div><div style="font-size:.78rem;font-weight:700;color:#fff">🃏 翻牌配對</div><div style="font-size:.6rem;color:rgba(255,255,255,.75)">已配 '+mg.matched+'/8 · '+mg.moves+' 步</div></div><div id="MG-T" style="font-size:1.6rem;font-weight:900;color:#fff">'+fmt(mg.t)+'</div><button class="BTN B-WH" style="padding:6px 12px;font-size:.75rem" onclick="clrT();go(\'mghub\')">放棄</button></div><div class="SCR" style="background:#F0FAFB"><div class="FLIP-GRID">'+gH+'</div></div>'
}
function flipCard(i){var mg=S.mg,c=mg.cards[i];if(c.faceUp||c.matched||mg.sel.length>=2)return;c.faceUp=true;mg.sel.push(i);renderMg1();if(mg.sel.length===2){mg.moves++;var a=mg.cards[mg.sel[0]],b=mg.cards[mg.sel[1]];if(a.pairId===b.pairId){a.matched=b.matched=true;mg.matched++;mg.sel=[];if(mg.matched>=8){clrT();endMg1()}else renderMg1()}else{setTimeout(function(){a.faceUp=b.faceUp=false;mg.sel=[];renderMg1()},900)}}}
function endMg1(){var mg=S.mg,base=40,tB=mg.matched>=8?Math.min(40,Math.floor(mg.t/3)):0,total=mg.matched>=8?base+tB:Math.round(base*mg.matched/8*.5);S.p.coins+=total;S.p.totalCE=(S.p.totalCE||0)+total;if(!S.p.mgDone)S.p.mgDone={};S.p.mgDone.mg1=today();saveP();app().innerHTML='<div class="SCR FADE" style="padding-bottom:0"><div style="background:#1565C0;padding:30px 14px 20px;text-align:center"><div style="font-size:2.5rem;margin-bottom:6px">'+(mg.matched>=8?'🌟🌟🌟':mg.matched>=6?'⭐⭐⭐':'⭐⭐')+'</div><div style="font-size:.9rem;color:rgba(255,255,255,.9)">'+(mg.matched>=8?'全部配對！':'完成了 '+mg.matched+'/8')+'</div><div style="font-size:2.4rem;font-weight:900;color:var(--gold);margin-top:10px;animation:pop .5s ease">+'+total+'🪙</div></div><div class="PG"><div class="BDR"><span style="color:var(--t1)">配對組數</span><span style="font-weight:900;color:var(--gold2)">'+mg.matched+'/8</span></div><div class="BDR"><span style="color:var(--t1)">時間加成</span><span style="font-weight:900;color:var(--gold2)">+🪙 '+tB+'</span></div><div class="BDR"><span style="color:var(--t1)">合計</span><span style="font-weight:900;color:var(--gold2)">🪙 '+total+'</span></div><button class="BTN B-SK BW" onclick="go(\'mghub\')">回小遊戲</button><button class="BTN B-GR BW" onclick="go(\'home\')">回首頁 🏡</button></div></div>'}

function rMg2(){S.mg={type:'mg2',round:0,score:0,t:60,eq:null,opts:[],proc:false};clrT();S.tid=setInterval(function(){S.mg.t--;var el=document.getElementById('MG2-T');if(el){el.textContent=fmt(S.mg.t);el.style.color=S.mg.t<=10?'#EF4444':'#1976D2'}if(S.mg.t<=0){clrT();endMg2()}},1000);nextBub()}
function nextBub(){var mg=S.mg;if(mg.round>=10){clrT();endMg2();return}var ops=['add','sub','mul','div'],op=ops[rnd(0,3)],q,ans;if(op==='add'){var a=rnd(2,20),b=rnd(2,20);q=a+' + '+b;ans=a+b}else if(op==='sub'){var a=rnd(5,30),b=rnd(1,a-1);q=a+' − '+b;ans=a-b}else if(op==='mul'){var a=rnd(2,9),b=rnd(2,9);q=a+' × '+b;ans=a*b}else{var a=rnd(2,9),b=rnd(2,9);q=(a*b)+' ÷ '+a;ans=b}mg.eq={q:q,ans:ans};var opts={};opts[ans]=true;var t=0;while(Object.keys(opts).length<9&&t++<100){var w=ans+rnd(-8,8);if(w!==ans&&w>0)opts[w]=true}mg.opts=Object.keys(opts).map(Number).sort(function(){return Math.random()-.5});mg.round++;mg.proc=false;renderMg2()}
function renderMg2(){var mg=S.mg,bH='';for(var i=0;i<mg.opts.length;i++)bH+='<div class="BUB" id="bb'+i+'" onclick="tapBub('+i+','+mg.opts[i]+')">'+mg.opts[i]+'</div>';app().innerHTML='<div style="background:#E65100;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0"><div><div style="font-size:.78rem;font-weight:700;color:#fff">⚡ 速算泡泡</div><div style="font-size:.6rem;color:rgba(255,255,255,.8)">'+mg.round+'/10 · '+mg.score+'分</div></div><div id="MG2-T" style="font-size:1.6rem;font-weight:900;color:#fff">'+fmt(mg.t)+'</div><button class="BTN B-WH" style="padding:6px 12px;font-size:.75rem" onclick="clrT();go(\'mghub\')">放棄</button></div><div class="SCR" style="background:#FFF3E0"><div style="padding:16px 14px;text-align:center"><div style="font-size:.74rem;color:#795548;margin-bottom:6px">找出正確答案！</div><div style="font-size:2.2rem;font-weight:900;color:#BF360C;background:#fff;border-radius:14px;padding:12px;border:2px solid #FFCCBC">'+mg.eq.q+' = ?</div></div><div class="BUB-GRID">'+bH+'</div></div>'}
function tapBub(idx,val){var mg=S.mg;if(mg.proc)return;mg.proc=true;var el=document.getElementById('bb'+idx);if(val===mg.eq.ans){mg.score++;if(el){el.classList.add('OK');el.textContent='✓'}setTimeout(nextBub,500)}else{if(el){el.classList.add('NG');el.textContent='✗'}for(var i=0;i<mg.opts.length;i++){if(mg.opts[i]===mg.eq.ans){var e2=document.getElementById('bb'+i);if(e2){e2.classList.add('OK');e2.textContent='✓'}}}setTimeout(nextBub,1000)}}
function endMg2(){var mg=S.mg,base=mg.score*5,tB=Math.min(10,Math.floor(mg.t/6)),total=base+tB;S.p.coins+=total;S.p.totalCE=(S.p.totalCE||0)+total;if(!S.p.mgDone)S.p.mgDone={};S.p.mgDone.mg2=today();saveP();app().innerHTML='<div class="SCR FADE" style="padding-bottom:0"><div style="background:#BF360C;padding:30px 14px 20px;text-align:center"><div style="font-size:2.5rem;margin-bottom:6px">'+(mg.score>=9?'🌟🌟🌟':mg.score>=7?'⭐⭐⭐':mg.score>=5?'⭐⭐':'⭐')+'</div><div style="font-size:.9rem;color:rgba(255,255,255,.9)">'+(mg.score>=9?'超強！':'繼續練習！')+'</div><div style="font-size:2.4rem;font-weight:900;color:var(--gold);margin-top:10px;animation:pop .5s ease">+'+total+'🪙</div></div><div class="PG"><div class="BDR"><span style="color:var(--t1)">答對回合</span><span style="font-weight:900;color:var(--gold2)">'+mg.score+'/'+mg.round+'</span></div><div class="BDR"><span style="color:var(--t1)">合計</span><span style="font-weight:900;color:var(--gold2)">🪙 '+total+'</span></div><button class="BTN B-OR BW" onclick="go(\'mghub\')">回小遊戲</button><button class="BTN B-GR BW" onclick="go(\'home\')">回首頁 🏡</button></div></div>'}

function rStats(){
  var p=S.p,acc=p.totalA?Math.round(p.totalC/p.totalA*100):0;
  var title=p.level>=15?'🏰 傳說城主':p.level>=10?'⚔️ 數學大師':p.level>=7?'📚 知識達人':p.level>=4?'🌟 勤奮學生':'🌱 數學新手';
  var daily=0,keys=Object.keys(p.collect||{});for(var i=0;i<keys.length;i++){var b=Bd(p.collect[keys[i]].bldId);if(b)daily+=(b.coin||0)+(b.exp||0)}
  var stats=[['🪙','累積金幣',(p.totalCE||0).toLocaleString()],['📝','答題數',(p.totalA||0)+'題'],['✅','答對數',(p.totalC||0)+'題'],['🎯','正確率',acc+'%'],['🔥','最佳連答',(p.bestStreak||0)+'連'],['🏘','土地格數',p.landR*5+'格'],['📅','登入天數',(p.loginDays||1)+'天'],['🏠','每日收益',daily+'🪙/EXP']],sH='';
  for(var i=0;i<stats.length;i++)sH+='<div style="background:#fff;border-radius:12px;padding:11px 8px;text-align:center;border:1.5px solid #E8F5E9"><div style="font-size:1.3rem">'+stats[i][0]+'</div><div style="font-size:1.1rem;font-weight:900;color:#1976D2">'+stats[i][2]+'</div><div style="font-size:.58rem;color:var(--t2);margin-top:2px">'+stats[i][1]+'</div></div>';
  app().innerHTML=tbH()+'<div class="SCR FADE"><div class="PG"><div class="CARD" style="background:#FFF8E1;border-color:#FFE082;text-align:center;padding:16px"><div style="font-size:2rem">'+title.split(' ')[0]+'</div><div style="font-size:1rem;font-weight:900;color:#1976D2;margin-top:3px">'+title.split(' ').slice(1).join(' ')+'</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'+sH+'</div><button class="BTN B-GR BW" style="padding:12px" onclick="go(\'home\')">回首頁 🏡</button></div></div>'+bnH('stats')
}

render();
