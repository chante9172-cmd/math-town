  ov.querySelector('button').addEventListener('click',function(e){
    e.stopPropagation();
    if(!(S.p.inv[req.need]>=req.amt)){toast('物品不足！');ov.remove();activeCitizenReq=null;return}
    S.p.inv[req.need]-=req.amt;if(S.p.inv[req.need]<=0)delete S.p.inv[req.need];

  document.body.appendChild(ov);

}

  var wctx=wheelCv.getContext('2d');
  var spinOff=0;
  function drawWheel(offset){
    wctx.fillStyle='#1B2631';wctx.fillRect(0,0,320,90);
    var iW=72,cx=160;
    var startI=Math.floor(offset/iW)-2;
    for(var di=startI;di<startI+8;di++){
      var px=cx+(di-(offset/iW))*iW;
      if(px<-iW||px>320+iW)continue;
      var pr=prizes[((di%prizes.length)+prizes.length*100)%prizes.length];
      wctx.font='36px serif';wctx.textAlign='center';wctx.textBaseline='middle';
      wctx.fillText(pr.e,px,45);
    }
    wctx.strokeStyle='#FFD700';wctx.lineWidth=3;
    wctx.strokeRect(cx-iW/2-2,2,iW+4,86);
    wctx.fillStyle='#FFD700';wctx.beginPath();
    wctx.moveTo(cx-10,0);wctx.lineTo(cx+10,0);wctx.lineTo(cx,16);wctx.closePath();wctx.fill();
  }
  drawWheel(0);
  // Result display
  var result=document.createElement('div');
  result.style.cssText='min-height:50px;font-size:.9rem;font-weight:700;color:#2E7D32;margin-bottom:10px';

  spinBtn.addEventListener('click',function(){
    if(!S.p||S.p.coins<spinCost){toast('金幣不足！需要🪙'+spinCost+'，你有🪙'+(S.p?S.p.coins:0));return}
    S.p.coins-=spinCost;saveP();
    spinBtn.disabled=true;result.innerHTML='';
    var winIdx=Math.floor(Math.random()*prizes.length);
    var winner=prizes[winIdx];
    var iW=72,startOff=spinOff,targetOff=startOff+iW*28+winIdx*iW;
    var startT=Date.now(),dur=1800;
    function animate(){
      var t=Math.min(1,(Date.now()-startT)/dur);
      var ease=1-Math.pow(1-t,3);
      spinOff=startOff+(targetOff-startOff)*ease;
      drawWheel(spinOff);
      if(t<1){requestAnimationFrame(animate);return;}
      // Award
      if(winner.type==='coin'){S.p.coins+=winner.val;S.p.totalCE=(S.p.totalCE||0)+winner.val;}
      else if(winner.type==='exp'){S.p.exp+=winner.val;checkLv();}
      else if(winner.type==='bldg'){
        var bldgs=Object.values(IT).filter(function(b){return!b.lv||S.p.level>=b.lv-2});
        var rb=bldgs[Math.floor(Math.random()*bldgs.length)];
        S.p.bldgInv[rb.id]=(S.p.bldgInv[rb.id]||0)+1;winner.n='獲得 '+rb.e+rb.n+'！';
      }
      saveP();
      var coinEl=document.querySelector('.COINB');if(coinEl)coinEl.textContent='🪙 '+S.p.coins.toLocaleString();
      result.innerHTML='<div style="font-size:2rem;margin-bottom:4px">'+winner.e+'</div><div style="font-size:.95rem">'+winner.n+'</div>';
      result.style.color=winner.val>=100||winner.type==='bldg'?'#E65100':'#2E7D32';
      spinBtn.disabled=false;spinBtn.textContent='🎰 再轉一次！（🪙'+spinCost+'）';
      if(winner.type==='coin'&&winner.val>=100||winner.type==='bldg'){
        for(var ci=0;ci<6;ci++){(function(d){setTimeout(function(){
          var dr=document.createElement('div');dr.style.cssText='position:fixed;font-size:1.5rem;pointer-events:none;z-index:9999;animation:df 1.8s ease forwards;top:15%;left:'+Math.round(10+Math.random()*80)+'%';
          dr.textContent=['🪙','⭐','🎊','✨'][Math.floor(Math.random()*4)];
          document.body.appendChild(dr);setTimeout(function(){dr.remove()},1900);
        },d*120)})(ci);}
      }
    }
    animate();
  });
  box.appendChild(spinBtn);
  var cl=document.createElement('button');cl.className='BTN B-WH BW';cl.style.cssText='padding:10px;margin-top:6px;font-size:.85rem';cl.textContent='關閉';cl.addEventListener('click',function(){ov.remove()});
  box.appendChild(cl);ov.appendChild(box);
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()});
  document.body.appendChild(ov);
}

  {e:'☀️',msg:'陽光燦爛！農作物生長加速！',fn:function(){toast('☀️ 農作物生長加速！');}},
  {e:'🧙',msg:'旅行魔法師路過，送你金幣！',fn:function(){var g=20+Math.floor(Math.random()*30);S.p.coins+=g;S.p.totalCE=(S.p.totalCE||0)+g;toast('🧙 旅行魔法師送你 🪙'+g+'！');saveP();}},
  {e:'🎪',msg:'節日慶典！所有訂單獎勵×2！',fn:function(){toast('🎪 節日慶典開始！完成訂單獎勵加倍！');S._festivalOn=true;setTimeout(function(){S._festivalOn=false;},120000);}},
  {e:'⚡',msg:'暴風雨來了！小心農作物！',fn:function(){toast('⚡ 暴風雨！小心農作物～');}},
  {e:'🐝',msg:'蜜蜂造訪！花圃產了蜂蜜！',fn:function(){S.p.inv.honey=(S.p.inv.honey||0)+3;saveP();toast('🐝 蜜蜂帶來 3 蜂蜜！');}},
  {e:'🌈',msg:'彩虹出現！幸運日！所有答題金幣×1.5',fn:function(){toast('🌈 幸運彩虹！接下來15分鐘答題金幣×1.5！');S._rainbowEnd=Date.now()+900000;}},
];
var lastEventTime=0;
// ── TREASURE CHEST on map ──
var treasurePos=null, treasureSpawnTime=0;
function checkTreasureChest(){
  if(!ISO||!ISO.canvas||S.sc!=='town')return;
  var now=Date.now();
  if(!treasurePos&&now-treasureSpawnTime>300000){ // every 5min
    if(Math.random()>0.7)return;
    var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);
    for(var tries=0;tries<20;tries++){
      var tc=2+Math.floor(Math.random()*(vis-4));
      var tr=2+Math.floor(Math.random()*(vis-4));
      if(!S.p.town[tr*MSZ+tc]){treasurePos={c:tc,r:tr};treasureSpawnTime=now;break}
    }
  }
}
function drawTreasure(ctx,sx,sy){
  if(!treasurePos)return;
  // Pulsing effect
  var pulse=0.85+Math.sin(Date.now()/400)*0.15;
  ctx.save();ctx.globalAlpha=pulse;
  ctx.font=(22*ISO.zoom)+'px serif';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('💰',sx,sy+ISO.TH*ISO.zoom);
  // Glow ring
  ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.globalAlpha=pulse*0.5;
  ctx.beginPath();ctx.arc(sx,sy+ISO.TH*ISO.zoom*0.5,14*ISO.zoom,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function claimTreasure(){
  var reward=20+Math.floor(Math.random()*80);
  S.p.coins+=reward;S.p.totalCE=(S.p.totalCE||0)+reward;
  treasurePos=null;treasureSpawnTime=Date.now();
  saveP();
  // Big popup
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;top:20%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#F9A825,#E65100);color:#fff;border-radius:20px;padding:20px 30px;z-index:9999;text-align:center;animation:pop .4s ease;box-shadow:0 6px 24px rgba(0,0,0,.4)';
  ov.innerHTML='<div style="font-size:3rem">💰</div><div style="font-size:1.1rem;font-weight:900;margin:6px 0">寶箱！</div><div style="font-size:1.6rem;font-weight:900;color:#FFD700">+🪙'+reward+'</div>';
  document.body.appendChild(ov);setTimeout(function(){ov.remove()},2500);
  toast('💰 發現寶藏！+🪙'+reward);
}

function checkRandomEvent(){
  var now=Date.now();
  if(now-lastEventTime<180000)return; // min 3 min between events
  if(Math.random()>0.15)return; // 15% chance per check
  lastEventTime=now;
  var ev=TOWN_EVENTS[Math.floor(Math.random()*TOWN_EVENTS.length)];
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;top:12%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#2E7D32,#1565C0);color:#fff;border-radius:20px;padding:18px 24px;z-index:9998;text-align:center;animation:pop .4s ease;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:300px;cursor:pointer';
  ov.innerHTML='<div style="font-size:2.5rem;margin-bottom:8px">'+ev.e+'</div><div style="font-size:.95rem;font-weight:700;margin-bottom:4px">隨機事件！</div><div style="font-size:.78rem;opacity:.9">'+ev.msg+'</div><div style="font-size:.65rem;opacity:.7;margin-top:8px">點擊領取</div>';
  ov.addEventListener('click',function(){ev.fn();ov.remove();});
  document.body.appendChild(ov);
  setTimeout(function(){if(ov.parentNode)ov.remove();},8000);
}

// ── 3. QUIZ POWER-UPS ──
var POWERUPS={
  freeze: {e:'❄️',n:'時間凍結',desc:'暫停計時30秒',c:60,uses:0},
  double: {e:'💰',n:'雙倍金幣',desc:'下一題金幣×2',c:40,uses:0},
  reveal: {e:'💡',n:'提示',desc:'顯示答案範圍',c:30,uses:0},
};
function buyPowerup(id){
  var pu=POWERUPS[id];if(!pu)return;
  if(S.p.coins<pu.c){toast('金幣不足！');return}
  S.p.coins-=pu.c;
  if(!S.p.powerups)S.p.powerups={};
  S.p.powerups[id]=(S.p.powerups[id]||0)+1;
  saveP();toast('獲得 '+pu.e+' '+pu.n+'！');
  rQuiz();
}
function usePowerup(id){
  if(!S.p.powerups||!S.p.powerups[id])return false;
  S.p.powerups[id]--;if(S.p.powerups[id]<=0)delete S.p.powerups[id];
  saveP();return true;
}
function showPowerupMenu(){
  var ov=document.createElement('div');ov.className='POPUP';
  var box=document.createElement('div');box.className='PBX';
  box.innerHTML='<div style="font-size:1rem;font-weight:900;margin-bottom:12px">⚡ 答題道具</div>';
  Object.keys(POWERUPS).forEach(function(id){
    var pu=POWERUPS[id];var owned=(S.p.powerups&&S.p.powerups[id])||0;
    var row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F0F0F0';
    row.innerHTML='<div style="font-size:1.8rem">'+pu.e+'</div><div style="flex:1"><div style="font-weight:700;font-size:.88rem">'+pu.n+'</div><div style="font-size:.68rem;color:#9EA8B1">'+pu.desc+'</div><div style="font-size:.65rem;color:#FF6B35">持有：'+owned+'個</div></div>';
    var btn=document.createElement('button');btn.className='BTN B-GD';btn.style.cssText='padding:6px 12px;font-size:.75rem;background:#FFD700;color:#000';btn.textContent='🪙'+pu.c+' 買';
    btn.addEventListener('click',function(){buyPowerup(id);ov.remove();});
    row.appendChild(btn);box.appendChild(row);
  });
  var cl=document.createElement('button');cl.className='BTN B-WH BW';cl.style.cssText='padding:10px;margin-top:12px';cl.textContent='關閉';cl.addEventListener('click',function(){ov.remove()});
  box.appendChild(cl);ov.appendChild(box);ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()});
  document.body.appendChild(ov);
}

  var p=S.p;
  var ov=document.createElement('div');ov.className='POPUP';
  var box=document.createElement('div');box.className='PBX';box.style.textAlign='center';
  var bossLevel=Math.max(1,Math.floor(p.level/2));

    '<div style="background:#FEF2F2;border-radius:10px;padding:10px;margin-bottom:14px;font-size:.72rem;color:#C62828">⚠️ 失敗不扣錢，但需等24小時再挑戰</div>';

  box.appendChild(cl);ov.appendChild(box);ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()});

}
