.COINB{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;font-size:.82rem;font-weight:900;color:var(--gold)}
.BN{background:#fff;border-top:2px solid #E8F5E9;display:flex;flex-shrink:0}

.B-SK{background:#1976D2;color:#fff}.B-GD{background:var(--gold);color:#000}
.B-WH{background:#fff;color:var(--t0);border:1.5px solid #E0E7EF}.B-RD{background:var(--rd);color:#fff}

.CELL{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;position:relative;cursor:pointer;flex-direction:column;border:none;transition:filter .1s}

.CELL-LABLE{font-size:.38rem;color:rgba(255,255,255,.85);line-height:1;margin-top:-2px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;max-width:46px;text-align:center}
.CDOT{position:absolute;top:2px;right:2px;width:10px;height:10px;background:#FF6B35;border-radius:50%;border:1.5px solid #fff;animation:pu .8s infinite alternate}

.MCTRL{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:10}
.MBTN{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}

.EBTN.ON{background:#FF6B35;color:#fff}
.INVBAR{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1.5px solid #E8F5E9;padding:8px 12px;z-index:20;display:flex;gap:8px;align-items:center;overflow-x:auto}
.INVBAR::-webkit-scrollbar{display:none}

.SCATS{display:flex;gap:6px;overflow-x:auto;padding:0 2px;flex-shrink:0;scrollbar-width:none}

.PG2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.PLOT.READY{border-color:#FF6B35;background:#FFF8F0;animation:gp .8s infinite alternate}

.PLOT.GROW{border-color:var(--gr)}.PLOT.EMPTY{border:2px dashed #C8E6C9}

.TF{height:100%;background:var(--gr);border-radius:2px;transition:width .5s}

.XPB{background:var(--gold);height:100%;border-radius:3px}
.AG{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.AC:active{transform:scale(.95)}
.POPUP{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:999}
.PBX{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px 28px;width:100%;max-width:480px;margin:0 auto;max-height:80vh;overflow-y:auto}
.TOAST{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;border-radius:50px;padding:10px 20px;font-size:.85rem;font-weight:700;z-index:9999;white-space:nowrap;pointer-events:none;animation:tf 2.5s ease forwards}
@keyframes tf{0%{opacity:0;transform:translateX(-50%) translateY(-8px)}15%{opacity:1;transform:translateX(-50%)}75%{opacity:1}100%{opacity:0}}
.DROP{position:fixed;pointer-events:none;animation:df 2s ease forwards;font-size:1.2rem;z-index:9999}
@keyframes df{0%{opacity:1;transform:translateY(-20px) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translateY(60px) rotate(360deg)}}

.TOG.ON{background:var(--gr)}.TOG::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.TOG.ON::after{left:20px}
.MI{background:#fff;border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;border:1.5px solid #E0E7EF;transition:background .12s}

.FADE{animation:fade .22s ease}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
</style>

var GR2={d1:[1,9],d2:[10,99],d3:[100,999],d4:[1000,9999]};
function makeQ(mode,grade){
  var r=GR2[grade]||[1,9],a,b;
  if(mode==='add'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);return{q:a+' + '+b,a:a+b}}
  if(mode==='sub'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);if(a<b){var t=a;a=b;b=t}return{q:a+' − '+b,a:a-b}}
  if(mode==='mul'){if(grade==='d1'){a=rnd(2,9);b=rnd(2,9)}else if(grade==='d2'){a=rnd(10,99);b=rnd(2,9)}else{a=rnd(11,99);b=rnd(11,99)}return{q:a+' × '+b,a:a*b}}
  if(mode==='div'){var d=rnd(2,9),q=rnd(Math.max(2,Math.ceil(r[0]/d)),Math.max(2,Math.floor(r[1]/d)));return{q:(d*q)+' ÷ '+d,a:q}}
  if(mode==='as'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);var c=rnd(r[0],r[1]);var v=a+b-c;if(v<0)v=0;return{q:'('+a+'+'+b+')−'+c,a:v}}
  if(mode==='a4'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);var m=rnd(2,9);return{q:'('+a+'+'+b+')×'+m,a:(a+b)*m}}
  if(mode==='99'){a=rnd(1,9);b=rnd(1,9);return{q:a+' × '+b,a:a*b}}
  if(mode==='ck'){var h=rnd(1,12),mn=[0,5,10,15,20,25,30,35,40,45,50,55][rnd(0,11)];return{q:'',h:h,m:mn,a:h+':'+(mn<10?'0':'')+mn,isClock:true}}
  return{q:'2+2',a:4}
}
function makeQs(mode,grade,n){var o=[];for(var i=0;i<n;i++)o.push(makeQ(mode,grade));return o}
function parseTime(s){if(!s)return null;s=s.trim();var m=s.match(/^(\d{1,2})[:\.](\d{2})$/);if(m)return{h:+m[1],min:+m[2]};var ds=s.match(/\d+/g);if(ds&&ds.length>=2)return{h:+ds[0],min:+ds[1]};return null}
function matchTime(s,h,min){var p=parseTime(s);return!!(p&&p.h===h&&p.min===min)}
function clockSVG(h,m,sz){sz=sz||160;var cx=sz/2,cy=sz/2,R=sz/2-5,ma=(m/60)*2*Math.PI-Math.PI/2,ha=((h%12)/12+m/720)*2*Math.PI-Math.PI/2,mx=(cx+R*.72*Math.cos(ma)).toFixed(1),my=(cy+R*.72*Math.sin(ma)).toFixed(1),hx=(cx+R*.5*Math.cos(ha)).toFixed(1),hy=(cy+R*.5*Math.sin(ha)).toFixed(1);var s='';for(var i=0;i<60;i++){var a=(i/60)*2*Math.PI-Math.PI/2,iH=i%5===0;s+='<line x1="'+(cx+R*Math.cos(a)).toFixed(1)+'" y1="'+(cy+R*Math.sin(a)).toFixed(1)+'" x2="'+(cx+(R-(iH?7:3))*Math.cos(a)).toFixed(1)+'" y2="'+(cy+(R-(iH?7:3))*Math.sin(a)).toFixed(1)+'" stroke="'+(iH?'#555':'#aaa')+'" stroke-width="'+(iH?1.8:.8)+'"/>'}var n2='';for(var i2=1;i2<=12;i2++){var a2=(i2/12)*2*Math.PI-Math.PI/2;n2+='<text x="'+(cx+(R-17)*Math.cos(a2)).toFixed(1)+'" y="'+(cy+(R-17)*Math.sin(a2)).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="'+(sz/14)+'" font-family="Arial" font-weight="700" fill="#333">'+i2+'</text>'}return'<svg viewBox="0 0 '+sz+' '+sz+'" width="'+sz+'" height="'+sz+'" xmlns="http://www.w3.org/2000/svg"><circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="#EBF8FF" stroke="#90CDF4" stroke-width="2.5"/>'+s+n2+'<line x1="'+cx+'" y1="'+cy+'" x2="'+hx+'" y2="'+hy+'" stroke="#1A365D" stroke-width="4" stroke-linecap="round"/><line x1="'+cx+'" y1="'+cy+'" x2="'+mx+'" y2="'+my+'" stroke="#2B6CB0" stroke-width="3" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="4.5" fill="#E53E3E"/></svg>'}

  app().innerHTML='<div style="background:#fff;flex:1;overflow-y:auto"><div style="background:linear-gradient(135deg,#2E7D32,#1565C0);padding:20px 16px;text-align:center"><div style="font-size:2rem">✨</div><div style="font-size:1.2rem;font-weight:900;color:#fff;margin-top:6px">建立新帳號</div></div><div style="padding:20px 16px;display:flex;flex-direction:column;gap:14px"><div><div class="LABEL">帳號（英文數字，跨裝置同步用）</div><input class="INP" id="rn" placeholder="e.g. player123"></div><div><div class="LABEL">顯示名稱</div><input class="INP" id="rd" placeholder="你的暱稱"></div><div><div class="LABEL">4 位數 PIN 碼</div><input class="INP" id="rp" type="password" inputmode="numeric" placeholder="設定 4 位數字 PIN" maxlength="4"></div><div><div class="LABEL">確認 PIN</div><input class="INP" id="rp2" type="password" inputmode="numeric" placeholder="再輸入一次" maxlength="4"></div><button class="BTN B-GR BW" style="padding:14px;font-size:1rem" onclick="doReg()">🎮 開始冒險！</button><div id="rerr" style="color:var(--rd);font-size:.72rem;text-align:center;min-height:16px"></div><button class="BTN B-WH BW" style="padding:11px;font-size:.85rem" onclick="go(\'login\')">← 已有帳號？登入</button></div></div>'
}
async function doReg(){
  var name=(document.getElementById('rn')?.value||'').trim().toLowerCase();
  var disp=(document.getElementById('rd')?.value||'').trim();
  var pin=(document.getElementById('rp')?.value||'').trim();
  var pin2=(document.getElementById('rp2')?.value||'').trim();
  var err=document.getElementById('rerr');
  if(!name||name.length<2){err.textContent='帳號至少2字';return}
  if(!disp){err.textContent='請輸入顯示名稱';return}
  if(!/^\d{4}$/.test(pin)){err.textContent='PIN需為4位數字';return}
  if(pin!==pin2){err.textContent='PIN碼不一致';return}
  S.accounts=getAccs();
  if(S.accounts.find(function(a){return a.name===name})){err.textContent='帳號已存在';return}
  var acc={name:name,displayName:disp,pinHash:hashP(pin)};
  S.accounts.push(acc);saveAccs();
  var p=newP(name,pin,disp);S.p=p;await saveP();
  genOrders();startTick();go('home')
}

/* ======= LOGIN ======= */
function rLogin(){
  S.accounts=getAccs();
  var savedH='';
  if(S.accounts.length>0){
    savedH='<div><div class="SL">選擇帳號</div><div style="display:flex;flex-direction:column;gap:7px">';
    S.accounts.forEach(function(acc){
      savedH+='<div style="background:#F7FBF7;border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border:1.5px solid #E0E7EF;cursor:pointer" onclick="document.getElementById(\'ln\').value=\''+acc.name+'\'"><div><div style="font-weight:700;font-size:.88rem">'+acc.displayName+'</div><div style="font-size:.62rem;color:var(--t2)">@'+acc.name+'</div></div><span style="color:#1976D2;font-size:.78rem;font-weight:700">選擇 →</span></div>'
    });
    savedH+='</div></div><div style="text-align:center;color:var(--t2);font-size:.72rem">或手動輸入</div>'
  }
  app().innerHTML='<div style="background:#fff;flex:1;overflow-y:auto"><div style="background:linear-gradient(135deg,#1565C0,#2E7D32);padding:20px 16px;text-align:center"><div style="font-size:2rem">🔑</div><div style="font-size:1.2rem;font-weight:900;color:#fff;margin-top:6px">歡迎回來</div></div><div style="padding:20px 16px;display:flex;flex-direction:column;gap:14px">'+savedH+'<div><div class="LABEL">帳號</div><input class="INP" id="ln" placeholder="輸入帳號名稱"></div><div><div class="LABEL">PIN 碼</div><input class="INP" id="lp" type="password" inputmode="numeric" placeholder="4 位數字 PIN" maxlength="4"></div><button class="BTN B-SK BW" style="padding:14px;font-size:1rem" onclick="doLogin()">🔑 登入</button><div id="lerr" style="color:var(--rd);font-size:.72rem;text-align:center;min-height:16px"></div><button class="BTN B-WH BW" style="padding:11px;font-size:.85rem" onclick="go(\'register\')">✨ 建立新帳號</button></div></div>'
}
async function doLogin(){
  var name=(document.getElementById('ln')?.value||'').trim().toLowerCase();
  var pin=(document.getElementById('lp')?.value||'').trim();
  var err=document.getElementById('lerr');
  if(!name){err.textContent='請輸入帳號';return}
  if(!/^\d{4}$/.test(pin)){err.textContent='PIN需為4位數字';return}
  S.accounts=getAccs();
  var acc=S.accounts.find(function(a){return a.name===name&&a.pinHash===hashP(pin)});
  if(!acc){
    var pd=await loadPD(name);
    if(pd&&pd.pin===hashP(pin)){acc={name:name,displayName:pd.displayName||name,pinHash:hashP(pin)};if(!S.accounts.find(function(a){return a.name===name})){S.accounts.push(acc);saveAccs()}}
  }
  if(!acc){err.textContent='帳號或PIN錯誤';return}
  var p=await loadPD(name);
  if(!p)p=newP(name,pin,acc.displayName);
  if(!p.farms)p.farms={};if(!p.factories)p.factories={};if(!p.animalSlots)p.animalSlots={};
  if(!p.bldgInv)p.bldgInv={};if(!p.collect)p.collect={};if(!p.mgDone)p.mgDone={};
  if(!p.displayName)p.displayName=acc.displayName||name;
  while(p.town.length<MSZ*MSZ)p.town.push(null);
  if(p.lastDay!==today()){p.coins+=20;p.totalCE=(p.totalCE||0)+20;p.lastDay=today();p.loginDays=(p.loginDays||0)+1}
  if(!p.orders||p.orders.length<1)genOrders();
  S.p=p;await saveP();startTick();go('home')
}

/* ======= TOWN ======= */
function rTown(){
  var p=S.p,vis=Math.min(MSZ,p.landSize||25);
  var CS2=48;

  // Building tile colors
  var BG={
    deco:'#5DBB7A', bldg:'#D4924A', farm:'#BCCF3A',
    factory:'#7A9FAA', animal:'#E09A3A'
  };
  var BD2={
    deco:'#2D6A4F', bldg:'#8B5E2A', farm:'#6A7A10',
    factory:'#3A5E6A', animal:'#A06010'
  };

  var cells='';
  for(var row=0;row<vis;row++){
    for(var col=0;col<vis;col++){
      var idx=row*MSZ+col;
      var bId=p.town[idx];
      var bd=bId?Bd(bId):null;

      // Check for ready indicator
      var dot=false;
      if(bd){
        if(bd.cat==='farm'&&p.farms[idx]&&p.farms[idx].done)dot=true;
        if(bd.cat==='animal'&&p.animalSlots[idx]&&p.animalSlots[idx].ready)dot=true;
        if(bd.cat==='factory'){
          var fac=p.factories[idx];
          if(fac&&fac.queue&&fac.queue.length>0&&fac.queue[0].done)dot=true;
        }
        if((bd.coin||bd.exp)&&p.collect[idx]&&p.collect[idx].lastD!==today())dot=true;
      }

      // Background
      var bg,bdb;
      if(bd){
        bg=BG[bd.cat]||'#5DBB7A';
        bdb=BD2[bd.cat]||'#2D6A4F';
      } else {
        // Checkerboard grass
        bg=(row+col)%2===0?'#52B788':'#3D9E6E';
        bdb='';
      }

      var inlineStyle='background:'+bg+';width:'+CS2+'px;height:'+CS2+'px;';
      if(bdb)inlineStyle+='box-shadow:inset 0 -4px 0 '+bdb+';';
      if(S.edit&&!bd)inlineStyle+='outline:1px solid rgba(255,255,255,.25);';

      var inner='';
      if(bd){
        inner='<span style="font-size:1.75rem;display:block;line-height:1;margin-top:2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">'+bd.e+'</span>';
        inner+='<span style="font-size:.32rem;color:rgba(255,255,255,.95);font-weight:700;display:block;text-align:center;text-shadow:0 1px 1px rgba(0,0,0,.6);overflow:hidden;white-space:nowrap;max-width:46px;margin-top:1px">'+bd.n+'</span>';
      } else if(S.edit&&S.placing){
        inner='<span style="font-size:1.4rem;opacity:.5">+</span>';
      } else {
        // Tiny grass texture
        inner='';
      }

      var dotHtml=dot?'<div style="position:absolute;top:2px;right:2px;width:10px;height:10px;background:#FF6B35;border-radius:50%;border:1.5px solid #fff;animation:pu .8s infinite alternate"></div>':'';
      var editHL=(S.edit&&!bd&&S.placing)?'<div style="position:absolute;inset:0;background:rgba(76,175,80,.3);pointer-events:none"></div>':'';

      cells+='<div id="c-'+idx+'" onclick="cClick('+idx+')" style="'+inlineStyle+'display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;cursor:pointer;grid-column:'+(col+1)+';grid-row:'+(row+1)+'">'+inner+dotHtml+editHL+'</div>';
    }
  }

  var gridW=vis*CS2,gridH=vis*CS2;
  var gap=S.edit?1:0;

  // Inventory bar
  var invBar='';
  if(S.edit){
    invBar='<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1.5px solid #E8F5E9;padding:7px 12px;z-index:20;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none">';
    if(S.placing){
      invBar+='<div style="font-size:.7rem;font-weight:700;color:var(--warm);white-space:nowrap">放置: '+Bd(S.placing).e+' '+Bd(S.placing).n+'</div>';
      invBar+='<button style="padding:4px 10px;border-radius:50px;border:1.5px solid var(--rd);background:#fff;color:var(--rd);font-size:.72rem;cursor:pointer;white-space:nowrap;flex-shrink:0" onclick="S.placing=null;rTown()">取消</button>';
    }
    var hasAny=false;
    Object.keys(p.bldgInv).forEach(function(id){
      if(!p.bldgInv[id])return;var b=Bd(id);if(!b)return;hasAny=true;
      var sel=S.placing===id;
      invBar+='<div onclick="S.placing=\''+id+'\';rTown()" style="background:'+(sel?'rgba(76,175,80,.2)':'#F7FBF7')+';border:1.5px solid '+(sel?'var(--gr)':'#E0E7EF')+';border-radius:10px;padding:6px 8px;text-align:center;cursor:pointer;flex-shrink:0;min-width:54px">';
      invBar+='<div style="font-size:1.4rem">'+b.e+'</div><div style="font-size:.5rem;font-weight:700">'+b.n+'</div><div style="font-size:.48rem;color:var(--t2)">×'+p.bldgInv[id]+'</div></div>';
    });
    if(!hasAny&&!S.placing)invBar+='<div style="font-size:.72rem;color:var(--t2);white-space:nowrap">庫存空，去商店購買</div>';
    invBar+='</div>';
  }

  app().innerHTML=tbH()+
    '<div id="mapwrap" style="flex:1;overflow:hidden;position:relative;background:#2D6A4F">'+
    '<button class="EBTN'+(S.edit?' ON':'')+'" onclick="S.edit=!S.edit;S.placing=null;rTown()">'+(S.edit?'✏️ 完成':'✏️ 編輯')+'</button>'+
    '<div style="position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:10">'+
    '<div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);font-weight:900" onclick="chgZ(0.25)">+</div>'+
    '<div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);font-weight:900" onclick="chgZ(-0.25)">−</div>'+
    '<div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:none;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)" onclick="ctrMap()">⌂</div>'+
    '</div>'+
    '<div id="mapinner" style="position:absolute;top:0;left:0;transform-origin:0 0;transform:translate('+S.mx+'px,'+S.my+'px) scale('+S.zoom+');will-change:transform">'+
    '<div style="display:grid;grid-template-columns:repeat('+vis+','+CS2+'px);grid-template-rows:repeat('+vis+','+CS2+'px);width:'+gridW+'px;height:'+gridH+'px;gap:'+gap+'px">'+cells+'</div>'+
    '</div>'+invBar+
    '</div>'+bnH('town');
  setupMap();
}

function chgZ(d){S.zoom=Math.min(3,Math.max(0.3,S.zoom+d));applyT()}
function ctrMap(){S.mx=0;S.my=0;S.zoom=1;applyT()}
function applyT(){var mi=document.getElementById('mapinner');if(mi)mi.style.transform='translate('+S.mx+'px,'+S.my+'px) scale('+S.zoom+')'}
function setupMap(){
  var wrap=document.getElementById('mapwrap');if(!wrap)return;
  var isDrag=false,sx,sy,smx,smy,ld=0;
  wrap.addEventListener('pointerdown',function(e){
    if(e.target.closest('.EBTN,[onclick*="chgZ"],[onclick*="ctrMap"],[onclick*="rTown"],[onclick*="go("]'))return;
    if(S.edit&&e.target.closest('[onclick*="cClick"]'))return;
    isDrag=true;sx=e.clientX;sy=e.clientY;smx=S.mx;smy=S.my;wrap.setPointerCapture(e.pointerId)
  });
  wrap.addEventListener('pointermove',function(e){if(!isDrag)return;S.mx=smx+(e.clientX-sx);S.my=smy+(e.clientY-sy);applyT()});
  wrap.addEventListener('pointerup',function(){isDrag=false});
  wrap.addEventListener('touchmove',function(e){
    if(e.touches.length===2){e.preventDefault();var t1=e.touches[0],t2=e.touches[1];var d=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);if(ld>0){S.zoom=Math.min(3,Math.max(0.3,S.zoom*d/ld));applyT()}ld=d}else ld=0
  },{passive:false});
  wrap.addEventListener('touchend',function(){ld=0})
}

/* ======= SHOP ======= */
function rShop(){
  var p=S.p;
  var CATS=[['deco','🌳 裝飾'],['bldg','🏛 建築'],['farm','🌾 農場'],['factory','🏭 工廠'],['animal','🐄 動物']];
  var catH='<div class="SCATS">';CATS.forEach(function(c){catH+='<button class="CATB'+(S.shopCat===c[0]?' ACT':'')+'" onclick="S.shopCat=\''+c[0]+'\';rShop()">'+c[1]+'</button>'});catH+='</div>';
  var items=Object.values(ITEMS).filter(function(it){return it.cat===S.shopCat});
  var gH='<div class="SG">';
  items.forEach(function(b){
    var cnt=p.bldgInv[b.id]||0,placed=p.town.filter(function(t){return t===b.id}).length;
    var unlocked=!b.lv||p.level>=b.lv,canBuy=unlocked&&p.coins>=b.c;
    var prod=b.coin?'+🪙'+b.coin+'/天':b.exp?'+⭐'+b.exp+'/天':b.boost?'×'+(1+b.boost)+'答題':b.crop?CROPS[b.crop].e+'作物':b.animal?ANIMALS[b.animal].e+'動物':b.cat==='factory'?'加工廠':null;
    gH+='<div class="SI'+(cnt>0||placed>0?' owned':'')+(!canBuy?' locked':'')+'" onclick="'+(canBuy?'buyB(\''+b.id+'\')':'')+'">';
    if(cnt>0)gH+='<div class="SICNT">×'+cnt+'</div>';
    gH+='<div style="font-size:1.9rem;margin-bottom:3px">'+b.e+'</div><div style="font-size:.62rem;font-weight:700">'+b.n+'</div>';
    if(prod)gH+='<div class="PTAG">'+prod+'</div>';
    if(b.lv&&!unlocked)gH+='<div style="font-size:.56rem;color:var(--rd);margin-top:2px">Lv.'+b.lv+'解鎖</div>';
    gH+='<div style="background:#FFFDE7;border-radius:5px;padding:2px 5px;font-size:.6rem;font-weight:700;color:#7B5E00;margin-top:3px">🪙'+b.c+'</div></div>'
  });
  gH+='</div>';
  // land expansion
  var landH='';
  if(S.shopCat==='bldg'){
    landH='<div class="CARD" style="background:#F0FFF4;border-color:#A5D6A7"><div style="font-size:.74rem;font-weight:700;color:#2E7D32;margin-bottom:8px">🌍 土地擴張</div>';
    [[30,500,5],[35,1200,10],[40,2500,15],[45,5000,20],[50,10000,25]].forEach(function(land){
      if((p.landSize||25)>=land[0])return;
      var can=p.coins>=land[1]&&p.level>=land[2];
      landH+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #E8F5E9"><div><div style="font-weight:700;font-size:.82rem">'+land[0]+'×'+land[0]+'格</div><div style="font-size:.62rem;color:var(--t2)">Lv.'+land[2]+'以上</div></div><button class="BTN B-GR" style="padding:6px 12px;font-size:.76rem;'+(can?'':'opacity:.4')+'" '+(can?'onclick="buyLand('+land[0]+','+land[1]+')"':'disabled')+'>🪙'+land[1]+'</button></div>'
    });
    landH+='</div>'
  }
  // sell goods (shown in deco tab)
  var sellH='';
  if(S.shopCat==='deco'){
    var goods=Object.keys(p.inv).filter(function(id){return p.inv[id]>0&&GOODS[id]});
    if(goods.length>0){
      sellH='<div class="CARD"><div style="font-size:.74rem;font-weight:700;color:#2E7D32;margin-bottom:10px">💰 出售貨物</div><div class="IGRID">';
      goods.forEach(function(id){var g=GOODS[id];if(!g)return;sellH+='<div class="II" onclick="sellItem(\''+id+'\')"><div class="ICNT">'+p.inv[id]+'</div><div style="font-size:1.4rem">'+g.e+'</div><div style="font-size:.52rem;font-weight:700">'+g.n+'</div><div style="font-size:.52rem;color:var(--gold2)">🪙'+g.sell+'</div></div>'});
      sellH+='</div><div style="font-size:.62rem;color:var(--t2);margin-top:8px;text-align:center">點擊出售一個</div></div>'
    }
  }
  app().innerHTML=tbH()+'<div style="display:flex;flex-direction:column;flex:1;overflow:hidden"><div style="padding:10px 14px 0;flex-shrink:0;background:#F0FAFB"><div style="font-size:.76rem;color:var(--t1);margin-bottom:8px">現有 <strong style="color:var(--gold2)">🪙 '+p.coins+'</strong></div>'+catH+'</div><div class="PG" style="padding-top:10px">'+sellH+landH+gH+'</div></div>'+bnH('shop')
}
function buyB(id){var b=Bd(id);if(!b||S.p.coins<b.c)return;S.p.coins-=b.c;S.p.bldgInv[id]=(S.p.bldgInv[id]||0)+1;saveP();toast('已購買 '+b.e+' '+b.n+'！進入小鎮放置');rShop()}
function buyLand(size,cost){if(S.p.coins<cost)return;S.p.coins-=cost;S.p.landSize=size;while(S.p.town.length<MSZ*MSZ)S.p.town.push(null);saveP();toast('土地擴張到 '+size+'×'+size+'！');rShop()}
function sellItem(id){var g=GOODS[id];if(!g||(S.p.inv[id]||0)<1)return;S.p.inv[id]--;S.p.coins+=g.sell;S.p.totalCE=(S.p.totalCE||0)+g.sell;if(S.p.inv[id]<=0)delete S.p.inv[id];saveP();toast('出售 '+g.e+' +🪙'+g.sell);rShop()}

/* ======= FARM OVERVIEW ======= */
function rFarm(){
  var p=S.p;
  function getSlots(cat){var r=[];for(var i=0;i<p.town.length;i++){var id=p.town[i];if(!id)continue;var b=Bd(id);if(b&&b.cat===cat)r.push({idx:i,b:b})}return r}
  var farmSlots=getSlots('farm'),facSlots=getSlots('factory'),aniSlots=getSlots('animal');

}

  S.earned+=tB+aB;S.p.coins+=S.earned;S.p.totalC=(S.p.totalC||0)+cor;S.p.totalA=(S.p.totalA||0)+n;
  S.p.totalCE=(S.p.totalCE||0)+S.earned;if(S.maxStreak>(S.p.bestStreak||0))S.p.bestStreak=S.maxStreak;
  S.p.exp+=cor*5;checkLv();saveP();rResults(tB,aB)
}
function rResults(tB,aB){
  var cor=0;S.qAns.forEach(function(a){if(a.ok)cor++});
  var n=S.qAns.length,pct=Math.round(cor/n*100),stars=pct===100?'🌟🌟🌟':pct>=80?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
  var base=0;S.qAns.forEach(function(a){base+=(a.c||0)});
  app().innerHTML='<div style="flex:1;overflow-y:auto"><div style="background:linear-gradient(135deg,#1565C0,#2E7D32);padding:28px 14px 18px;text-align:center"><div style="font-size:2.5rem;margin-bottom:6px">'+stars+'</div><div style="font-size:.88rem;color:rgba(255,255,255,.9)">'+(pct===100?'完美全對！':pct>=80?'非常棒！':pct>=60?'不錯！':'繼續加油！')+'</div><div style="font-size:2.5rem;font-weight:900;color:var(--gold);margin-top:10px;animation:pop .5s ease">+'+S.earned+' 🪙</div><div style="font-size:.7rem;color:rgba(255,255,255,.7);margin-top:3px">現有 '+S.p.coins.toLocaleString()+' 🪙</div></div><div class="PG"><div class="BDR"><span style="color:var(--t1)">📝 答題</span><span style="font-weight:900;color:var(--gold2)">🪙 '+base+'</span></div><div class="BDR"><span style="color:var(--t1)">🔥 連答</span><span style="font-weight:900;color:var(--gold2)">×'+S.maxStreak+'</span></div><div class="BDR"><span style="color:var(--t1)">⏰ 時間</span><span style="font-weight:900;color:var(--gold2)">+🪙 '+tB+'</span></div><div class="BDR"><span style="color:var(--t1)">🎯 正確率</span><span style="font-weight:900;color:var(--gold2)">+🪙 '+aB+'</span></div><div class="BDR"><span style="color:var(--t1)">💰 合計</span><span style="font-weight:900;color:var(--gold2)">🪙 '+S.earned+'</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><button class="BTN B-OR" onclick="startQ()">再練一次</button><button class="BTN B-GR" onclick="go(\'orders\')">看訂單 📋</button></div><button class="BTN B-WH BW" onclick="go(\'home\')">回首頁 🏡</button></div></div>'
}

/* ======= MINI-GAMES ======= */
function rMgHub(){
  var p=S.p,mg1d=p.mgDone&&p.mgDone.mg1===today(),mg2d=p.mgDone&&p.mgDone.mg2===today();
  app().innerHTML=tbH()+'<div class="PG FADE"><div style="font-size:.9rem;font-weight:700">🎮 每日小遊戲</div><div style="font-size:.72rem;color:var(--t2)">等級越高難度越大，每天可玩一次！</div><div class="CARD'+(mg1d?' opacity:.7':'')+'" style="cursor:'+(mg1d?'not-allowed':'pointer')+'" onclick="'+(mg1d?'':'go(\'mg1\')')+'""><div style="display:flex;align-items:center;gap:12px"><div style="width:50px;height:50px;border-radius:14px;background:#E3F2FD;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0">🃏</div><div style="flex:1"><div style="font-weight:700;font-size:.9rem">翻牌配對</div><div style="font-size:.68rem;color:var(--t2);margin-top:2px">Lv.'+p.level+'難度・配對算式和答案</div><div style="font-size:.68rem;color:var(--gr);margin-top:2px">最高 🪙 '+(40+p.level*3)+'</div></div><div style="font-size:.75rem;font-weight:700;color:'+(mg1d?'var(--t2)':'#1976D2')+'">'+(mg1d?'✅完成':'▶ 開始')+'</div></div></div><div class="CARD'+(mg2d?' opacity:.7':'')+'" style="cursor:'+(mg2d?'not-allowed':'pointer')+'" onclick="'+(mg2d?'':'go(\'mg2\')')+'""><div style="display:flex;align-items:center;gap:12px"><div style="width:50px;height:50px;border-radius:14px;background:#FFF3E0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0">⚡</div><div style="flex:1"><div style="font-weight:700;font-size:.9rem">速算泡泡</div><div style="font-size:.68rem;color:var(--t2);margin-top:2px">60秒・Lv.'+p.level+'難度</div><div style="font-size:.68rem;color:var(--gr);margin-top:2px">最高 🪙 '+(30+p.level*2)+'</div></div><div style="font-size:.75rem;font-weight:700;color:'+(mg2d?'var(--t2)':'#E65100')+'">'+(mg2d?'✅完成':'▶ 開始')+'</div></div></div><button class="BTN B-WH BW" onclick="go(\'home\')">← 回首頁</button></div>'+bnH('quiz')
}
function rMg1(){
  var lv=S.p.level,pairs=MGPAIRS.slice(0,Math.min(12,4+Math.floor(lv/2)));
  var cards=[];pairs.forEach(function(p,pi){cards.push({id:cards.length,pairId:pi,text:p[0],faceUp:false,matched:false});cards.push({id:cards.length,pairId:pi,text:p[1],faceUp:false,matched:false})});
  for(var i=cards.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=cards[i];cards[i]=cards[j];cards[j]=t}
  S.mg={type:'mg1',cards:cards,sel:[],matched:0,t:Math.max(60,120-lv*3),moves:0,pc:pairs.length};
  clrT();S.tid=setInterval(function(){S.mg.t--;var el=document.getElementById('MG-T');if(el){el.textContent=fmt(S.mg.t);el.style.color=S.mg.t<=20?'#EF4444':'#1976D2'}if(S.mg.t<=0){clrT();endMg1()}},1000);renderMg1()
}
function renderMg1(){
  var mg=S.mg,gH='';
  mg.cards.forEach(function(c,i){var oc=(!c.matched&&!c.faceUp&&mg.sel.length<2)?'flip('+i+')':'';gH+='<div class="FC'+(c.faceUp?' FACE':'')+(c.matched?' MATCH':'')+'" onclick="'+oc+'">'+(c.faceUp||c.matched?c.text:'?')+'</div>'});
  app().innerHTML='<div style="background:#1976D2;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0"><div><div style="font-size:.78rem;font-weight:700;color:#fff">🃏 翻牌配對 (Lv.'+S.p.level+')</div><div style="font-size:.6rem;color:rgba(255,255,255,.75)">配對 '+mg.matched+'/'+mg.pc+'</div></div><div id="MG-T" style="font-size:1.6rem;font-weight:900;color:#fff">'+fmt(mg.t)+'</div><button class="BTN B-WH" style="padding:6px 12px;font-size:.75rem" onclick="clrT();go(\'mghub\')">放棄</button></div><div style="flex:1;overflow-y:auto;background:#F0FAFB"><div class="FGRID" style="grid-template-columns:repeat(4,1fr)">'+gH+'</div></div>'
}
function flip(i){var mg=S.mg,c=mg.cards[i];if(c.faceUp||c.matched||mg.sel.length>=2)return;c.faceUp=true;mg.sel.push(i);renderMg1();if(mg.sel.length===2){mg.moves++;var a=mg.cards[mg.sel[0]],b=mg.cards[mg.sel[1]];if(a.pairId===b.pairId){a.matched=b.matched=true;mg.matched++;mg.sel=[];if(mg.matched>=mg.pc){clrT();endMg1()}else renderMg1()}else{setTimeout(function(){a.faceUp=b.faceUp=false;mg.sel=[];renderMg1()},900)}}}
function endMg1(){var mg=S.mg,lv=S.p.level,base=20+lv*2,tB=mg.matched>=mg.pc?Math.min(lv*2,Math.floor(mg.t/3)):0,total=mg.matched>=mg.pc?base+tB:Math.round(base*mg.matched/mg.pc*.5);S.p.coins+=total;S.p.totalCE=(S.p.totalCE||0)+total;if(!S.p.mgDone)S.p.mgDone={};S.p.mgDone.mg1=today();saveP();app().innerHTML='<div style="flex:1;overflow-y:auto"><div style="background:#1565C0;padding:30px 14px 20px;text-align:center"><div style="font-size:2.5rem;margin-bottom:6px">'+(mg.matched>=mg.pc?'🌟🌟🌟':mg.matched>=mg.pc*.7?'⭐⭐':'⭐')+'</div><div style="font-size:.9rem;color:rgba(255,255,255,.9)">'+(mg.matched>=mg.pc?'全部配對！':'完成 '+mg.matched+'/'+mg.pc)+'</div><div style="font-size:2.4rem;font-weight:900;color:var(--gold);margin-top:10px;animation:pop .5s ease">+'+total+'🪙</div></div><div class="PG"><div class="BDR"><span>配對</span><span style="font-weight:900;color:var(--gold2)">'+mg.matched+'/'+mg.pc+'</span></div><div class="BDR"><span>時間加成</span><span style="font-weight:900;color:var(--gold2)">+🪙 '+tB+'</span></div><button class="BTN B-SK BW" onclick="go(\'mghub\')">回小遊戲</button><button class="BTN B-GR BW" onclick="go(\'home\')">回首頁</button></div></div>'}
function rMg2(){
  var lv=S.p.level;S.mg={round:0,score:0,t:60,eq:null,opts:[],proc:false,lv:lv};
  clrT();S.tid=setInterval(function(){S.mg.t--;var el=document.getElementById('MG2-T');if(el){el.textContent=fmt(S.mg.t);el.style.color=S.mg.t<=10?'#EF4444':'#1976D2'}if(S.mg.t<=0){clrT();endMg2()}},1000);nextBub()
}
function nextBub(){
  var mg=S.mg;if(mg.round>=10){clrT();endMg2();return}
  var lv=mg.lv,maxN=Math.min(99,9+lv*3),ops=['add','sub','mul','div'],op=ops[rnd(0,3)],q,ans;
  if(op==='add'){var a=rnd(2,maxN),b=rnd(2,maxN);q=a+' + '+b;ans=a+b}
  else if(op==='sub'){var a=rnd(maxN/2,maxN),b=rnd(1,Math.floor(maxN/2));q=a+' − '+b;ans=a-b}
  else if(op==='mul'){var a=rnd(2,Math.min(12,2+lv)),b=rnd(2,Math.min(12,2+lv));q=a+' × '+b;ans=a*b}
  else{var a=rnd(2,Math.min(9,2+lv)),b=rnd(2,Math.min(9,2+lv));q=(a*b)+' ÷ '+a;ans=b}
  mg.eq={q:q,ans:ans};var opts={};opts[ans]=true;var t=0;
  while(Object.keys(opts).length<9&&t++<200){var w=ans+rnd(-Math.max(5,lv),Math.max(5,lv));if(w!==ans&&w>0)opts[w]=true}
  mg.opts=Object.keys(opts).map(Number).sort(function(){return Math.random()-.5});mg.round++;mg.proc=false;renderBub()
}
function renderBub(){
  var mg=S.mg,bH='';mg.opts.forEach(function(v,i){bH+='<div class="BUB" id="bb'+i+'" onclick="tapBub('+i+','+v+')">'+v+'</div>'});
  app().innerHTML='<div style="background:#E65100;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0"><div><div style="font-size:.78rem;font-weight:700;color:#fff">⚡ 速算泡泡 (Lv.'+S.p.level+')</div><div style="font-size:.6rem;color:rgba(255,255,255,.8)">'+mg.round+'/10 · '+mg.score+'分</div></div><div id="MG2-T" style="font-size:1.6rem;font-weight:900;color:#fff">'+fmt(mg.t)+'</div><button class="BTN B-WH" style="padding:6px 12px;font-size:.75rem" onclick="clrT();go(\'mghub\')">放棄</button></div><div style="flex:1;overflow-y:auto;background:#FFF3E0"><div style="padding:16px 14px;text-align:center"><div style="font-size:2.2rem;font-weight:900;color:#BF360C;background:#fff;border-radius:14px;padding:12px;border:2px solid #FFCCBC">'+mg.eq.q+' = ?</div></div><div class="BGRID">'+bH+'</div></div>'
}
function tapBub(idx,val){var mg=S.mg;if(mg.proc)return;mg.proc=true;var el=document.getElementById('bb'+idx);if(val===mg.eq.ans){mg.score++;if(el){el.classList.add('OK');el.textContent='✓'}setTimeout(nextBub,500)}else{if(el){el.classList.add('NG');el.textContent='✗'}mg.opts.forEach(function(v,i){if(v===mg.eq.ans){var e2=document.getElementById('bb'+i);if(e2){e2.classList.add('OK');e2.textContent='✓'}}});setTimeout(nextBub,1000)}}
function endMg2(){var mg=S.mg,lv=S.p.level,base=mg.score*(3+Math.floor(lv/3)),tB=Math.min(lv*2,Math.floor(mg.t/6)),total=base+tB;S.p.coins+=total;S.p.totalCE=(S.p.totalCE||0)+total;if(!S.p.mgDone)S.p.mgDone={};S.p.mgDone.mg2=today();saveP();app().innerHTML='<div style="flex:1;overflow-y:auto"><div style="background:#BF360C;padding:30px 14px 20px;text-align:center"><div style="font-size:2.5rem;margin-bottom:6px">'+(mg.score>=9?'🌟🌟🌟':mg.score>=7?'⭐⭐⭐':mg.score>=5?'⭐⭐':'⭐')+'</div><div style="font-size:.9rem;color:rgba(255,255,255,.9)">'+(mg.score>=9?'超強！':'繼續練習！')+'</div><div style="font-size:2.4rem;font-weight:900;color:var(--gold);margin-top:10px;animation:pop .5s ease">+'+total+'🪙</div></div><div class="PG"><div class="BDR"><span>答對</span><span style="font-weight:900;color:var(--gold2)">'+mg.score+'/'+mg.round+'</span></div><div class="BDR"><span>合計</span><span style="font-weight:900;color:var(--gold2)">🪙 '+total+'</span></div><button class="BTN B-OR BW" onclick="go(\'mghub\')">回小遊戲</button><button class="BTN B-GR BW" onclick="go(\'home\')">回首頁</button></div></div>'}

/* ======= STATS ======= */
function rStats(){
  var p=S.p,acc=p.totalA?Math.round(p.totalC/p.totalA*100):0;
  var title=p.level>=15?'🏰 傳說城主':p.level>=10?'⚔️ 數學大師':p.level>=7?'📚 知識達人':p.level>=4?'🌟 勤奮學生':'🌱 數學新手';
  var stats=[['🪙','累積金幣',(p.totalCE||0).toLocaleString()],['📝','答題數',(p.totalA||0)+'題'],['✅','答對數',(p.totalC||0)+'題'],['🎯','正確率',acc+'%'],['🔥','最佳連答',(p.bestStreak||0)+'連'],['📅','登入天數',(p.loginDays||1)+'天']];
  var sH='';stats.forEach(function(s){sH+='<div style="background:#fff;border-radius:12px;padding:11px 8px;text-align:center;border:1.5px solid #E8F5E9"><div style="font-size:1.3rem">'+s[0]+'</div><div style="font-size:1.1rem;font-weight:900;color:#1976D2">'+s[2]+'</div><div style="font-size:.58rem;color:var(--t2);margin-top:2px">'+s[1]+'</div></div>'});
  var goods=Object.keys(p.inv).filter(function(id){return p.inv[id]>0&&GOODS[id]});
  var invH='';if(goods.length>0){invH='<div><div class="SL">庫存貨物</div><div class="IGRID">';goods.forEach(function(id){var g=GOODS[id];invH+='<div class="II"><div class="ICNT">'+p.inv[id]+'</div><div style="font-size:1.4rem">'+g.e+'</div><div style="font-size:.52rem;font-weight:700">'+g.n+'</div></div>'});invH+='</div></div>'}
  app().innerHTML=tbH()+'<div class="PG FADE"><div class="CARD" style="background:#FFF8E1;border-color:#FFE082;text-align:center;padding:16px"><div style="font-size:2rem">'+title.split(' ')[0]+'</div><div style="font-size:1rem;font-weight:900;color:#1976D2;margin-top:3px">'+title.split(' ').slice(1).join(' ')+'</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'+sH+'</div>'+invH+'<button class="BTN B-GR BW" onclick="go(\'home\')">回首頁</button></div>'+bnH('stats')
}

/* ======= SETTINGS ======= */
function rSettings(){
  var p=S.p,apiKey=getApiKey();
  app().innerHTML=tbH()+'<div class="PG FADE">'+
    '<div style="font-size:.92rem;font-weight:700">⚙️ 設定</div>'+
    '<div class="CARD">'+
      '<div class="STROW"><div><div style="font-size:.85rem;font-weight:700">顯示名稱</div><div style="font-size:.68rem;color:var(--t2)">目前：'+p.displayName+'</div></div><button class="BTN B-WH" style="padding:6px 12px;font-size:.74rem" onclick="chgName()">修改</button></div>'+
      '<div class="STROW"><div><div style="font-size:.85rem;font-weight:700">✏️ 手寫辨識</div><div style="font-size:.68rem;color:var(--t2)">'+(apiKey?'已設定 API Key，可開啟':'未設定 API Key，請先設定')+'</div></div><div class="TOG'+(p.settings.useHandwriting&&apiKey?' ON':'')+'" onclick="if(!getApiKey()){toast('請先設定 API Key');return}S.p.settings.useHandwriting=!S.p.settings.useHandwriting;saveP();rSettings()"></div></div>'+
    '</div>'+
    '<div class="CARD" style="background:#F0FFF4;border-color:#A5D6A7">'+
      '<div style="font-size:.8rem;font-weight:700;margin-bottom:8px">🔑 Anthropic API Key（手寫辨識用）</div>'+
      '<div style="font-size:.68rem;color:var(--t2);margin-bottom:10px">前往 console.anthropic.com 取得 API Key，貼在下方即可使用手寫功能。Key 只儲存在此裝置本機。</div>'+
      '<input class="INP" id="akey" type="password" placeholder="sk-ant-..." value="'+(apiKey?apiKey.slice(0,8)+'…':'')+'" style="margin-bottom:8px;font-size:.82rem">'+
      '<button class="BTN B-GR BW" style="padding:10px;font-size:.82rem" onclick="saveApiKey()">💾 儲存 API Key</button>'+
      (apiKey?'<button class="BTN B-WH BW" style="padding:8px;font-size:.76rem;margin-top:6px" onclick="clearApiKey()">🗑 清除 API Key</button>':'')+
    '</div>'+
    '<div class="CARD">'+
      '<div style="font-size:.8rem;font-weight:700;margin-bottom:10px">帳號資訊</div>'+
      '<div class="BDR"><span style="color:var(--t1)">帳號</span><span style="font-weight:700">@'+p.name+'</span></div>'+
      '<div class="BDR"><span style="color:var(--t1)">等級</span><span style="font-weight:700">Lv.'+p.level+'</span></div>'+
      '<div class="BDR"><span style="color:var(--t1)">登入天數</span><span style="font-weight:700">'+(p.loginDays||1)+'天</span></div>'+
    '</div>'+
    '<button class="BTN B-RD BW" style="padding:12px" onclick="logout()">🚪 登出</button>'+
    '<button class="BTN B-WH BW" style="padding:10px;font-size:.82rem" onclick="go(\'home\')">← 返回</button>'+
  '</div>'+bnH('home')
}
function saveApiKey(){
  var val=(document.getElementById('akey')?.value||'').trim();
  if(!val||val.includes('…')){toast('請輸入完整的 API Key');return}
  try{localStorage.setItem('mt_apikey',val)}catch(e){}
  toast('✅ API Key 已儲存！可以使用手寫辨識了');rSettings()
}
function clearApiKey(){
  try{localStorage.removeItem('mt_apikey')}catch(e){}
  S.p.settings.useHandwriting=false;saveP();toast('API Key 已清除');rSettings()
}
function chgName(){var n=prompt('輸入新的顯示名稱：',S.p.displayName);if(n&&n.trim()){S.p.displayName=n.trim();saveP();rSettings();toast('名稱已更新！')}}
function logout(){if(!confirm('確定要登出？'))return;S.p=null;S.edit=false;S.placing=null;S.mode=null;if(S.ftick){clearInterval(S.ftick);S.ftick=null}go('splash')}

/* ======= INIT ======= */
render();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
