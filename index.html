var GRR={d1:[1,9],d2:[10,99],d3:[100,999],d4:[1000,9999]};
function r1dp(){return Math.round(rnd(1,99))/10}
function makeQ(mode,grade){
  var gd=getGRS(grade);
  if(gd&&gd.dec){var a=r1dp(),b=r1dp();if(mode==='sub'&&a<b){var t=a;a=b;b=t}if(mode==='mul'){b=rnd(2,9);return{q:a+' × '+b,a:(Math.round(a*b*10)/10).toString()}}var ans=Math.round((mode==='sub'?a-b:a+b)*10)/10;return{q:a+(mode==='sub'?' − ':' + ')+b,a:ans.toString()}}
  if(gd&&gd.frac){var d=[2,3,4,5,6,8][rnd(0,5)];var a2=rnd(1,d-1),b2=rnd(1,d-1);if(mode==='sub'){a2=Math.max(a2,b2)+1;b2=rnd(1,a2-1)}var num=mode==='sub'?a2-b2:a2+b2;var w=Math.floor(num/d),rem=num%d;var aStr=rem===0?w.toString():(w>0?w+'又'+rem+'/'+d:rem+'/'+d);return{q:a2+'/'+d+(mode==='sub'?' − ':' + ')+b2+'/'+d,a:aStr}}
  var r=GRR[grade]||[1,9],a,b;

  if(mode==='sub'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);if(a<b){var t2=a;a=b;b=t2}return{q:a+' − '+b,a:(a-b).toString()}}
  if(mode==='mul'){var pp={d1:[rnd(2,9),rnd(2,9)],d2:[rnd(10,99),rnd(2,9)],d3:[rnd(11,99),rnd(11,99)],d4:[rnd(100,999),rnd(11,99)]};var p2=pp[grade]||pp.d1;return{q:p2[0]+' × '+p2[1],a:(p2[0]*p2[1]).toString()}}
  if(mode==='div'){var d2=rnd(2,9),q2=rnd(Math.max(2,Math.ceil(r[0]/d2)),Math.max(2,Math.floor(r[1]/d2)));return{q:(d2*q2)+' ÷ '+d2,a:q2.toString()}}
  if(mode==='as'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);var c=rnd(r[0],r[1]);var v=a+b-c;if(v<0)v=0;return{q:'('+a+'+'+b+')−'+c,a:v.toString()}}
  if(mode==='99'){a=rnd(1,9);b=rnd(1,9);return{q:a+' × '+b,a:(a*b).toString()}}
  if(mode==='ck'){var h=rnd(1,12),mn=[0,5,10,15,20,25,30,35,40,45,50,55][rnd(0,11)];return{q:'',h:h,m:mn,a:h+':'+(mn<10?'0':'')+mn,isClock:true}}
  return{q:'2+2',a:'4'}
}

  var cfm=document.createElement('button');cfm.style.cssText='display:block;width:100%;padding:13px;background:#4CAF50;color:#fff;border:none;border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px';cfm.textContent='✓ 確認修改';
  cfm.addEventListener('click',function(){
    var op=(document.getElementById('cp0')?.value||'').trim();
    var np=(document.getElementById('cp1')?.value||'').trim();
    var np2=(document.getElementById('cp2')?.value||'').trim();
    var err=document.getElementById('perr');
    if(hPin(op)!==S.p.pin){err.textContent='目前 PIN 錯誤';return}
    if(!/^\d{4}$/.test(np)){err.textContent='新 PIN 需為 4 位數字';return}
    if(np!==np2){err.textContent='新 PIN 不一致';return}
    S.p.pin=hPin(np);S.accounts=getAccs();var acc=S.accounts.find(function(a){return a.name===S.p.name});if(acc)acc.pinHash=hPin(np);saveAccs();saveP();ov.remove();toast('✅ PIN 已修改！');
  });
  var ccl=document.createElement('button');ccl.style.cssText='display:block;width:100%;padding:11px;background:#F7F9FA;border:1.5px solid #E0E7EF;color:#1B2631;border-radius:12px;font-size:.88rem;cursor:pointer;font-family:inherit';ccl.textContent='取消';ccl.addEventListener('click',function(){ov.remove()});
  box.appendChild(cfm);box.appendChild(ccl);ov.appendChild(box);ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()});document.body.appendChild(ov);
}
render();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});

</script>
