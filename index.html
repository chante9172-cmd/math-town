var SUPA_URL = 'https://bbheqrizaglidbfyrkuq.supabase.co';

<script>


// ============================================================
// SUPABASE SYNC - fill in your project URL and anon key
// ============================================================
// SUPA_URL and SUPA_KEY defined in config script
// Supabase REST API (no external library needed)
var supabase = null; // will be set to true when config is valid

function initSupabase(){
  var hasConfig=SUPA_URL&&SUPA_URL.includes('.supabase.co')&&SUPA_KEY&&SUPA_KEY.length>10;
  if(!hasConfig)return false;
  supabase={
    _url: SUPA_URL+'/rest/v1',
    _key: SUPA_KEY,
    from: function(table){
      var base=this._url+'/'+table;
      var key=this._key;
      return {
        upsert: async function(data, opts){
          try{
            var onConf=opts&&opts.onConflict?opts.onConflict:'username';
            var r=await fetch(base+'?on_conflict='+onConf, {
              method:'POST',
              headers:{
                'Content-Type':'application/json',
                'apikey':key,
                'Authorization':'Bearer '+key,
                'Prefer':'resolution=merge-duplicates,return=representation'
              },
              body:JSON.stringify(Array.isArray(data)?data:[data])
            });
            if(!r.ok){
              var eText=await r.text();
              console.error('Supabase upsert failed:',r.status,eText);
              return{error:{message:'HTTP '+r.status+': '+eText}};
            }
            return{data:true,error:null};
          }catch(e){return{error:{message:e.message}};}
        },
        select: function(cols){
          var q=base+'?select='+(cols||'*');
          return {
            eq: function(col,val){
              var qf=q+'&'+col+'=eq.'+encodeURIComponent(val);
              return {
                single: async function(){
                  try{
                    var r=await fetch(qf,{headers:{'apikey':key,'Authorization':'Bearer '+key,'Accept':'application/vnd.pgrst.object+json'}});
                    if(r.status===406||r.status===404)return{data:null,error:{code:'PGRST116'}};
                    if(!r.ok)return{data:null,error:{message:'HTTP '+r.status}};
                    var d=await r.json();
                    return{data:d,error:null};
                  }catch(e){return{data:null,error:{message:e.message}};}
                }
              };
            }
          };
        }
      };
    }
  };
  hookSupabaseSave();
  console.log('✅ Supabase REST connected!');
  return true;
}

async function supabaseSave(){
  if(!supabase||!S.p)return false;
  var code=exportSaveCode();
  if(!code)return false;
  var uname=(S.p.name||S.p.displayName||'').toLowerCase().replace(/[^a-z0-9_]/g,'_');
  if(!uname)return false;
  try{
    var res=await supabase.from('mt_saves').upsert({
      username:uname,
      display_name:S.p.displayName||S.p.name,
      save_code:code,
      level:S.p.level||1,
      coins:S.p.coins||0,
      updated_at:new Date().toISOString()
    },{onConflict:'username'});
    if(res.error){
      console.error('Supabase save error:',JSON.stringify(res.error));
      return false;
    }
    return true;
  }catch(e){console.warn('Supabase save failed:',e);return false}
}

async function supabaseLoad(username){
  if(!supabase)return null;
  try{
    var res=await supabase.from('mt_saves').select('*').eq('username',username.toLowerCase()).single();
    if(res.error||!res.data)return null;
    return res.data.save_code;
  }catch(e){return null}
}

// Auto-save to Supabase on saveP
var _origSaveP=null;
function hookSupabaseSave(){
  if(_origSaveP)return;
  _origSaveP=saveP;
  // saveP calls happen frequently; debounce cloud sync
  var debTimer=null;
  window._supabaseAutoSync=function(){
    if(!SUPA_URL||!supabase)return;
    clearTimeout(debTimer);
    debTimer=setTimeout(function(){supabaseSave()},3000);
  };
}

var TF_MODEL = null;
var TF_READY = false;
var TF_LOADING = false;

async function initOCR() {
  if (TF_READY || TF_LOADING) return;
  TF_LOADING = true;
  function setSt(t, c) {
    ['OCR','ocr-status'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.textContent = t; if (c) el.style.color = c; }
    });
  }
  setSt('📥 載入 AI 辨識模型…', '#FF9800');
  try {
    if (typeof tf === 'undefined') throw new Error('TF.js not loaded');
    var modelP = tf.loadLayersModel(
      'https://storage.googleapis.com/tfjs-models/tfjs/mnist_transfer_cnn_v1/model.json'
    );
    var timeP = new Promise(function(_,rej){ setTimeout(function(){rej(new Error('timeout'))},12000); });
    TF_MODEL = await Promise.race([modelP, timeP]);
    // Warmup prediction
    tf.tidy(function(){ TF_MODEL.predict(tf.zeros([1,28,28,1])); });
    TF_READY = true; TF_LOADING = false;
    setSt('✅ AI 模型已就緒', '#4CAF50');
  } catch(e) {
    TF_LOADING = false; TF_READY = 'fallback';
    setSt('✏️ 本機辨識模式', '#4CAF50');
    console.log('TF not available:', e.message);
  }
}

// Render strokes onto a 28x28 canvas for MNIST input
function renderTo28x28(strokes) {
  // Step 1: render at high resolution (280x280) for quality
  var big = document.createElement('canvas');
  big.width = 280; big.height = 280;
  var bctx = big.getContext('2d');
  bctx.fillStyle = '#000'; bctx.fillRect(0,0,280,280);
  if(!strokes||!strokes.length) {
    // Return 28x28 blank
    var t=document.createElement('canvas');t.width=28;t.height=28;
    return t;
  }
  var all=[]; strokes.forEach(function(s){all=all.concat(s.pts)});
  var minX=all[0].x,maxX=all[0].x,minY=all[0].y,maxY=all[0].y;
  all.forEach(function(p){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)});
  var W=maxX-minX||1,H=maxY-minY||1;
  // Center with 20% padding
  var sc=Math.min(280*0.6/W, 280*0.6/H);
  var ox=(280-W*sc)/2-minX*sc;
  var oy=(280-H*sc)/2-minY*sc;
  bctx.strokeStyle='#fff';
  bctx.lineWidth=Math.max(12, 20*sc);  // thick strokes for 280px canvas
  bctx.lineCap='round'; bctx.lineJoin='round';
  strokes.forEach(function(st){
    if(!st.pts||st.pts.length<2)return;
    bctx.beginPath(); bctx.moveTo(st.pts[0].x*sc+ox, st.pts[0].y*sc+oy);
    for(var i=1;i<st.pts.length;i++) bctx.lineTo(st.pts[i].x*sc+ox, st.pts[i].y*sc+oy);
    bctx.stroke();
  });
  // Step 2: downscale to 28x28
  var small=document.createElement('canvas');small.width=28;small.height=28;
  var sctx=small.getContext('2d');
  sctx.drawImage(big,0,0,280,280,0,0,28,28);
  return small;
}

async function recognizeWithTF(strokes) {
  if (TF_READY !== true || !TF_MODEL) return null;
  try {
    var canvas28 = renderTo28x28(strokes);
    var data = await new Promise(function(resolve) {
      var tensor = tf.tidy(function() {
        var img = tf.browser.fromPixels(canvas28, 1); // shape [28,28,1]
        return img.toFloat().div(255.0).expandDims(0); // shape [1,28,28,1]
      });
      var pred = TF_MODEL.predict(tensor);
      var idx = pred.argMax(-1).dataSync()[0];
      tensor.dispose(); pred.dispose();
      resolve(idx);
    });
    return data;
  } catch(e) {
    console.error('TF predict:', e);
    return null;
  }
}

var TF_MODEL = null;
var TF_READY = false;
var TF_LOADING = false;

async function initOCR() {
  if (TF_READY || TF_LOADING) return;
  TF_LOADING = true;
  function setSt(t, c) {
    ['OCR','ocr-status'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.textContent = t; if (c) el.style.color = c; }
    });
  }
  setSt('📥 載入 AI 辨識模型…', '#FF9800');
  try {
    if (typeof tf === 'undefined') throw new Error('TF.js not loaded');
    var modelP = tf.loadLayersModel(
      'https://storage.googleapis.com/tfjs-models/tfjs/mnist_transfer_cnn_v1/model.json'
    );
    var timeP = new Promise(function(_,rej){ setTimeout(function(){rej(new Error('timeout'))},12000); });
    TF_MODEL = await Promise.race([modelP, timeP]);
    // Warmup prediction
    tf.tidy(function(){ TF_MODEL.predict(tf.zeros([1,28,28,1])); });
    TF_READY = true; TF_LOADING = false;
    setSt('✅ AI 模型已就緒', '#4CAF50');
  } catch(e) {
    TF_LOADING = false; TF_READY = 'fallback';
    setSt('✏️ 本機辨識模式', '#4CAF50');
    console.log('TF not available:', e.message);
  }
}

// Render strokes onto a 28x28 canvas for MNIST input
function renderTo28x28(strokes) {
  // Step 1: render at high resolution (280x280) for quality
  var big = document.createElement('canvas');
  big.width = 280; big.height = 280;
  var bctx = big.getContext('2d');
  bctx.fillStyle = '#000'; bctx.fillRect(0,0,280,280);
  if(!strokes||!strokes.length) {
    // Return 28x28 blank
    var t=document.createElement('canvas');t.width=28;t.height=28;
    return t;
  }
  var all=[]; strokes.forEach(function(s){all=all.concat(s.pts)});
  var minX=all[0].x,maxX=all[0].x,minY=all[0].y,maxY=all[0].y;
  all.forEach(function(p){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)});
  var W=maxX-minX||1,H=maxY-minY||1;
  // Center with 20% padding
  var sc=Math.min(280*0.6/W, 280*0.6/H);
  var ox=(280-W*sc)/2-minX*sc;
  var oy=(280-H*sc)/2-minY*sc;
  bctx.strokeStyle='#fff';
  bctx.lineWidth=Math.max(12, 20*sc);  // thick strokes for 280px canvas
  bctx.lineCap='round'; bctx.lineJoin='round';
  strokes.forEach(function(st){
    if(!st.pts||st.pts.length<2)return;
    bctx.beginPath(); bctx.moveTo(st.pts[0].x*sc+ox, st.pts[0].y*sc+oy);
    for(var i=1;i<st.pts.length;i++) bctx.lineTo(st.pts[i].x*sc+ox, st.pts[i].y*sc+oy);
    bctx.stroke();
  });
  // Step 2: downscale to 28x28
  var small=document.createElement('canvas');small.width=28;small.height=28;
  var sctx=small.getContext('2d');
  sctx.drawImage(big,0,0,280,280,0,0,28,28);
  return small;
}

async function recognizeWithTF(strokes) {
  if (TF_READY !== true || !TF_MODEL) return null;
  try {
    var canvas28 = renderTo28x28(strokes);
    var data = await new Promise(function(resolve) {
      var tensor = tf.tidy(function() {
        var img = tf.browser.fromPixels(canvas28, 1); // shape [28,28,1]
        return img.toFloat().div(255.0).expandDims(0); // shape [1,28,28,1]
      });
      var pred = TF_MODEL.predict(tensor);
      var idx = pred.argMax(-1).dataSync()[0];
      tensor.dispose(); pred.dispose();
      resolve(idx);
    });
    return data;
  } catch(e) {
    console.error('TF predict:', e);
    return null;
  }
}

// STROKE RECOGNIZER v5 - Per-digit optimized rules
// ============================================================

function rasterStrokes(strokes, N) {
  var g=[];for(var r=0;r<N;r++){g.push([]);for(var c=0;c<N;c++)g[r].push(0);}
  if(!strokes||!strokes.length)return g;
  var all=[];strokes.forEach(function(s){all=all.concat(s.pts)});
  if(all.length<2)return g;
  var minX=all[0].x,maxX=all[0].x,minY=all[0].y,maxY=all[0].y;
  all.forEach(function(p){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)});
  var W=maxX-minX||1,H=maxY-minY||1;
  strokes.forEach(function(st){
    for(var i=1;i<st.pts.length;i++){
      var p0=st.pts[i-1],p1=st.pts[i];
      var steps=Math.max(4,Math.ceil(Math.hypot(p1.x-p0.x,p1.y-p0.y)/2));
      for(var s=0;s<=steps;s++){
        var t=s/steps,x=p0.x+(p1.x-p0.x)*t,y=p0.y+(p1.y-p0.y)*t;
        var col=Math.min(N-1,Math.max(0,Math.floor((x-minX)/W*(N-1))));
        var row=Math.min(N-1,Math.max(0,Math.floor((y-minY)/H*(N-1))));
        g[row][col]=1;
        if(col>0)g[row][col-1]=1;if(col<N-1)g[row][col+1]=1;
        if(row>0)g[row-1][col]=1;if(row<N-1)g[row+1][col]=1;
      }
    }
  });
  return g;
}

function gd(g,N,r1,r2,c1,c2){
  var s=0,t=(r2-r1)*(c2-c1)||1;
  for(var r=r1;r<r2;r++)for(var c=c1;c<c2;c++)s+=g[r][c];
  return s/t;
}

function windingNumber(pts) {
  if(pts.length<10)return 0;
  var sm=[],win=3;
  for(var i=win;i<pts.length-win;i++){
    var sx=0,sy=0;
    for(var j=-win;j<=win;j++){sx+=pts[i+j].x;sy+=pts[i+j].y}
    sm.push({x:sx/(2*win+1),y:sy/(2*win+1)});
  }
  if(sm.length<4)return 0;
  var total=0;
  for(var i=1;i<sm.length-1;i++){
    var ax=sm[i].x-sm[i-1].x,ay=sm[i].y-sm[i-1].y;
    var bx=sm[i+1].x-sm[i].x,by=sm[i+1].y-sm[i].y;
    if(Math.hypot(ax,ay)<0.5||Math.hypot(bx,by)<0.5)continue;
    total+=Math.atan2(ax*by-ay*bx,ax*bx+ay*by);
  }
  return Math.abs(total)/(2*Math.PI);
}

function strokeWinding(strokes){
  var w=0;strokes.forEach(function(s){w+=windingNumber(s.pts)});return w;
}

// Get the starting direction of a stroke
function strokeStartDir(st) {
  var pts=st.pts;if(pts.length<4)return{dx:0,dy:0};
  var n=Math.min(8,Math.floor(pts.length/4));
  return{dx:pts[n].x-pts[0].x, dy:pts[n].y-pts[0].y};
}

// Get ending direction
function strokeEndDir(st) {
  var pts=st.pts,n=pts.length;if(n<4)return{dx:0,dy:0};
  var k=Math.min(8,Math.floor(n/4));
  return{dx:pts[n-1].x-pts[n-1-k].x, dy:pts[n-1].y-pts[n-1-k].y};
}

// Does stroke go mostly left-to-right?
function strokeLtoR(st){var d=strokeStartDir(st);return d.dx>Math.abs(d.dy)*0.3}
function strokeRtoL(st){var d=strokeStartDir(st);return d.dx<-Math.abs(d.dy)*0.3}

function classifyDigitFallback(strokes) {
  if(!strokes||!strokes.length)return null;
  var all=[];strokes.forEach(function(s){all=all.concat(s.pts)});
  if(all.length<4)return null;

  var minX=all[0].x,maxX=all[0].x,minY=all[0].y,maxY=all[0].y;
  all.forEach(function(p){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)});
  var W=maxX-minX+1,H=maxY-minY+1,asp=W/H;
  var nSt=strokes.length;
  var wind=strokeWinding(strokes);

  var N=16,g=rasterStrokes(strokes,N);
  // 4 quadrants
  var tl=gd(g,N,0,8,0,8),tr=gd(g,N,0,8,8,16);
  var bl=gd(g,N,8,16,0,8),br=gd(g,N,8,16,8,16);
  // Thirds
  var topT=gd(g,N,0,5,0,16),   midT=gd(g,N,5,11,0,16),   botT=gd(g,N,11,16,0,16);
  var leftT=gd(g,N,0,16,0,5),  midLR=gd(g,N,0,16,5,11),  rightT=gd(g,N,0,16,11,16);
  // More granular
  var topRow=gd(g,N,0,2,0,16); // very top edge
  var botRow=gd(g,N,14,16,0,16); // very bottom edge
  var midRow=gd(g,N,7,9,0,16);   // very middle row
  var topR=gd(g,N,0,5,10,16),topL=gd(g,N,0,5,0,6);
  var botR=gd(g,N,11,16,10,16),botL=gd(g,N,11,16,0,6);
  var midLeft=gd(g,N,6,10,0,5),midRight=gd(g,N,6,10,11,16);
  // Center region
  var center=gd(g,N,5,11,5,11);

  // ─────────────────────────────────────────
  // DIGIT RULES
  // ─────────────────────────────────────────

  // ── 1: Very narrow ──
  if(asp<0.35)return 1;
  if(asp<0.48&&nSt===1&&wind<0.4)return 1;

  // ── 8: Two strong loops OR single figure-eight stroke ──
  // 8 drawn as two separate circles = wind sum from both strokes
  // 8 drawn as single connected = very high winding
  if(wind>1.25)return 8;
  // Two strokes each with a loop
  if(nSt>=2){
    var loopCount=0;
    strokes.forEach(function(s){if(windingNumber(s.pts)>0.55)loopCount++});
    if(loopCount>=2)return 8;
  }
  // Single stroke 8: has both top and bottom loops → symmetric density
  if(wind>0.85&&tl>0.15&&tr>0.15&&bl>0.15&&br>0.15)return 8;

  // ── 0, 6, 9: Single loop ──
  if(wind>0.55){
    var topHalf=tl+tr, botHalf=bl+br;
    var diff=(topHalf-botHalf)/((topHalf+botHalf)||0.01);
    // 0: balanced both halves
    if(Math.abs(diff)<0.18)return 0;
    // 9: loop in top, tail goes down from bottom-right
    if(diff>0.18)return 9;
    // 6: loop in bottom, opening at top
    return 6;
  }

  // ── 4: Two strokes OR one stroke making the 4-shape ──
  // 4 has: upper-left line going diagonally + vertical right + crossbar
  // Key feature: LEFT side has top-to-middle content, and there's a vertical right bar
  // AND a horizontal crossbar in the middle
  if(nSt>=2){
    // Check for 4: one stroke is a diagonal or vertical-left, other is vertical-right
    var hasVertRight=strokes.some(function(s){
      var pts=s.pts;var n=pts.length;if(n<5)return false;
      var dx=Math.abs(pts[n-1].x-pts[0].x),dy=Math.abs(pts[n-1].y-pts[0].y);
      return dy>dx*1.5;
    });
    if(hasVertRight&&tl>0.1&&rightT>0.2&&midT>0.15)return 4;
  }
  // Single-stroke 4: diagonal + bend + vertical
  if(tl>0.15&&tr>0.1&&rightT>0.25&&midRow>0.1&&wind<0.4)return 4;

  // ── 7: Top horizontal bar, diagonal going down-left ──
  // 7: strong top row, bottom goes to LEFT side
  if(topRow>0.35&&botL>0.05&&tl>0.05&&wind<0.35)return 7;
  if(topRow>0.45&&bl<0.15)return 7;

  // ── 3: Two bumps on right, open left ──
  // 3: right side has content top AND bottom, left side empty
  if(rightT>0.35&&leftT<0.12&&topR>0.15&&botR>0.15&&midLeft<0.1)return 3;
  if(tr>0.25&&br>0.25&&bl<0.1&&tl<0.1&&wind<0.4)return 3;

  // ── 5: Top-left bar + middle-right turn + bottom-right curve ──
  // 5 starts with a LEFT-going stroke (or has top-left density)
  // Then has bottom-right curve
  // Key: topL > topR AND botR > botL
  if(topL>topR+0.02&&botR>botL&&midRow>0.05&&asp>0.45)return 5;
  // Also: first stroke goes right-to-left (the top bar)
  if(nSt>=2){
    var firstGoesLeft=strokes[0].pts.length>3&&strokeRtoL(strokes[0]);
    if(firstGoesLeft&&botR>0.1)return 5;
  }

  // ── 2: Top-right start, sweeps to bottom-left ──
  // 2: starts upper-right, ends lower-left, has bottom horizontal
  if(tr>0.2&&botRow>0.15&&tl<tr-0.02&&wind<0.4)return 2;
  if(topR>0.2&&botL>0.1&&wind<0.35)return 2;

  // ── Remaining fallbacks ──
  if(asp<0.55)return 1;
  if(rightT>leftT*1.8&&topR>0.1&&botR>0.1)return 3;
  if(topR>0.2&&botL>0.08)return 2;
  if(topL>0.15&&botR>0.15)return 5;
  return 2;
}

function splitIntoDigitsFallback(strokes, gMinX, gMaxX) {
  if(!strokes.length)return[];
  var info=strokes.map(function(st){
    var pts=st.pts,mnX=pts[0].x,mxX=pts[0].x;
    pts.forEach(function(p){mnX=Math.min(mnX,p.x);mxX=Math.max(mxX,p.x)});
    return{st:st,minX:mnX,maxX:mxX,cx:(mnX+mxX)/2};
  }).sort(function(a,b){return a.cx-b.cx});
  var totalW=gMaxX-gMinX,gapT=Math.max(18,totalW*0.22);
  var groups=[{strokes:[info[0].st],minX:info[0].minX,maxX:info[0].maxX}];
  for(var i=1;i<info.length;i++){
    var last=groups[groups.length-1],cur=info[i];
    if(cur.minX-last.maxX<gapT||cur.minX<last.maxX+3){
      last.strokes.push(cur.st);last.maxX=Math.max(last.maxX,cur.maxX);
    }else groups.push({strokes:[cur.st],minX:cur.minX,maxX:cur.maxX});
  }
  return groups;
}

function recognizeStrokesFallback(strokes, isClock) {
  if(!strokes||!strokes.length)return null;
  var all=[];strokes.forEach(function(s){all=all.concat(s.pts)});
  if(all.length<4)return null;
  var minX=all[0].x,maxX=all[0].x;
  all.forEach(function(p){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x)});
  var groups=splitIntoDigitsFallback(strokes,minX,maxX);
  if(!groups.length)return null;
  var result='';
  for(var i=0;i<Math.min(groups.length,3);i++){
    var d=classifyDigitFallback(groups[i].strokes);
    if(d===null)return null;
    result+=String(d);
  }
  return result||null;
}

var OCR_LOADING=false;

// Preprocess canvas: white bg, thicken strokes, scale up for OCR
function preprocessCanvas(cv){
  // Re-draw strokes cleanly on a large white canvas using S.strokes data
  var W=600,H=240;
  var out=document.createElement('canvas');out.width=W;out.height=H;
  var ctx=out.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);

  if(!S.strokes||S.strokes.length===0){
    // Fallback: read pixels from source canvas
    var src=cv.getContext('2d');
    var sd=src.getImageData(0,0,cv.width,cv.height).data;
    var minX=cv.width,maxX=0,minY=cv.height,maxY=0;
    for(var i=0;i<sd.length;i+=4){
      if(sd[i+3]>10){var px=(i/4)%cv.width,py=Math.floor(i/4/cv.width);
        minX=Math.min(minX,px);maxX=Math.max(maxX,px);
        minY=Math.min(minY,py);maxY=Math.max(maxY,py);}
    }
    if(maxX>minX&&maxY>minY){
      var pad=15,sw=maxX-minX+pad*2,sh=maxY-minY+pad*2;
      var sc=Math.min((W-40)/sw,(H-40)/sh);
      ctx.drawImage(cv,minX-pad,minY-pad,sw,sh,(W-sw*sc)/2,(H-sh*sc)/2,sw*sc,sh*sc);
    }
  } else {
    // Re-draw from stroke data for clean, scalable result
    // Find bounds
    var allPts=[];
    S.strokes.forEach(function(st){st.pts.forEach(function(p){allPts.push(p)})});
    if(allPts.length===0)return out;
    var minX2=allPts[0].x,maxX2=allPts[0].x,minY2=allPts[0].y,maxY2=allPts[0].y;
    allPts.forEach(function(p){
      minX2=Math.min(minX2,p.x);maxX2=Math.max(maxX2,p.x);
      minY2=Math.min(minY2,p.y);maxY2=Math.max(maxY2,p.y);
    });
    var pad=25;
    minX2-=pad;maxX2+=pad;minY2-=pad;maxY2+=pad;
    var srcW2=maxX2-minX2,srcH2=maxY2-minY2;
    // Scale up to fill output canvas
    var sc2=Math.min((W-20)/srcW2,(H-20)/srcH2);
    var offX2=(W-srcW2*sc2)/2-minX2*sc2;
    var offY2=(H-srcH2*sc2)/2-minY2*sc2;
    ctx.strokeStyle='#000';
    ctx.lineWidth=Math.max(6,8*sc2);  // thick strokes
    ctx.lineCap='round';ctx.lineJoin='round';
    S.strokes.forEach(function(st){
      if(!st.pts||st.pts.length<2)return;
      ctx.beginPath();
      ctx.moveTo(st.pts[0].x*sc2+offX2,st.pts[0].y*sc2+offY2);
      for(var i=1;i<st.pts.length;i++)
        ctx.lineTo(st.pts[i].x*sc2+offX2,st.pts[i].y*sc2+offY2);
      ctx.stroke();
    });
  }
  return out;
}

async function recognizeLocal(isClock){
  var cv=document.getElementById('CC');if(!cv)return null;
  function setSt(t,c){
    var el=document.getElementById('OCR');
    if(el){el.textContent=t;if(c)el.style.color=c}
  }
  if(!OCR_READY){
    setSt('⏳ 載入模型中…','#FF9800');
    await initOCR();
    if(!OCR_READY){setSt('❌ 模型未就緒，請用鍵盤','#EF4444');return null}
  }
  setSt('🔍 辨識中…','#1976D2');
  try{
    var processed=preprocessCanvas(cv);
    // Temporarily update PSM for recognition
    await OCR_WORKER.setParameters({
      tessedit_char_whitelist:'0123456789/:',
      tessedit_pageseg_mode:'7',
    });
    var result=await OCR_WORKER.recognize(processed);
    var raw=result.data.text||'';
    var txt=raw.trim().replace(/[^0-9:./]/g,'').replace(/[./]/g,'');
    console.log('OCR raw:',JSON.stringify(raw),'->',txt,
      'conf:',result.data.confidence);
    if(!txt||txt.length===0){
      // Try PSM 8 as fallback
      await OCR_WORKER.setParameters({tessedit_pageseg_mode:'8'});
      var r2=await OCR_WORKER.recognize(processed);
      txt=(r2.data.text||'').trim().replace(/[^0-9:]/g,'');
      console.log('PSM8 fallback:',txt);
    }
    if(isClock){
      var m=txt.match(/\d{1,2}:\d{2}/);
      if(m){setSt('✓ '+m[0],'#4CAF50');return m[0]}
      setSt('⚠️ 格式錯誤，請寫 H:MM','#FF9800');return null;
    } else {
      var nums=txt.match(/\d+/g);
      if(!nums||nums.length===0){
        setSt('⚠️ 無法辨識，請重寫或用鍵盤','#EF4444');return null;
      }
      var ans=nums.sort(function(a,b){return b.length-a.length})[0];
      setSt('✓ 辨識：'+ans,'#4CAF50');
      return ans;
    }
  }catch(e){
    console.error('OCR:',e);
    setSt('❌ 錯誤：'+e.message,'#EF4444');return null;
  }
}

function checkAchievements(trigger, val) {
  if(!S.p)return;
  if(!S.p.achievements)S.p.achievements={};
  var unlocked=[];
  function earn(id){
    if(!S.p.achievements[id]){
      S.p.achievements[id]=true;
      var a=ACHIEVEMENTS[id];
      if(a){
        unlocked.push(a);
        var ov=document.createElement('div');
        ov.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#7B1FA2,#1565C0);color:#fff;border-radius:16px;padding:12px 20px;z-index:9999;text-align:center;animation:pop .4s ease;box-shadow:0 4px 20px rgba(0,0,0,.4);min-width:200px';

        document.body.appendChild(ov);setTimeout(function(){ov.remove()},3000);
        S.p.coins+=15;
        toast('🏆 '+a.n+' +🪙15');
      }
    }
  }
  if(trigger==='quiz'){earn('first_quiz')}
  if(trigger==='streak'&&val>=5)earn('streak5');
  if(trigger==='streak'&&val>=10)earn('streak10');
  if(trigger==='perfect')earn('perfect');
  if(trigger==='level'&&S.p.level>=5)earn('lv5');
  if(trigger==='level'&&S.p.level>=10)earn('lv10');
  if(trigger==='coins'&&S.p.totalCE>=500)earn('rich');
  if(trigger==='orders'&&(S.p.totalOrders||0)>=10)earn('orders10');

    var cnt=S.p.town.filter(function(t){return t&&t.indexOf('_PART_')<0}).length;
    if(cnt>=10)earn('builder');
  }
  if(unlocked.length)saveP();
}

    if(q.target){q.progress=(q.progress||0)+amount;if(q.progress>=q.target){q.done=true}}

async function recognizeHW(isClock){
  var st=document.getElementById('OCR');
  function setStatus(t,c){
    if(st){st.textContent=t;if(c)st.style.color=c;st.style.fontWeight='700'}
  }
  if(!S.strokes||S.strokes.length===0){
    setStatus('⚠️ 請先寫上答案','#FF9800');return null;
  }

  // Get all points for splitting into groups
  var all=[];S.strokes.forEach(function(s){all=all.concat(s.pts)});
  var minX=all[0].x,maxX=all[0].x;
  all.forEach(function(p){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x)});
  var groups=splitIntoDigitsFallback(S.strokes,minX,maxX);

  // Try TensorFlow.js MNIST if available
  if(TF_READY===true&&TF_MODEL){
    setStatus('🔍 AI 辨識中…','#1976D2');
    try{
      var digits=[];
      for(var i=0;i<Math.min(groups.length,3);i++){
        var tfP=recognizeWithTF(groups[i].strokes);
        var toP=new Promise(function(_,rej){setTimeout(function(){rej('timeout')},4000)});
        var d=await Promise.race([tfP,toP]);
        if(d===null||d===undefined){digits=null;break}
        digits.push(d);
      }
      if(digits&&digits.length>0){
        var ans=digits.join('');
        setStatus('✅ AI辨識：'+ans,'#4CAF50');return ans;
      }
    }catch(e){
      console.log('TF error:',e);
      // Fall through to rule-based
    }
  }

  // Rule-based fallback (always works, offline)
  var result=recognizeStrokesFallback(S.strokes,isClock);
  if(result!==null){
    setStatus('✅ 辨識：'+result,'#2E7D32');return result;
  }
  setStatus('⚠️ 無法辨識，請重寫或改用鍵盤','#FF9800');
  return null;
}

var ISO={
  TW:64, TH:32,  // tile width/height
  canvas:null, ctx:null,
  offX:0, offY:0, zoom:1,
  dragging:false, dragX:0, dragY:0, dragOX:0, dragOY:0,
  pinchDist:0,
  dirty:true
};

// Grid position -> screen position (canvas center of tile top)
function isoToScreen(col,row){
  var sx=(col-row)*ISO.TW/2*ISO.zoom + ISO.offX;
  var sy=(col+row)*ISO.TH/2*ISO.zoom + ISO.offY;
  return{x:sx,y:sy};
}
function screenToIso(sx,sy){
  var rx=(sx-ISO.offX)/ISO.zoom;
  var ry=(sy-ISO.offY)/ISO.zoom;
  var col=Math.round(rx/ISO.TW*2+ry/ISO.TH*2)/2;
  var row=Math.round(ry/ISO.TH*2-rx/ISO.TW*2)/2;
  return{col:Math.round(col),row:Math.round(row)};
}

// Draw isometric diamond ground tile
function drawTile(ctx,sx,sy,fill,stroke,z){
  z=z||0;var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  ctx.beginPath();
  ctx.moveTo(sx,sy-z);
  ctx.lineTo(sx+tw/2,sy+th/2-z);
  ctx.lineTo(sx,sy+th-z);
  ctx.lineTo(sx-tw/2,sy+th/2-z);
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=0.5;ctx.stroke()}
}

// Draw isometric box (building)
function drawBox(ctx,sx,sy,bh,cTop,cLeft,cRight){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom,bh2=bh*ISO.zoom;
  // Right face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);
  ctx.lineTo(sx+tw/2,sy+th/2-bh2);
  ctx.lineTo(sx+tw/2,sy+th/2);
  ctx.lineTo(sx,sy);
  ctx.closePath();ctx.fillStyle=cRight;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=0.5;ctx.stroke();
  // Left face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);
  ctx.lineTo(sx-tw/2,sy+th/2-bh2);
  ctx.lineTo(sx-tw/2,sy+th/2);
  ctx.lineTo(sx,sy);
  ctx.closePath();ctx.fillStyle=cLeft;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=0.5;ctx.stroke();
  // Top face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);
  ctx.lineTo(sx+tw/2,sy+th/2-bh2);
  ctx.lineTo(sx,sy+th-bh2);
  ctx.lineTo(sx-tw/2,sy+th/2-bh2);
  ctx.closePath();ctx.fillStyle=cTop;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.1)';ctx.lineWidth=0.5;ctx.stroke();
}

// Draw emoji centered on tile top
function drawEmoji(ctx,sx,sy,em,sz,bh){
  bh=bh||0;
  ctx.font=(sz*ISO.zoom)+'px serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(em,sx,sy-bh*ISO.zoom+ISO.TH*ISO.zoom*.1);
}

// Draw small label below tile
function drawLabel(ctx,sx,sy,text){
  ctx.font=(9*ISO.zoom)+'px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=2;
  ctx.strokeText(text,sx,sy+ISO.TH*ISO.zoom*.5);
  ctx.fillText(text,sx,sy+ISO.TH*ISO.zoom*.5);
}

// Building appearance definitions
var BAPP={
  deco:   {h:18, cT:'#81C784', cL:'#388E3C', cR:'#4CAF50'},
  bldg:   {h:52, cT:'#FFCC80', cL:'#BF6B00', cR:'#E07B00'},
  farm:   {h:8,  cT:'#8B6914', cL:'#5A3D08', cR:'#7A520F'},
  factory:{h:60, cT:'#B0BEC5', cL:'#455A64', cR:'#607D8B'},
  animal: {h:28, cT:'#FFCC80', cL:'#A05020', cR:'#C06030'},
  road:   {h:0,  cT:'#90A4AE', cL:'#546E7A', cR:'#607D8B'},

// Grass tile colors - checkerboard variation
function grassColor(col,row){
  var v=(col+row)%2;
  return v===0?'#52B788':'#43A573';
}
function grassStroke(col,row){
  return'rgba(0,0,0,.06)';
}

// Locked area overlay
function drawLocked(ctx,sx,sy){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(sx+tw/2,sy+th/2);
  ctx.lineTo(sx,sy+th);
  ctx.lineTo(sx-tw/2,sy+th/2);
  ctx.closePath();
  ctx.fillStyle='rgba(30,20,10,.55)';ctx.fill();
  // lock icon
  if(ISO.zoom>0.6){
    ctx.font=(11*ISO.zoom)+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,220,100,.7)';
    ctx.fillText('🔒',sx,sy+th/2);
  }
}

// Ready indicator dot
function drawDot(ctx,sx,sy){
  ctx.beginPath();
  ctx.arc(sx+ISO.TW*ISO.zoom*.25,sy+2,5*ISO.zoom,0,Math.PI*2);
  ctx.fillStyle='#FF6B35';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
}

// Main render
function renderISO(){
  var cv=ISO.canvas,ctx=ISO.ctx;
  if(!cv||!ctx||!S.p)return;
  var W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);

  // Sky/background gradient
  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#87CEEB');grad.addColorStop(1,'#c8e6c9');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  var p=S.p,vis=Math.min(MSZ,p.landSize||20);
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;

  // Collect items to draw, sorted by draw order (back to front)
  var items=[];
  var now=Date.now();
  for(var row=0;row<vis+4;row++){
    for(var col=0;col<vis+4;col++){
      var sc=isoToScreen(col,row);
      // Skip if off screen
      if(sc.x+tw<0||sc.x-tw>W||sc.y+th*4<0||sc.y>H+th*4)continue;
      var idx=row*MSZ+col;
      var bId=col<vis&&row<vis?p.town[idx]:null;
      var bd=bId?IT[bId]:null;
      var isLocked=col>=vis||row>=vis;
      items.push({col:col,row:row,sc:sc,idx:idx,bId:bId,bd:bd,isLocked:isLocked,sort:col+row});
    }
  }
  items.sort(function(a,b){return a.sort-b.sort||(a.row-b.row)||(a.col-b.col)});

  // Draw all tiles
  items.forEach(function(item){
    var col=item.col,row=item.row,sc=item.sc,bd=item.bd;
    var sx=sc.x,sy=sc.y;

    // Ground tile
    if(item.isLocked){
      drawTile(ctx,sx,sy,'#2D3A2A','rgba(0,0,0,.2)');
    } else {
      // Grass with path near town center
      var gc=grassColor(col,row);
      drawTile(ctx,sx,sy,gc,grassStroke(col,row));
      // Small grass detail
      if((col*7+row*3)%5===0&&!bd&&ISO.zoom>0.8){
        ctx.font=(8*ISO.zoom)+'px serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.globalAlpha=0.5;
        ctx.fillText(['🌿','·','·'][( col+row)%3],sx,sy+th*.7);
        ctx.globalAlpha=1;
      }
    }

    if(item.isLocked){
      drawLocked(ctx,sx,sy);return;
    }

    // Building / item
    if(!bd)return;
    var app=BAPP[bd.cat]||BAPP.bldg;

    // Farm: flat ground + crop emoji
    if(bd.cat==='farm'){
      // Soil top
      drawTile(ctx,sx,sy,'#8B6914','rgba(0,0,0,.1)');
      var f=p.farms[item.idx]||{};
      var cr=f.crop?CR[f.crop]:null;
      if(f.done&&cr){
        drawEmoji(ctx,sx,sy,cr.e,22,4);
      } else if(f.crop&&f.endTime){
        var pct=Math.min(1,(1-(f.endTime-now)/(cr.time*1000)));
        drawEmoji(ctx,sx,sy,pct>0.5?'🌱':'🌱',16,2);
      }
      // Ready dot
      if(f.done){drawDot(ctx,sx,sy)}
      return;
    }

    // Box-style building
    drawBox(ctx,sx,sy+th,app.h,app.cT,app.cL,app.cR);

    // Emoji on top of box
    if(ISO.zoom>0.5){
      var em=bd.e||'🏠';
      // Some buildings have special appearance
      drawEmoji(ctx,sx,sy+th,em.split('')[0]||em,bd.cat==='bldg'?20:bd.cat==='factory'?18:16,app.h+4);
    }

    // Label
    if(ISO.zoom>0.7){
      drawLabel(ctx,sx,sy+th,bd.n);
    }

    // Ready dot
    var dot=false;
    if(bd.cat==='animal'&&p.animalSlots[item.idx]&&p.animalSlots[item.idx].ready)dot=true;
    if(bd.cat==='factory'){var fac=p.factories[item.idx];if(fac&&fac.queue&&fac.queue.some(function(j){return j.done}))dot=true}
    if((bd.coin||bd.exp)&&p.collect[item.idx]&&p.collect[item.idx].lastD!==today())dot=true;
    if(dot)drawDot(ctx,sx,sy+th-app.h*ISO.zoom);

    // Decorations get smaller elements
    if(bd.cat==='deco'){
      // Just tile + tiny box + emoji, already handled
    }
  });

  // Edit mode grid overlay
  if(S.edit){
    items.forEach(function(item){
      if(item.isLocked)return;
      var sc=item.sc,sx=sc.x,sy=item.sc.y;
      var tw2=ISO.TW*ISO.zoom,th2=ISO.TH*ISO.zoom;
      if(!item.bd){
        ctx.beginPath();
        ctx.moveTo(sx,sy);ctx.lineTo(sx+tw2/2,sy+th2/2);
        ctx.lineTo(sx,sy+th2);ctx.lineTo(sx-tw2/2,sy+th2/2);
        ctx.closePath();
        var isPlace=S.placing&&!item.bd;
        ctx.strokeStyle=isPlace?'rgba(76,175,80,.8)':'rgba(255,255,255,.2)';
        ctx.lineWidth=isPlace?2:0.5;ctx.stroke();
        if(isPlace){ctx.fillStyle='rgba(76,175,80,.15)';ctx.fill()}
      }
    });
  }
}

// Setup ISO canvas events
function setupISO(){
  var cv=ISO.canvas;if(!cv)return;

  // Center the map initially
  var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);
  var cw=cv.width,ch=cv.height;
  ISO.offX=cw/2;
  ISO.offY=ch*.2;
  ISO.zoom=Math.min(1.4,cw/(vis*ISO.TW*.8));

  cv.addEventListener('mousedown',isoDown);
  cv.addEventListener('mousemove',isoMove);
  cv.addEventListener('mouseup',isoUp);
  cv.addEventListener('wheel',isoWheel,{passive:false});
  cv.addEventListener('touchstart',isoTStart,{passive:false});
  cv.addEventListener('touchmove',isoTMove,{passive:false});
  cv.addEventListener('touchend',isoTEnd);
  cv.addEventListener('click',isoClick);
}

var _moved=false;
function isoDown(e){ISO.dragging=true;ISO.dragX=e.clientX;ISO.dragY=e.clientY;ISO.dragOX=ISO.offX;ISO.dragOY=ISO.offY;_moved=false}
function isoMove(e){if(!ISO.dragging)return;var dx=e.clientX-ISO.dragX,dy=e.clientY-ISO.dragY;if(Math.abs(dx)+Math.abs(dy)>3)_moved=true;ISO.offX=ISO.dragOX+dx;ISO.offY=ISO.dragOY+dy;renderISO()}
function isoUp(){ISO.dragging=false}
function isoWheel(e){e.preventDefault();var delta=e.deltaY>0?0.9:1.1;ISO.zoom=Math.min(3,Math.max(0.25,ISO.zoom*delta));renderISO()}

function isoTStart(e){
  if(e.touches.length===2){ISO.pinchDist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);return}
  ISO.dragging=true;ISO.dragX=e.touches[0].clientX;ISO.dragY=e.touches[0].clientY;ISO.dragOX=ISO.offX;ISO.dragOY=ISO.offY;_moved=false;
}
function isoTMove(e){
  e.preventDefault();
  if(e.touches.length===2){var d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);if(ISO.pinchDist>0){ISO.zoom=Math.min(3,Math.max(0.25,ISO.zoom*d/ISO.pinchDist));renderISO()}ISO.pinchDist=d;return}
  if(!ISO.dragging)return;
  var dx=e.touches[0].clientX-ISO.dragX,dy=e.touches[0].clientY-ISO.dragY;
  if(Math.abs(dx)+Math.abs(dy)>3)_moved=true;
  ISO.offX=ISO.dragOX+dx;ISO.offY=ISO.dragOY+dy;renderISO();
}
function isoTEnd(e){
  ISO.pinchDist=0;
  if(!_moved&&e.changedTouches.length>0){
    var t=e.changedTouches[0];
    isoHandleClick(t.clientX,t.clientY);
  }
  ISO.dragging=false;
}
function isoClick(e){if(!_moved)isoHandleClick(e.clientX,e.clientY)}

function isoHandleClick(cx,cy){
  var cv=ISO.canvas;if(!cv)return;
  var rect=cv.getBoundingClientRect();
  var sx=(cx-rect.left)*(cv.width/rect.width);
  var sy=(cy-rect.top)*(cv.height/rect.height);
  // Convert to iso coords - need to account for tile height
  var rx=(sx-ISO.offX)/ISO.zoom;
  var ry=(sy-ISO.offY)/ISO.zoom - ISO.TH/2;
  var col=Math.round((rx/(ISO.TW/2)+ry/(ISO.TH/2))/2);
  var row=Math.round((ry/(ISO.TH/2)-rx/(ISO.TW/2))/2);
  var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);
  if(col<0||row<0||col>=vis||row>=vis)return;
  var idx=row*MSZ+col;
  var bId=S.p.town[idx],bd=bId?IT[bId]:null;
  cClick(idx,bId,bd);
}

// Zoom controls
function isoZoom(d){ISO.zoom=Math.min(3,Math.max(0.25,ISO.zoom*d));renderISO()}
function isoCtr(){
  var cv=ISO.canvas;if(!cv)return;
  var visN=Math.min(MSZ,(S.p&&S.p.landSize)||20);
  // Show full map: at TW=64, TH=32 the map is visN*64 wide in iso space
  // iso screen width = visN * TW * zoom, we want this = cv.width * 0.85
  ISO.zoom = cv.width * 0.85 / (visN * ISO.TW);
  ISO.zoom = Math.max(0.35, Math.min(1.4, ISO.zoom));
  ISO.offX = cv.width/2;
  // Vertical: map top is at y=0, bottom at y=visN*TH*zoom
  // Center vertically
  var mapH = visN * ISO.TH * ISO.zoom;
  ISO.offY = (cv.height - mapH) * 0.3;
  renderISO();
}

// ---- Coordinate math ----
function i2s(col,row){
  return{
    x:(col-row)*ISO.TW/2*ISO.zoom+ISO.offX,
    y:(col+row)*ISO.TH/2*ISO.zoom+ISO.offY
  };
}
function s2i(sx,sy){
  var rx=(sx-ISO.offX)/ISO.zoom, ry=(sy-ISO.offY)/ISO.zoom-ISO.TH/2;
  var col=(rx/(ISO.TW/2)+ry/(ISO.TH/2))/2;
  var row=(ry/(ISO.TH/2)-rx/(ISO.TW/2))/2;
  return{col:Math.round(col),row:Math.round(row)};
}

// ---- Seeded random for stable decoration ----
function srand(x,y){var s=(x*2654435761^y*2246822519)>>>0;return(s&0xFFFF)/65535}

// ---- Drawing primitives ----
function dTile(ctx,sx,sy,fill){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  ctx.beginPath();
  ctx.moveTo(sx,sy);ctx.lineTo(sx+tw/2,sy+th/2);
  ctx.lineTo(sx,sy+th);ctx.lineTo(sx-tw/2,sy+th/2);
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
}

function dBox(ctx,sx,sy,bh,cT,cL,cR,outlineAlpha){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom,bh2=bh*ISO.zoom;
  var oa=outlineAlpha!==undefined?outlineAlpha:0.18;
  // Right face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);ctx.lineTo(sx+tw/2,sy+th/2-bh2);
  ctx.lineTo(sx+tw/2,sy+th/2);ctx.lineTo(sx,sy);
  ctx.closePath();ctx.fillStyle=cR;ctx.fill();
  if(oa>0){ctx.strokeStyle='rgba(0,0,0,'+oa+')';ctx.lineWidth=0.8;ctx.stroke()}
  // Left face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);ctx.lineTo(sx-tw/2,sy+th/2-bh2);
  ctx.lineTo(sx-tw/2,sy+th/2);ctx.lineTo(sx,sy);
  ctx.closePath();ctx.fillStyle=cL;ctx.fill();
  if(oa>0){ctx.strokeStyle='rgba(0,0,0,'+oa+')';ctx.lineWidth=0.8;ctx.stroke()}
  // Top face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);ctx.lineTo(sx+tw/2,sy+th/2-bh2);
  ctx.lineTo(sx,sy+th-bh2);ctx.lineTo(sx-tw/2,sy+th/2-bh2);
  ctx.closePath();ctx.fillStyle=cT;ctx.fill();
  if(oa>0){ctx.strokeStyle='rgba(0,0,0,'+oa+')';ctx.lineWidth=0.8;ctx.stroke()}
}

// Multi-tile building definitions
// anchor = top-left corner, size = [cols, rows]
var MULTITILE = {
  WH:    {w:3, h:3},  // Warehouse 3x3
  MILL:  {w:2, h:2},  // Factory 2x2
  BAKE:  {w:2, h:2},
  DAIRY: {w:2, h:2},
  TEXTILE:{w:2,h:2},
  CA:    {w:2, h:2},  // Castle 2x2
  JUICE:  {w:2, h:2},
  CHOCO:  {w:2, h:2},
  CANDLE: {w:2, h:2}
};

// Get anchor cell for a multi-tile building at any cell it occupies
function getAnchor(idx, bId) {
  var mt = MULTITILE[bId];
  if (!mt) return idx;
  // Already the anchor if town[idx] === bId and it's the top-left
  var col = idx % MSZ, row = Math.floor(idx / MSZ);
  // Find top-left by checking what the anchor stores
  var p = S.p;
  if (p.anchors && p.anchors[idx + '_' + bId]) return p.anchors[idx + '_' + bId];
  return idx;
}

// Place multi-tile building: mark all cells
function placeMulti(anchorIdx, bId) {
  var mt = MULTITILE[bId];
  var p = S.p;
  if (!p.anchors) p.anchors = {};
  var aCol = anchorIdx % MSZ, aRow = Math.floor(anchorIdx / MSZ);
  var w = mt ? mt.w : 1, h = mt ? mt.h : 1;
  for (var r = 0; r < h; r++) {
    for (var c = 0; c < w; c++) {
      var cellIdx = (aRow + r) * MSZ + (aCol + c);
      if (r === 0 && c === 0) {
        p.town[cellIdx] = bId; // anchor stores the building id
      } else {
        p.town[cellIdx] = bId + '_PART_' + anchorIdx; // other cells store reference to anchor
      }
    }
  }
}

// Remove multi-tile building
function removeMulti(anchorIdx, bId) {
  var mt = MULTITILE[bId];
  if (!mt) { S.p.town[anchorIdx] = null; return; }
  var aCol = anchorIdx % MSZ, aRow = Math.floor(anchorIdx / MSZ);
  for (var r = 0; r < mt.h; r++) {
    for (var c = 0; c < mt.w; c++) {
      S.p.town[(aRow + r) * MSZ + (aCol + c)] = null;
    }
  }
}

// Check if multi-tile placement fits
function canPlaceMulti(anchorIdx, bId) {
  var mt = MULTITILE[bId];
  if (!mt) return !S.p.town[anchorIdx];
  var vis = Math.min(MSZ, S.p.landSize || 20);
  var aCol = anchorIdx % MSZ, aRow = Math.floor(anchorIdx / MSZ);
  if (aCol + mt.w > vis || aRow + mt.h > vis) return false;
  for (var r = 0; r < mt.h; r++)
    for (var c = 0; c < mt.w; c++)
      if (S.p.town[(aRow + r) * MSZ + (aCol + c)]) return false;
  return true;
}

// ---- Draw a proper isometric building with roof ----
function drawIsoBuilding(ctx, sx, sy, bId, bd, z) {
  var TW = ISO.TW * z, TH = ISO.TH * z;
  var mt = MULTITILE[bId];
  var mw = mt ? mt.w : 1, mh = mt ? mt.h : 1;
  // Scale tile footprint for multi-tile
  var ftW = TW * mw, ftH = TH * mh;

  var cfg = ISO_BLDG[bId] || ISO_BLDG['DEFAULT'];
  var wallH = cfg.wallH * z;

  // Shadow ellipse under building
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.beginPath();
  ctx.ellipse(sx, sy + TH * mh * 0.5, ftW * 0.55, ftH * 0.35, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.restore();

  // Base ground tile (soil/foundation)
  if (cfg.foundation) {
    var fc = cfg.foundation;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + ftW/2, sy + ftH/2);
    ctx.lineTo(sx, sy + ftH);
    ctx.lineTo(sx - ftW/2, sy + ftH/2);
    ctx.closePath();
    ctx.fillStyle = fc; ctx.fill();
  }

  // Wall base Y (bottom of building)
  var baseY = sy + TH * mh;

  // RIGHT wall
  ctx.beginPath();
  ctx.moveTo(sx + ftW/2, baseY - TH * mh / 2 - wallH);
  ctx.lineTo(sx + ftW/2, baseY - TH * mh / 2);
  ctx.lineTo(sx, baseY);
  ctx.lineTo(sx, baseY - wallH);
  ctx.closePath();
  ctx.fillStyle = cfg.wallR; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; ctx.stroke();

  // LEFT wall
  ctx.beginPath();
  ctx.moveTo(sx - ftW/2, baseY - TH * mh / 2 - wallH);
  ctx.lineTo(sx - ftW/2, baseY - TH * mh / 2);
  ctx.lineTo(sx, baseY);
  ctx.lineTo(sx, baseY - wallH);
  ctx.closePath();
  ctx.fillStyle = cfg.wallL; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; ctx.stroke();

  // TOP face (roof base / flat top)
  ctx.beginPath();
  ctx.moveTo(sx, baseY - wallH);
  ctx.lineTo(sx + ftW/2, baseY - TH * mh / 2 - wallH);
  ctx.lineTo(sx, baseY - TH * mh - wallH);
  ctx.lineTo(sx - ftW/2, baseY - TH * mh / 2 - wallH);
  ctx.closePath();
  ctx.fillStyle = cfg.roofFlat; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 0.8; ctx.stroke();

  // Peaked roof (A-frame)
  if (cfg.roofPeak && z > 0.3) {
    var peakH = cfg.roofPeakH * z;
    var topY = baseY - TH * mh - wallH;
    // Right slope
    ctx.beginPath();
    ctx.moveTo(sx, topY - peakH);
    ctx.lineTo(sx + ftW/2, topY + TH * mh / 2 - peakH * 0.3);
    ctx.lineTo(sx, topY + TH * mh);
    ctx.closePath();
    ctx.fillStyle = cfg.roofR; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.stroke();
    // Left slope
    ctx.beginPath();
    ctx.moveTo(sx, topY - peakH);
    ctx.lineTo(sx - ftW/2, topY + TH * mh / 2 - peakH * 0.3);
    ctx.lineTo(sx, topY + TH * mh);
    ctx.closePath();
    ctx.fillStyle = cfg.roofL; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.stroke();
  }

  // Windows on right wall
  if (cfg.windows && z > 0.4) {
    var numW = Math.max(1, mw * 2 - 1);
    var winW = Math.max(4, 7 * z), winH = winW * 0.8;
    var wallMidY = baseY - wallH * 0.55;
    for (var wi = 0; wi < numW; wi++) {
      var wx = sx + (wi + 0.5) * TW / numW / 2 - TW / 4;
      var wy = wallMidY + (wi % 2) * winH * 0.3;
      ctx.fillStyle = 'rgba(180,230,255,0.8)';
      ctx.fillRect(wx - winW/2, wy - winH/2, winW, winH);
      ctx.strokeStyle = 'rgba(100,150,200,0.6)'; ctx.lineWidth = 0.7; ctx.stroke();
    }
  }

  // Door on right wall
  if (cfg.door && z > 0.35) {
    var dW = Math.max(5, 9 * z), dH = dW * 1.5;
    ctx.fillStyle = cfg.doorC || 'rgba(80,40,10,0.9)';
    ctx.fillRect(sx + TW * 0.08, baseY - dH, dW, dH);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.5; ctx.stroke();
  }

  // Chimney for factories
  if (cfg.chimney && z > 0.3) {
    var numC = mw;
    for (var ci = 0; ci < numC; ci++) {
      var cx2 = sx + (ci + 0.5) * TW / numC / 2;
      var chH = cfg.chimneyH * z;
      var chW = Math.max(4, 8 * z);
      // Chimney box
      var chBaseY = baseY - TH * mh - wallH;
      ctx.beginPath();
      ctx.moveTo(cx2, chBaseY - chH);
      ctx.lineTo(cx2 + chW/2, chBaseY - chH + TH * 0.3);
      ctx.lineTo(cx2 + chW/2, chBaseY + TH * 0.3);
      ctx.lineTo(cx2, chBaseY);
      ctx.closePath();
      ctx.fillStyle = '#546E7A'; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx2, chBaseY - chH);
      ctx.lineTo(cx2 - chW/2, chBaseY - chH + TH * 0.3);
      ctx.lineTo(cx2 - chW/2, chBaseY + TH * 0.3);
      ctx.lineTo(cx2, chBaseY);
      ctx.closePath();
      ctx.fillStyle = '#37474F'; ctx.fill();
      // Smoke
      if (z > 0.5) {
        ctx.save(); ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 600 + ci) * 0.1;
        for (var si = 0; si < 3; si++) {
          var sr = (5 + si * 3) * z;
          ctx.beginPath();
          ctx.arc(cx2 + si * 3 * z, chBaseY - chH - (10 + si * 12) * z, sr, 0, Math.PI * 2);
          ctx.fillStyle = '#CFD8DC'; ctx.fill();
        }
        ctx.restore();
      }
    }
  }

  // Emoji + Name label
  if (z > 0.3 && bd) {
    var topLabelY = baseY - TH * mh - wallH - (cfg.roofPeak ? cfg.roofPeakH * z : 0) - 6 * z;
    var esz = Math.max(12, 18 * z * mw);
    ctx.font = esz + 'px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(bd.e ? bd.e.charAt(0) : '?', sx, topLabelY);
  }
  if (z > 0.45 && bd) {
    var nsz = Math.max(8, 9 * z);
    ctx.font = 'bold ' + nsz + 'px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 2.5;
    var nlY = baseY + 2 * z;
    ctx.strokeText(bd.n, sx, nlY);
    ctx.fillStyle = '#fff'; ctx.fillText(bd.n, sx, nlY);
  }
}

// ---- Decoration renderer (trees, flowers, rocks) ----
function drawDeco(ctx,sx,sy,bId,bd,z){
  var TW=ISO.TW*z, TH=ISO.TH*z;
  var baseY=sy+TH;

  if(bId==='T'||bId==='T2'){
    var sc=bId==='T2'?1.2:0.75;
    // Trunk - thin brown box
    var tH=20*z*sc, tW=6*z*sc;
    // Shadow
    ctx.save();ctx.globalAlpha=0.15;
    ctx.beginPath();ctx.ellipse(sx,baseY,TW*.35,TH*.2,0,0,Math.PI*2);
    ctx.fillStyle='#000';ctx.fill();ctx.restore();
    // Trunk right
    ctx.beginPath();
    ctx.moveTo(sx+tW/2,baseY-tH);ctx.lineTo(sx+tW/2,baseY);
    ctx.lineTo(sx,baseY);ctx.lineTo(sx,baseY-tH);
    ctx.closePath();ctx.fillStyle='#8D6E63';ctx.fill();
    // Trunk left
    ctx.beginPath();
    ctx.moveTo(sx-tW/2,baseY-tH);ctx.lineTo(sx-tW/2,baseY);
    ctx.lineTo(sx,baseY);ctx.lineTo(sx,baseY-tH);
    ctx.closePath();ctx.fillStyle='#6D4C41';ctx.fill();
    // Trunk top
    ctx.beginPath();
    ctx.moveTo(sx,baseY-tH);ctx.lineTo(sx+tW/2,baseY-tH+TH*.15);
    ctx.lineTo(sx,baseY-tH+TH*.3);ctx.lineTo(sx-tW/2,baseY-tH+TH*.15);
    ctx.closePath();ctx.fillStyle='#795548';ctx.fill();
    // Foliage - 3 layered circles
    var fy=baseY-tH-8*z*sc;
    var fr=TW*.38*sc;
    [[0,'rgba(56,142,60,0.95)'],[-4*z*sc,'rgba(76,175,80,0.9)'],[-9*z*sc,'rgba(129,199,132,0.85)']].forEach(function(layer){
      ctx.beginPath();ctx.arc(sx,fy+layer[0],fr*(1+layer[0]*0.01),0,Math.PI*2);
      ctx.fillStyle=layer[1];ctx.fill();
    });
    // Highlight
    ctx.save();ctx.globalAlpha=0.25;
    ctx.beginPath();ctx.arc(sx-fr*.25,fy-fr*.3,fr*.4,0,Math.PI*2);
    ctx.fillStyle='#C8E6C9';ctx.fill();ctx.restore();
    return;
  }

  if(bId==='G'){
    // Bush - round green mound
    var br=TW*.3;
    ctx.save();ctx.globalAlpha=0.12;
    ctx.beginPath();ctx.ellipse(sx,baseY,br,br*.4,0,0,Math.PI*2);
    ctx.fillStyle='#000';ctx.fill();ctx.restore();
    ctx.beginPath();ctx.arc(sx,baseY-br*.4,br,0,Math.PI*2);
    ctx.fillStyle='#388E3C';ctx.fill();
    ctx.beginPath();ctx.arc(sx,baseY-br*.55,br*.75,0,Math.PI*2);
    ctx.fillStyle='#4CAF50';ctx.fill();
    ctx.save();ctx.globalAlpha=0.3;
    ctx.beginPath();ctx.arc(sx-br*.2,baseY-br*.8,br*.3,0,Math.PI*2);
    ctx.fillStyle='#A5D6A7';ctx.fill();ctx.restore();
    return;
  }

  if(bId==='FL'){
    // Flower patch - flat with flowers
    ctx.beginPath();
    ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);
    ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);
    ctx.closePath();ctx.fillStyle='#A5D6A7';ctx.fill();
    if(z>0.4){
      var flowers=['🌸','🌼','🌺'];
      for(var fi=0;fi<3;fi++){
        ctx.font=(10*z)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(flowers[fi%3],sx+(fi-1)*TW*.2,sy+TH*.5+(fi%2-.5)*TH*.2);
      }
    }
    return;
  }

  if(bId==='R'){
    // Rock - grey irregular box
    var rh=12*z;
    ctx.beginPath();
    ctx.moveTo(sx,sy+TH-rh);ctx.lineTo(sx+TW*.35,sy+TH*.6-rh);
    ctx.lineTo(sx+TW*.35,sy+TH*.6);ctx.lineTo(sx,sy+TH);ctx.closePath();
    ctx.fillStyle='#9E9E9E';ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx,sy+TH-rh);ctx.lineTo(sx-TW*.35,sy+TH*.6-rh);
    ctx.lineTo(sx-TW*.35,sy+TH*.6);ctx.lineTo(sx,sy+TH);ctx.closePath();
    ctx.fillStyle='#616161';ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx,sy+TH-rh);ctx.lineTo(sx+TW*.35,sy+TH*.6-rh);
    ctx.lineTo(sx,sy+TH*.2-rh);ctx.lineTo(sx-TW*.35,sy+TH*.6-rh);ctx.closePath();
    ctx.fillStyle='#BDBDBD';ctx.fill();
    return;
  }

  if(bId==='SU'){
    // Sunflower - stem + circle
    ctx.strokeStyle='#558B2F';ctx.lineWidth=2.5*z;
    ctx.beginPath();ctx.moveTo(sx,baseY);ctx.lineTo(sx,baseY-22*z);ctx.stroke();
    ctx.beginPath();ctx.arc(sx,baseY-26*z,8*z,0,Math.PI*2);
    ctx.fillStyle='#FDD835';ctx.fill();
    ctx.beginPath();ctx.arc(sx,baseY-26*z,4*z,0,Math.PI*2);
    ctx.fillStyle='#5D4037';ctx.fill();
    return;
  }

  if(bId==='LA'){
    // Lantern on pole
    ctx.strokeStyle='#5D4037';ctx.lineWidth=2*z;
    ctx.beginPath();ctx.moveTo(sx,baseY);ctx.lineTo(sx,baseY-28*z);ctx.stroke();
    // Lantern box
    var lh=12*z,lw=8*z;
    ctx.fillStyle='#FF8F00';
    ctx.fillRect(sx-lw/2,baseY-28*z-lh,lw,lh);
    ctx.fillStyle='rgba(255,235,59,0.6)';
    ctx.fillRect(sx-lw/2+1,baseY-28*z-lh+1,lw-2,lh-2);
    return;
  }

  if(bId==='FO'){
    // Fountain - round basin
    var fR=TW*.3;
    ctx.beginPath();ctx.ellipse(sx,baseY-4*z,fR,fR*.5,0,0,Math.PI*2);
    ctx.fillStyle='#0288D1';ctx.fill();
    ctx.strokeStyle='#B3E5FC';ctx.lineWidth=2*z;ctx.stroke();
    // Water spray
    if(z>0.5){
      ctx.fillStyle='rgba(100,200,255,0.7)';
      for(var wi=0;wi<5;wi++){
        var a2=wi/5*Math.PI*2;
        ctx.beginPath();ctx.arc(sx+Math.cos(a2)*fR*.4,baseY-12*z+Math.sin(a2)*4*z,2*z,0,Math.PI*2);ctx.fill();
      }
    }
    return;
  }

  if(bId==='MU'){
    // Mushroom - stem + cap
    ctx.fillStyle='#FFCCBC';
    ctx.fillRect(sx-4*z,baseY-14*z,8*z,14*z);
    ctx.beginPath();ctx.arc(sx,baseY-16*z,TW*.25,Math.PI,0);
    ctx.fillStyle='#E53935';ctx.fill();
    ctx.beginPath();ctx.arc(sx,baseY-16*z,TW*.25,Math.PI,0);
    // White spots
    if(z>0.4){
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.beginPath();ctx.arc(sx-3*z,baseY-18*z,2.5*z,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+4*z,baseY-16*z,2*z,0,Math.PI*2);ctx.fill();
    }
    return;
  }

  // Default deco: emoji on flat tile
  ctx.beginPath();
  ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);
  ctx.closePath();ctx.fillStyle='rgba(76,175,80,.15)';ctx.fill();
  if(z>0.3&&bd&&bd.e){
    ctx.font=(14*z)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(bd.e,sx,sy+TH*.55);
  }
}

// ---- Ground tile rendering ----
function drawGround(ctx,sx,sy,col,row){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  var r=srand(col,row);
  var r2=srand(col+37,row+13);
  var r3=srand(col*13,row*7);
  var hr2=new Date().getHours();
  var isNight2=hr2>=21||hr2<5;
  var nightMul=isNight2?0.55:1;
  var g=Math.floor((150+r*40)*nightMul);
  var rv=Math.floor(50*nightMul), bv=Math.floor(70*nightMul);
  var base='rgb('+rv+','+g+','+bv+')';
  if(r<0.06){base='rgb('+(Math.floor((140+r3*20)*nightMul))+','+(Math.floor((100+r3*15)*nightMul))+','+(Math.floor((60+r3*10)*nightMul))+')'}
  dTile(ctx,sx,sy,base);
  // NO stroke - completely seamless
  // Tiny flowers/grass on some tiles
  if(ISO.zoom>0.75){
    if(r>0.45&&r<0.52){
      ctx.save();ctx.globalAlpha=0.6;
      ctx.font=(7*ISO.zoom)+'px serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(r2>0.5?'🌸':'🌼',sx+(r3-.5)*tw*.25,sy+th*.6);
      ctx.restore();
    } else if(r>0.62&&r<0.72){
      ctx.save();ctx.globalAlpha=0.4;
      ctx.font=(5*ISO.zoom)+'px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='rgba(20,100,30,0.8)';
      ctx.fillText('|',sx+(r2-.5)*tw*.3,sy+th*.55);
      ctx.restore();
    }
  }
}

// ---- Draw a realistic tree (border decoration) ----
function drawTree(ctx,sx,sy,scale){
  scale=(scale||1)*ISO.zoom;
  var tw=ISO.TW*ISO.zoom;
  // Trunk - isometric box
  var tH=16*scale;var tW=8*scale;
  // Shadow
  ctx.beginPath();
  ctx.ellipse(sx,sy+ISO.TH*ISO.zoom*.6,tW*2.5,tW,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.fill();
  // Trunk box
  dBox(ctx,sx,sy+ISO.TH*ISO.zoom*.5,tH,'#8B6914','#5C3D0A','#7A5010');
  // Foliage layers - 3 stacked circles for depth
  var fy=sy+ISO.TH*ISO.zoom*.5-tH*1.1*ISO.zoom;
  var leafSz=tw*.45;
  [['rgba(34,139,34,0.9)',0],['rgba(50,180,50,0.85)',-5*scale],['rgba(100,200,60,0.8)',-10*scale]].forEach(function(l){
    ctx.beginPath();
    ctx.ellipse(sx,fy+l[1],leafSz,leafSz*0.65,0,0,Math.PI*2);
    ctx.fillStyle=l[0];ctx.fill();
  });
  // Highlight
  ctx.beginPath();
  ctx.ellipse(sx-leafSz*.2,fy-10*scale,leafSz*.3,leafSz*.2,-.3,0,Math.PI*2);
  ctx.fillStyle='rgba(180,255,120,0.3)';ctx.fill();
}

// ---- Draw locked border zone ----
function drawLockedZone(ctx,sx,sy,col,row){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  var r=srand(col*3+7,row*5+11);
  var r2=srand(col+100,row+200);
  var r3=srand(col*17+3,row*11+5);
  // Forest floor - dark green, NO outline
  var fg=Math.floor(15+r3*15);
  dTile(ctx,sx,sy,'rgb('+fg+','+(fg+20)+','+fg+')');
  // ALWAYS draw a tree or bush - fill completely
  if(r>0.15){
    // Tree - scale varies for natural look
    var scale=0.7+r2*0.8;
    drawTree(ctx,sx,sy,scale);
  } else {
    // Low bush
    var by=sy+th*.35;var bsz=tw*(0.22+r3*.12);
    // Bush shadow
    ctx.beginPath();ctx.ellipse(sx,by+4*ISO.zoom,bsz*.9,bsz*.35,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.fill();
    // Bush layers
    ['rgba(15,55,15,0.9)','rgba(20,75,20,0.85)','rgba(30,95,25,0.8)'].forEach(function(c,i){
      ctx.beginPath();ctx.ellipse(sx+(i-1)*bsz*.2,by-i*3*ISO.zoom,bsz*(1-i*.15),bsz*.6*(1-i*.1),0,0,Math.PI*2);
      ctx.fillStyle=c;ctx.fill();
    });
    // Highlight
    ctx.beginPath();ctx.ellipse(sx-bsz*.2,by-6*ISO.zoom,bsz*.25,bsz*.15,-.3,0,Math.PI*2);
    ctx.fillStyle='rgba(100,200,60,0.2)';ctx.fill();
  }
}

// ---- Draw detailed building ----
function drawBuilding(ctx,sx,sy,bId,bd){
  var app=BLD[bId]||{h:32,cT:'#FFCC80',cL:'#5D4037',cR:'#795548'};
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  var bh=app.h;

  if(app.tree){drawTree(ctx,sx,sy+th,app.scale||1);return}

  // Shadow
  ctx.save();
  ctx.globalAlpha=0.2;
  ctx.beginPath();
  ctx.ellipse(sx,sy+th,tw*.55,th*.35,0,0,Math.PI*2);
  ctx.fillStyle='#000';ctx.fill();
  ctx.restore();

  // Main box
  dBox(ctx,sx,sy+th,bh,app.cT,app.cL,app.cR);

  // Details based on type
  var cat=bd?bd.cat:'bldg';
  var z=ISO.zoom;

  if(cat==='bldg'&&z>0.35){
    // Windows - multiple on right face
    var winBaseY=sy+th-bh*z+bh*z*0.25;
    var winSz=Math.max(3,6*z);
    ctx.fillStyle='rgba(200,235,255,0.7)';
    for(var wi=0;wi<3;wi++){
      ctx.fillRect(sx+tw*.08+wi*winSz*1.8,winBaseY,winSz,winSz*.8);
    }
    // Door
    ctx.fillStyle='rgba(60,30,5,0.85)';
    ctx.fillRect(sx-winSz*.6,sy+th-winSz*2,winSz*1.2,winSz*2);
    // Roof triangle if applicable
    if(app.roof&&z>0.4){
      ctx.beginPath();
      ctx.moveTo(sx-tw/2,sy+th-bh*z);
      ctx.lineTo(sx,sy+th-bh*z-18*z);
      ctx.lineTo(sx+tw/2,sy+th-bh*z);
      ctx.closePath();
      ctx.fillStyle=app.roofC||'#D32F2F';ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=0.8;ctx.stroke();
    }
  }

  if(app.chimney&&z>0.4){
    // Factory chimney
    dBox(ctx,sx+tw*.2,sy+th-bh*z,28,'#607D8B','#263238','#37474F');
    // Smoke puff
    ctx.save();
    ctx.globalAlpha=0.4;
    ctx.beginPath();
    ctx.arc(sx+tw*.2,sy+th-(bh+28)*z-5*z,7*z,0,Math.PI*2);
    ctx.fillStyle='#CFD8DC';ctx.fill();
    ctx.restore();
  }

  if(cat==='farm'&&z>0.4){
    // Fence around farm
    ctx.strokeStyle='rgba(139,90,20,0.7)';ctx.lineWidth=1.5*z;
    ctx.beginPath();
    ctx.moveTo(sx-tw/2,sy+th/2);ctx.lineTo(sx,sy+th);ctx.lineTo(sx+tw/2,sy+th/2);
    ctx.stroke();
  }

  // Big emoji on building face (front/top)
  if(z>0.3&&bd){
    var em=bd.e||'?';
    var esz=Math.max(14,22*z);
    ctx.font=esz+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillText(em.charAt(0),sx+1*z,sy+th-bh*z*0.5+1*z);
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.fillText(em.charAt(0),sx,sy+th-bh*z*0.5);
  }
  // Name label below building
  if(z>0.5&&bd){
    var lsz=Math.max(8,10*z);
    ctx.font='bold '+lsz+'px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.strokeStyle='rgba(0,0,0,0.75)';ctx.lineWidth=3;
    ctx.strokeText(bd.n,sx,sy+th+3*z);
    ctx.fillStyle='#fff';
    ctx.fillText(bd.n,sx,sy+th+3*z);
  }
}

// ---- Ready dot ----
function drawReadyDot(ctx,sx,sy,bh){
  var z=ISO.zoom,tw=ISO.TW*z,th=ISO.TH*z;
  var dx=sx+tw*.32,dy=sy+th-bh*z-16*z;
  ctx.beginPath();ctx.arc(dx,dy,6*z,0,Math.PI*2);
  ctx.fillStyle='#FF6B35';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5*z;ctx.stroke();
}

// ---- Farm state overlay ----
function drawFarmState(ctx,sx,sy,f){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  if(!f||!f.crop)return;
  var cr=CR[f.crop];if(!cr)return;
  var now=Date.now();
  // Soil rows
  if(ISO.zoom>0.4){
    ctx.strokeStyle='rgba(90,50,10,0.4)';ctx.lineWidth=1.5*ISO.zoom;
    for(var r=0;r<3;r++){
      var ry=sy+th*.35+r*th*.2;
      ctx.beginPath();ctx.moveTo(sx-tw*.35,ry);ctx.lineTo(sx+tw*.35,ry);ctx.stroke();
    }
  }
  if(f.done){
    // Ready to harvest - show crop emoji big
    ctx.font=(22*ISO.zoom)+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(cr.e,sx,sy+th*.5);
    drawReadyDot(ctx,sx,sy,4);
  } else if(f.endTime&&f.endTime>Date.now()){
    var pct=(1-(f.endTime-Date.now())/(cr.time*1000));
    ctx.font=(pct>0.5?16:12)*ISO.zoom+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pct>0.7?cr.e:'🌱',sx,sy+th*.45);
    // Progress bar
    var bw=tw*.7,bx=sx-bw/2,by=sy+th*.8;
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(bx,by,bw,4*ISO.zoom);
    ctx.fillStyle='#76FF03';ctx.fillRect(bx,by,bw*pct,4*ISO.zoom);
  }
}

// ---- Main render ----
function renderISO(){
  var cv=ISO.canvas,ctx=ISO.ctx;
  if(!cv||!ctx||!S.p)return;
  var W=cv.width,H=cv.height,p=S.p;
  var vis=Math.min(MSZ,p.landSize||20);
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  var now=Date.now();

  // Sky - varies by time of day
  var hr=new Date().getHours();
  var isDawn=hr>=5&&hr<7, isDay=hr>=7&&hr<18, isDusk=hr>=18&&hr<21, isNight=hr>=21||hr<5;
  var skyGrad=ctx.createLinearGradient(0,0,0,H*.65);
  if(isNight){skyGrad.addColorStop(0,'#0D1B2A');skyGrad.addColorStop(1,'#1A2E4A')}
  else if(isDawn||isDusk){skyGrad.addColorStop(0,'#FF6B35');skyGrad.addColorStop(1,'#FFD54F')}
  else{skyGrad.addColorStop(0,'#6EC6F0');skyGrad.addColorStop(1,'#A5D6A7')}
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,H);
  // Clouds (day only)
  if(isDay||isDawn){
    ctx.save();ctx.globalAlpha=0.6;ctx.fillStyle='#fff';
    [[W*.2,H*.08,30],[W*.6,H*.05,22],[W*.85,H*.1,18]].forEach(function(c){
      ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(c[0]+c[2]*.6,c[1]+3,c[2]*.7,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(c[0]-c[2]*.5,c[1]+2,c[2]*.65,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
  }
  // Stars (night)
  if(isNight){
    ctx.save();ctx.fillStyle='#fff';
    for(var si=0;si<30;si++){
      var sx2=(Math.sin(si*137.5*Math.PI/180)+1)/2*W;
      var sy2=(Math.cos(si*97.3*Math.PI/180)+1)/2*H*.5;
      ctx.globalAlpha=0.5+Math.sin(Date.now()/600+si)*0.3;
      ctx.beginPath();ctx.arc(sx2,sy2,1.5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  // Build render list: border + interior, sorted back-to-front
  var cells=[];
  var border=4; // how many locked cols/rows beyond vis
  var total=vis+border;
  for(var row=-1;row<total;row++){
    for(var col=-1;col<total;col++){
      var sc=i2s(col,row);
      if(sc.x+tw*2<0||sc.x-tw*2>W||sc.y+th*8<0||sc.y-th*3>H)continue;
      cells.push({col:col,row:row,sc:sc,sort:col+row});
    }
  }
  cells.sort(function(a,b){return a.sort-b.sort||(a.row-b.row)||(a.col-b.col)});

  cells.forEach(function(cell){
    var col=cell.col,row=cell.row,sc=cell.sc;
    var sx=sc.x,sy=sc.y;
    var isLocked=col<0||row<0||col>=vis||row>=vis;
    var idx=(row>=0&&row<MSZ&&col>=0&&col<MSZ)?row*MSZ+col:-1;
    var bId=idx>=0?p.town[idx]:null;
    var bd=bId?IT[bId]:null;

    if(isLocked){
      drawLockedZone(ctx,sx,sy,col,row);
      return;
    }

    // Ground
    drawGround(ctx,sx,sy,col,row);

    if(!bd)return;
    // Skip _PART_ cells (part of multi-tile, drawn by anchor)
    if(bId && bId.indexOf('_PART_') > 0) return;

    // Farm: draw soil + crop state
    if(bd.cat==='farm'){
      // Soil tile on top
      dTile(ctx,sx,sy,'#6B4226');
      dTile(ctx,sx,sy,'rgba(0,0,0,.08)');
      dBox(ctx,sx,sy+th,4,'#8B6914','#5A3D08','#7A520F');
      var f=p.farms[idx]||{};
      drawFarmState(ctx,sx,sy+th,f);
      return;
    }

    // Route to appropriate renderer
    if(bd.cat==='deco'){
      drawDeco(ctx,sx,sy,bId,bd,ISO.zoom);
    } else {
      drawIsoBuilding(ctx,sx,sy,bId,bd,ISO.zoom);
    }

    // Ready dot
    var dot=false;
    var app2=BLD[bId]||{h:32};
    if(bd.cat==='animal'&&p.animalSlots[idx]&&p.animalSlots[idx].ready)dot=true;
    if(bd.cat==='factory'){var fac=p.factories[idx];if(fac&&fac.queue&&fac.queue.some(function(j){return j.done}))dot=true}
    if((bd.coin||bd.exp)&&p.collect[idx]&&p.collect[idx].lastD!==today())dot=true;
    if(dot)drawReadyDot(ctx,sx,sy,app2.h||32);

    // Move highlight
    if(S.edit&&ISO.movingBldg&&ISO.movingBldg.idx===idx){
      dTile(ctx,sx,sy+th,'rgba(255,200,0,.35)');
    }
  });

  // Treasure chest on map
  if(treasurePos){
    var tsc=i2s(treasurePos.c,treasurePos.r);
    drawTreasure(ctx,tsc.x,tsc.y);
  }
  // Villagers - little characters walking around (only during day)
  if(!S.edit&&isDay){
    var vills=[{id:0,e:'🧒'},{id:1,e:'👦'},{id:2,e:'👧'}];
    ctx.save();
    vills.forEach(function(v){
      var t=Date.now()/3000+v.id*2.1;
      var vc=Math.floor(vis*.3+Math.sin(t)*vis*.25);
      var vr=Math.floor(vis*.5+Math.cos(t*0.7)*vis*.2);
      vc=Math.max(0,Math.min(vis-1,vc));
      vr=Math.max(0,Math.min(vis-1,vr));
      if(p.town[vr*MSZ+vc])return; // don't draw on buildings
      var vsc=i2s(vc,vr);
      ctx.font=(14*ISO.zoom)+'px serif';
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(v.e,vsc.x,vsc.y+ISO.TH*ISO.zoom);
    });
    ctx.restore();
  }
  // Edit mode: show placement grid
  if(S.edit){
    cells.forEach(function(cell){
      var col=cell.col,row=cell.row,sc=cell.sc;
      if(col<0||row<0||col>=vis||row>=vis)return;
      var idx=row*MSZ+col;
      var bId2=p.town[idx];
      if(!bId2){
        var sx=sc.x,sy=sc.y,tw2=tw,th2=th;
        ctx.beginPath();
        ctx.moveTo(sx,sy+th2);ctx.lineTo(sx+tw2/2,sy+th2/2);
        ctx.lineTo(sx,sy);ctx.lineTo(sx-tw2/2,sy+th2/2);
        ctx.closePath();
        var isHov=S.placing?true:false;
        ctx.strokeStyle=isHov?'rgba(76,175,80,.6)':'rgba(255,255,255,.15)';
        ctx.lineWidth=isHov?1.5:.5;ctx.stroke();
        if(ISO.movingBldg){
      var mvb=IT[ISO.movingBldg.bId];
      var mvLbl=document.createElement('div');mvLbl.style.cssText='font-size:.7rem;font-weight:700;color:#1976D2;white-space:nowrap;flex-shrink:0';mvLbl.textContent='移動: '+(mvb?mvb.e+' '+mvb.n:'建築');ib.appendChild(mvLbl);
      var mvCancel=document.createElement('button');mvCancel.style.cssText='padding:3px 9px;border-radius:50px;border:1.5px solid #EF4444;background:#fff;color:#EF4444;font-size:.7rem;cursor:pointer;white-space:nowrap;flex-shrink:0';mvCancel.textContent='取消移動';mvCancel.addEventListener('click',function(){ISO.movingBldg=null;rTown()});ib.appendChild(mvCancel);
    } else if(S.placing){ctx.fillStyle='rgba(76,175,80,.12)';ctx.fill()}
      }
    });
  }
}

// ---- Event handling ----
function setupISO(){
  var cv=ISO.canvas;if(!cv)return;
  var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);
  ISO.offX=cv.width/2;
  ISO.offY=cv.height*.15;
  ISO.zoom=Math.min(0.9,cv.width/(vis*ISO.TW*.9));
  cv.addEventListener('mousedown',_iDown);
  cv.addEventListener('mousemove',_iMove);
  cv.addEventListener('mouseup',_iUp);
  cv.addEventListener('wheel',_iWheel,{passive:false});
  cv.addEventListener('touchstart',_iTStart,{passive:false});
  cv.addEventListener('touchmove',_iTMove,{passive:false});
  cv.addEventListener('touchend',_iTEnd);
}
function _iDown(e){ISO.dragging=true;ISO.dragSX=e.clientX;ISO.dragSY=e.clientY;ISO.dragOX=ISO.offX;ISO.dragOY=ISO.offY;ISO.moved=false}
function _iMove(e){
  if(!ISO.dragging)return;
  var dx=e.clientX-ISO.dragSX,dy=e.clientY-ISO.dragSY;
  if(Math.abs(dx)+Math.abs(dy)>4)ISO.moved=true;
  ISO.offX=ISO.dragOX+dx;ISO.offY=ISO.dragOY+dy;renderISO();
}
function _iUp(e){ISO.dragging=false;if(!ISO.moved)_iClick(e.clientX,e.clientY)}
function _iWheel(e){e.preventDefault();ISO.zoom=Math.min(3,Math.max(0.2,ISO.zoom*(e.deltaY>0?.88:1.14)));renderISO()}
function _iTStart(e){
  if(e.touches.length===2){ISO.pinchDist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);return}
  ISO.dragging=true;ISO.dragSX=e.touches[0].clientX;ISO.dragSY=e.touches[0].clientY;ISO.dragOX=ISO.offX;ISO.dragOY=ISO.offY;ISO.moved=false;
}
function _iTMove(e){
  e.preventDefault();
  if(e.touches.length===2){var d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);if(ISO.pinchDist>0){ISO.zoom=Math.min(3,Math.max(0.2,ISO.zoom*d/ISO.pinchDist));renderISO()}ISO.pinchDist=d;return}
  if(!ISO.dragging)return;
  var dx=e.touches[0].clientX-ISO.dragSX,dy=e.touches[0].clientY-ISO.dragSY;
  if(Math.abs(dx)+Math.abs(dy)>4)ISO.moved=true;
  ISO.offX=ISO.dragOX+dx;ISO.offY=ISO.dragOY+dy;renderISO();
}
function _iTEnd(e){ISO.pinchDist=0;ISO.dragging=false;if(!ISO.moved&&e.changedTouches.length>0){var t=e.changedTouches[0];_iClick(t.clientX,t.clientY)}}
function _iClick(cx,cy){
  var cv=ISO.canvas;if(!cv)return;
  var rect=cv.getBoundingClientRect();
  var sx=(cx-rect.left)*(cv.width/rect.width);
  var sy=(cy-rect.top)*(cv.height/rect.height);
  var gi=s2i(sx,sy);
  var col=gi.col,row=gi.row;
  var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);

      if(S.p.animalSlots[from.idx]){S.p.animalSlots[idx]=S.p.animalSlots[from.idx];delete S.p.animalSlots[from.idx]}

  var name=(document.getElementById('ln')?.value||'').trim().toLowerCase();
  var pin=(document.getElementById('lp')?.value||'').trim();
  var err=document.getElementById('lerr');
  if(!name){err.textContent='請輸入帳號';return}
  if(!/^\d{4}$/.test(pin)){err.textContent='PIN需為4位數字';return}
  err.textContent='登入中…';
  // Ensure Supabase is initialized
  if(!supabase)initSupabase();
  var p=null;
  // 1. Try Supabase first (cloud - works on any device)
  if(supabase){
    try{
      err.textContent='☁️ 從雲端載入中…';
      var res=await supabase.from('mt_saves').select('*').eq('username',name).single();
      if(res.error){
        if(res.error.code==='PGRST116'||res.error.message===''){
          // Not found in cloud - will try localStorage
        } else {
          err.textContent='雲端錯誤：'+res.error.message;
          console.error('Supabase error:',JSON.stringify(res.error));
        }
      } else if(res.data&&res.data.save_code){
        var cloud=importSaveCode(res.data.save_code);
        if(cloud&&cloud.pin===hPin(pin)){p=cloud;p.name=name;}
        else if(cloud){err.textContent='PIN錯誤';return;}
        else{err.textContent='存檔損壞，請重試';}
      }
    }catch(e){
      console.error('Supabase login error:',e.message,e);
      err.textContent='連線失敗（'+e.message+'）';
    }
  }
  // 2. Fallback: localStorage
  if(!p){
    var pd=await loadPD(name);
    if(pd&&pd.pin===hPin(pin)){
      p=pd;
    }
    else if(pd){err.textContent='PIN錯誤';return}
  }
  if(!p){
    err.textContent='找不到帳號！請先在這台裝置登入過，或重新註冊';
    return;
  }
  // Set defaults
  ['farms','factories','animalSlots','bldgInv','collect','mgDone'].forEach(function(k){if(!p[k])p[k]={}});
  if(!p.av)p.av='🧒';
  if(!p.displayName)p.displayName=p.n||name;
  if(!p.name)p.name=name;
  while(p.town&&p.town.length<MSZ*MSZ)p.town.push(null);
  if(!p.town){p.town=Array(MSZ*MSZ).fill(null);}
  if(!p.orders||p.orders.length<1)genOrders();
  // Daily login bonus
  if(p.lastDay!==today()){p.coins=(p.coins||0)+20;p.totalCE=(p.totalCE||0)+20;p.lastDay=today();p.loginDays=(p.loginDays||0)+1;}
  // Daily quest
  if(!p.dailyQuest||p.dailyQuest.day!==today()){
    var quests=[
      {type:'quiz',desc:'完成一次答題',reward:50,done:false},
      {type:'order',desc:'完成2個訂單',target:2,progress:0,reward:80,done:false},
      {type:'harvest',desc:'收穫3次農作物',target:3,progress:0,reward:60,done:false},
      {type:'coins',desc:'賺取100金幣',target:100,progress:0,reward:40,done:false},
    ];
    p.dailyQuest={day:today(),quest:quests[Math.floor(Math.random()*quests.length)],done:false};
  }
  // Ensure WH on map
  if(!p.town.some(function(t){return t==='WH';})){
    for(var wi=0;wi<p.town.length;wi++){if(!p.town[wi]){p.town[wi]='WH';break;}}
  }
  // Save to local accounts list
  var accs=getAccs();
  if(!accs.find(function(a){return a.name===name;})){
    accs.push({name:name,displayName:p.displayName,pinHash:hPin(pin)});saveAccs();
  }
  S.p=p;
  await saveP();
  // Push to Supabase so other devices can find this account
  if(supabase){
    err.textContent='☁️ 同步到雲端…';
    var saveOk=await supabaseSave();
    if(saveOk){console.log('✅ Cloud sync OK');}
    else{console.warn('⚠️ Cloud sync failed');}
  }
  startTick();go('home');
}

function cClick(idx,bId,bd){
  var p=S.p;
  // Placing mode
  if(S.placing){
    if(!bId){placeB(idx)}
    else toast('此格已有建築！');
    return;
  }
  if(!bId){return}
  // Multi-tile PART cell - redirect to anchor
  if(bId && bId.indexOf('_PART_')>0){
    var anchorIdx=parseInt(bId.split('_PART_')[1]);
    var realId=bId.split('_PART_')[0];
    cClick(anchorIdx,realId,IT[realId]);
    return;
  }
  if(!bd)return;
  // Edit mode: tap building -> show move/remove popup immediately
  if(S.edit){
    showRem(idx,bd);return;
  }
  // Normal mode interactions
  if(bd.cat==='farm')return fClick(idx,bd);
  if(bd.cat==='animal')return aClick(idx,bd);
  if(bd.cat==='factory'){showFacPopup(idx,bId);return}
  // Collect daily produce
  if((bd.coin||bd.exp)&&p.collect[idx]&&p.collect[idx].lastD!==today()){
    if(bd.coin){p.coins+=bd.coin;p.totalCE=(p.totalCE||0)+bd.coin}
    if(bd.exp){p.exp+=bd.exp;checkLv()}
    p.collect[idx].lastD=today();
    saveP();renderISO();return
  }
  // Otherwise show info popup
  showBuildingPopup(idx,bd);
}

function placeB(idx){
  var p=S.p,b=IT[S.placing];
  if(!S.placing)return;
  // Must have at least 1 in inventory
  if(!(p.bldgInv[S.placing]>=1)){toast('庫存不足');S.placing=null;rTown();return;}
  // WH can only be placed once
  if(S.placing==='WH'&&p.town.some(function(t){return t==='WH'||(t&&t.indexOf('WH_PART_')===0)})){
    toast('倉庫已存在！每個小鎮只能有一個');S.placing=null;rTown();return;
  }
  // Multi-tile check
  if(MULTITILE[S.placing]){
    if(!canPlaceMulti(idx,S.placing)){toast('空間不夠！請選其他位置');return;}
    placeMulti(idx,S.placing);
  } else {
    p.town[idx]=S.placing;
  }
  p.bldgInv[S.placing]--;
  if(p.bldgInv[S.placing]<=0)delete p.bldgInv[S.placing];
  if(b&&(b.coin||b.exp))p.collect[idx]={lastD:''};
  if(b&&b.cat==='farm')p.farms[idx]={crop:b.crop,done:false,endTime:0};
  if(b&&b.cat==='animal')p.animalSlots[idx]={animal:b.animal,fed:false,ready:false};
  if(b&&b.cat==='factory')p.factories[idx]={queue:[]};
  // Only keep placing mode if still have inventory
  if(p.bldgInv[S.placing]>=1){
    // still have more, keep placing
  } else {
    S.placing=null; // always stop after placing
  }
  checkAchievements('build',1);
  saveP();rTown();
}

    if(!warehouseFull()){addG(cr.gives,cr.amt);checkDailyQuest('harvest',1);}

  if(f.endTime&&f.endTime>Date.now()){
    toast('還需 '+fmt(Math.max(0,Math.round((f.endTime-Date.now())/1000))));

  // Empty - show crop picker

function doFinalMark(){
  // Mark all answers
  var gm=getGRS(S.grade).m*bst()*timeMul()*q99Mul();
  var cor=0;
  S.qAns.forEach(function(item){
    var ok=item.val?checkAns(item.q,item.val):false;
    item.ok=ok;
    if(ok){
      cor++;item.c=Math.round(5*gm);
      S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;
      if(S.streak>=10)item.c+=25;else if(S.streak>=5)item.c+=10;else if(S.streak>=3)item.c+=5;
    } else {
      item.c=0;S.streak=0;
    }
    S.earned+=item.c;
  });
  if(cor===0)S.earned=0;
  // Rainbow bonus
  if(S._rainbowEnd&&Date.now()<S._rainbowEnd)S.earned=Math.round(S.earned*1.5);
  // Boss mode bonus
  var cor2=S.qAns.filter(function(x){return x.ok}).length;
  if(S._bossMode){
    localStorage.setItem('mt_boss_'+S.p.name,Date.now());
    if(cor2===S.qAns.length&&S.qAns.length>0){
      S.earned+=S._bossReward||200;
      toast('👹 魔王被打敗！！🎉 獎勵 🪙'+(S._bossReward||200));
    } else {
      toast('👹 魔王勝利…全對才能打敗他！');
    }
    S._bossMode=false;S._bossReward=0;
  }
  S.p.coins+=S.earned;
  S.p.totalC=(S.p.totalC||0)+cor;S.p.totalA=(S.p.totalA||0)+S.qAns.length;
  S.p.totalCE=(S.p.totalCE||0)+S.earned;
  if(S.maxStreak>(S.p.bestStreak||0))S.p.bestStreak=S.maxStreak;
  S.p.exp+=cor*5;checkLv();
  checkAchievements('quiz',1);
  checkAchievements('streak',S.maxStreak);
  updateWeekChallenge('quiz_correct',cor);
  updateWeekChallenge('earn',S.earned);
  if(cor===S.qAns.length&&cor>0)checkAchievements('perfect',1);
  checkDailyQuest('quiz',1);
  saveP();
  rCorrectionPage();
}

async function recognizeLocal2(cv,isClock){
  // Use a specific canvas for OCR
  if(!OCR_READY){await initOCR();if(!OCR_READY)return null}
  try{
    var processed=preprocessCanvas(cv);
    await OCR_WORKER.setParameters({tessedit_char_whitelist:'0123456789/:',tessedit_pageseg_mode:'7'});
    var result=await OCR_WORKER.recognize(processed);
    var txt=(result.data.text||'').trim().replace(/[^0-9:]/g,'');
    var nums=txt.match(/\d+/g);
    if(!nums||!nums.length)return null;
    return nums.sort(function(a,b){return b.length-a.length})[0];
  }catch(e){return null}
}

// Encode player data to compact share code
function exportSaveCode(){
  var p=S.p;
  var lite={
    n:p.displayName,name:p.name,lv:p.level,level:p.level,exp:p.exp,coins:p.coins,
    town:p.town,inv:p.inv,bldgInv:p.bldgInv,farms:p.farms,factories:p.factories,
    animalSlots:p.animalSlots,orders:p.orders,collect:p.collect,mgDone:p.mgDone,
    achievements:p.achievements,totalCE:p.totalCE,totalA:p.totalA,
    totalC:p.totalC,loginDays:p.loginDays,settings:p.settings,
    warehouseCap:p.warehouseCap,_everHad:p._everHad,av:p.av,pin:p.pin,
    landSize:p.landSize,totalOrders:p.totalOrders,bestStreak:p.bestStreak
  };
  try{return btoa(unescape(encodeURIComponent(JSON.stringify(lite))))}
  catch(e){return null}
}

function importSaveCode(code){
  try{
    var data=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!data.n)throw new Error('invalid');
    // Ensure name field exists (sync code stores displayName as .n)
    if(!data.name)data.name=data.n.toLowerCase().replace(/[^a-z0-9]/g,'_');
    if(!data.displayName)data.displayName=data.n;
    if(!data.av)data.av='🧒';
    if(!data.town)data.town=Array(MSZ*MSZ).fill(null);
    if(!data.inv)data.inv={};
    if(!data.bldgInv)data.bldgInv={};
    if(!data.farms)data.farms={};
    if(!data.factories)data.factories={};
    if(!data.animalSlots)data.animalSlots={};
    if(!data.orders)data.orders=[];
    if(!data.collect)data.collect={};
    if(!data.mgDone)data.mgDone={};
    if(!data.settings)data.settings={hw:false};
    return data;
  }catch(e){return null}
}

// Cloud sync via free JSONBin (no API key needed for public bins)
// Each account gets a unique BIN_ID stored in localStorage
async function cloudSave(){
  var code=exportSaveCode();
  if(!code)return null;
  // Store in localStorage with timestamp
  var syncData={code:code,name:S.p.displayName,t:Date.now()};
  localStorage.setItem('mt_sync_'+S.p.displayName, JSON.stringify(syncData));
  return code;
}

async function cloudLoad(name){
  var raw=localStorage.getItem('mt_sync_'+name);
  if(!raw)return null;
  try{var d=JSON.parse(raw);return d.code;}catch(e){return null}
}

function getWeekKey(){var d=new Date();return d.getFullYear()+'W'+Math.floor((d.getDate()-1)/7)+'M'+d.getMonth();}
function getWeekChallenges(){
  var wk=getWeekKey();
  if(!S.p.weekChallenges||S.p.weekChallenges.week!==wk){
    var templates=[
      {desc:'本週答對 50 題',type:'quiz_correct',target:50,reward:200},
      {desc:'本週完成 10 個訂單',type:'orders',target:10,reward:300},
            {desc:'本週升一級',type:'level',target:S.p.level+1,reward:250},
      {desc:'本週賺 500 金幣',type:'earn',target:500,reward:180},
    ];
    // Pick 3 random challenges
    var picks=templates.sort(function(){return Math.random()-.5}).slice(0,3);
    S.p.weekChallenges={week:wk,challenges:picks.map(function(c){return Object.assign({},c,{progress:0,done:false})})};
    saveP();
  }
  return S.p.weekChallenges.challenges;
}

function updateWeekChallenge(type,amount){
  if(!S.p.weekChallenges)getWeekChallenges();
  var challenges=S.p.weekChallenges.challenges;
  challenges.forEach(function(c){
    if(c.done)return;
    if(c.type===type){
      c.progress=(c.progress||0)+amount;
      if(c.type==='level'&&S.p.level>=c.target)c.progress=c.target;
      if(c.progress>=c.target&&!c.done){
        c.done=true;S.p.coins+=c.reward;S.p.totalCE=(S.p.totalCE||0)+c.reward;
        var ov=document.createElement('div');
        ov.style.cssText='position:fixed;top:15%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#2E7D32,#1565C0);color:#fff;border-radius:18px;padding:16px 24px;z-index:9999;text-align:center;animation:pop .4s ease;box-shadow:0 6px 24px rgba(0,0,0,.4);min-width:220px';
        ov.innerHTML='<div style="font-size:1.5rem">📅</div><div style="font-size:.95rem;font-weight:900;margin:4px 0">週挑戰完成！</div><div style="font-size:.78rem;opacity:.9">'+c.desc+'</div><div style="font-size:1.3rem;font-weight:900;color:#FFD700;margin-top:6px">+🪙'+c.reward+'</div>';
        document.body.appendChild(ov);setTimeout(function(){ov.remove()},3500);
        saveP();
      }
    }
  });
  saveP();
}

function checkCitizenRequest(){
  var now=Date.now();

  lastCitizenCheck=now;
