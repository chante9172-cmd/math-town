async function initOCR(){
  if(OCR_READY||OCR_LOADING)return;
  OCR_LOADING=true;
  var st=document.getElementById('OCR');
  if(st){st.textContent='📥 載入手寫辨識中…';st.style.display='block'}
  try{
    // Tesseract.js v5 correct API
    OCR_WORKER=await Tesseract.createWorker('eng');
    await OCR_WORKER.setParameters({
      tessedit_char_whitelist:'0123456789/:',
      tessedit_pageseg_mode:Tesseract.PSM.SINGLE_LINE||7,
    });
    OCR_READY=true;OCR_LOADING=false;
    if(st)st.textContent='✅ 辨識模型已載入！';
    setTimeout(function(){if(st)st.textContent=''},2000);
  }catch(e){
    console.error('OCR init failed:',e);
    OCR_LOADING=false;
    if(st)st.textContent='⚠️ 辨識模型載入失敗，請用鍵盤輸入';
  }
}

// Preprocess canvas: white bg, thicken strokes, scale up for OCR
function preprocessCanvas(cv){
  var scale=3;
  var tmp=document.createElement('canvas');
  tmp.width=cv.width*scale;tmp.height=cv.height*scale;
  var ctx=tmp.getContext('2d');
  // White background
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,tmp.width,tmp.height);
  // Scale up and draw
  ctx.scale(scale,scale);ctx.drawImage(cv,0,0);ctx.setTransform(1,0,0,1,0,0);
  // Invert check: if bg is dark, invert
  var imgd=ctx.getImageData(0,0,tmp.width,tmp.height);var d=imgd.data;
  // Binarize: make strokes black, everything else white
  for(var i=0;i<d.length;i+=4){
    var bright=(d[i]+d[i+1]+d[i+2])/3;
    var alpha=d[i+3];
    if(alpha<30||bright>180){d[i]=d[i+1]=d[i+2]=255;d[i+3]=255}
    else{d[i]=d[i+1]=d[i+2]=0;d[i+3]=255}
  }
  ctx.putImageData(imgd,0,0);
  // Dilate (thicken strokes) for better recognition
  var ctx2=document.createElement('canvas');ctx2.width=tmp.width;ctx2.height=tmp.height;
  var c2=ctx2.getContext('2d');
  c2.fillStyle='#fff';c2.fillRect(0,0,ctx2.width,ctx2.height);
  c2.filter='blur('+scale+'px)';c2.drawImage(tmp,0,0);c2.filter='none';
  // Re-binarize after blur
  var id2=c2.getImageData(0,0,ctx2.width,ctx2.height);var d2=id2.data;
  for(var j=0;j<d2.length;j+=4){
    var v=(d2[j]+d2[j+1]+d2[j+2])/3;
    if(v<200){d2[j]=d2[j+1]=d2[j+2]=0}else{d2[j]=d2[j+1]=d2[j+2]=255}
    d2[j+3]=255;
  }
  c2.putImageData(id2,0,0);
  return ctx2;
}

async function recognizeLocal(isClock){
  var cv=document.getElementById('CC');if(!cv)return null;
  var st=document.getElementById('OCR');
  if(!OCR_READY){
    if(st)st.textContent='⏳ 載入辨識模型中…';
    await initOCR();
    if(!OCR_READY)return null;
  }
  if(st)st.textContent='🔍 辨識中…';
  try{
    var processed=preprocessCanvas(cv);
    var result=await OCR_WORKER.recognize(processed);
    var txt=(result.data.text||'').trim().replace(/[^0-9:]/g,'');
    console.log('OCR raw:',result.data.text,'cleaned:',txt);
    if(isClock){
      var m=txt.match(/\d{1,2}:\d{2}/);
      return m?m[0]:null;
    } else {
      // Try to get a clean number
      var nums=txt.match(/\d+/g);
      if(!nums||nums.length===0)return null;
      // Return longest number found (most likely the answer)
      return nums.sort(function(a,b){return b.length-a.length})[0];
    }
  }catch(e){
    console.error('OCR error:',e);
    if(st)st.textContent='❌ 辨識失敗，請重寫';return null;
  }
}

function initCv(){

  S.cvCtx=cv.getContext('2d');S.drawing=false;S.strokes=[];
  var ctx=S.cvCtx;ctx.strokeStyle='#1B2631';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';
  function gp(e){var r=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*cv.width/r.width,y:(s.clientY-r.top)*cv.height/r.height}}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();S.drawing=true;var p=gp(e);if(S.tool==='pen'){ctx.globalCompositeOperation='source-over';ctx.lineWidth=4;S.strokes.push({pts:[p]});ctx.beginPath();ctx.moveTo(p.x,p.y)}else{ctx.globalCompositeOperation='destination-out';ctx.lineWidth=22;ctx.beginPath();ctx.moveTo(p.x,p.y)}},{passive:false});
  cv.addEventListener('pointermove',function(e){e.preventDefault();if(!S.drawing)return;var p=gp(e);if(S.tool==='pen'&&S.strokes.length)S.strokes[S.strokes.length-1].pts.push(p);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y)},{passive:false});
  cv.addEventListener('pointerup',function(){S.drawing=false;S.cvCtx.globalCompositeOperation='source-over';S.cvCtx.beginPath()});

var GRR={d1:[1,9],d2:[10,99],d3:[100,999],d4:[1000,9999]};
function r1dp(){return Math.round(rnd(1,99))/10}
function makeQ(mode,grade){
  var gd=getGRS(grade);
  if(gd&&gd.dec){var a=r1dp(),b=r1dp();if(mode==='sub'&&a<b){var t=a;a=b;b=t}if(mode==='mul'){b=rnd(2,9);return{q:a+' × '+b,a:(Math.round(a*b*10)/10).toString()}}var ans=Math.round((mode==='sub'?a-b:a+b)*10)/10;return{q:a+(mode==='sub'?' − ':' + ')+b,a:ans.toString()}}
  if(gd&&gd.frac){var d=[2,3,4,5,6,8][rnd(0,5)];var a2=rnd(1,d-1),b2=rnd(1,d-1);if(mode==='sub'){a2=Math.max(a2,b2)+1;b2=rnd(1,a2-1)}var num=mode==='sub'?a2-b2:a2+b2;var w=Math.floor(num/d),rem=num%d;var aStr=rem===0?w.toString():(w>0?w+'又'+rem+'/'+d:rem+'/'+d);return{q:a2+'/'+d+(mode==='sub'?' − ':' + ')+b2+'/'+d,a:aStr}}
  var r=GRR[grade]||[1,9],a,b;
  if(mode==='add'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);return{q:a+' + '+b,a:(a+b).toString()}}
  if(mode==='sub'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);if(a<b){var t2=a;a=b;b=t2}return{q:a+' − '+b,a:(a-b).toString()}}
  if(mode==='mul'){var pp={d1:[rnd(2,9),rnd(2,9)],d2:[rnd(10,99),rnd(2,9)],d3:[rnd(11,99),rnd(11,99)],d4:[rnd(100,999),rnd(11,99)]};var p2=pp[grade]||pp.d1;return{q:p2[0]+' × '+p2[1],a:(p2[0]*p2[1]).toString()}}
  if(mode==='div'){var d2=rnd(2,9),q2=rnd(Math.max(2,Math.ceil(r[0]/d2)),Math.max(2,Math.floor(r[1]/d2)));return{q:(d2*q2)+' ÷ '+d2,a:q2.toString()}}
  if(mode==='as'){a=rnd(r[0],r[1]);b=rnd(r[0],r[1]);var c=rnd(r[0],r[1]);var v=a+b-c;if(v<0)v=0;return{q:'('+a+'+'+b+')−'+c,a:v.toString()}}
  if(mode==='99'){a=rnd(1,9);b=rnd(1,9);return{q:a+' × '+b,a:(a*b).toString()}}
  if(mode==='ck'){var h=rnd(1,12),mn=[0,5,10,15,20,25,30,35,40,45,50,55][rnd(0,11)];return{q:'',h:h,m:mn,a:h+':'+(mn<10?'0':'')+mn,isClock:true}}
  return{q:'2+2',a:'4'}
}
function makeQs(mode,grade,n){var o=[];for(var i=0;i<n;i++)o.push(makeQ(mode,grade));return o}
function getGRS(id){for(var i=0;i<GRS.length;i++)if(GRS[i].id===id)return GRS[i];return GRS[0]}
function getMD(id){for(var i=0;i<QM.length;i++)if(QM[i].id===id)return QM[i];return null}
function parseTime(s){if(!s)return null;s=s.trim();var m=s.match(/^(\d{1,2})[:.'](\d{2})$/);if(m)return{h:+m[1],min:+m[2]};return null}
function checkAns(q,val){
  if(q.isClock){var p=parseTime(val);return!!(p&&p.h===q.h&&p.min===q.m)}
  val=val.trim().replace(/\s/g,'');var exp=q.a.toString().replace(/\s/g,'');
  if(val===exp)return true;
  var nv=parseFloat(val),ne=parseFloat(exp);if(!isNaN(nv)&&!isNaN(ne)&&Math.abs(nv-ne)<0.001)return true;

var ISO={
  TW:64, TH:32,  // tile width/height
  canvas:null, ctx:null,
  offX:0, offY:0, zoom:1,
  dragging:false, dragX:0, dragY:0, dragOX:0, dragOY:0,
  pinchDist:0,
  dirty:true
};

// Grid position -> screen position (canvas center of tile top)
function isoToScreen(col,row){
  var sx=(col-row)*ISO.TW/2*ISO.zoom + ISO.offX;
  var sy=(col+row)*ISO.TH/2*ISO.zoom + ISO.offY;
  return{x:sx,y:sy};
}
function screenToIso(sx,sy){
  var rx=(sx-ISO.offX)/ISO.zoom;
  var ry=(sy-ISO.offY)/ISO.zoom;
  var col=Math.round(rx/ISO.TW*2+ry/ISO.TH*2)/2;
  var row=Math.round(ry/ISO.TH*2-rx/ISO.TW*2)/2;
  return{col:Math.round(col),row:Math.round(row)};
}

// Draw isometric diamond ground tile
function drawTile(ctx,sx,sy,fill,stroke,z){
  z=z||0;var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  ctx.beginPath();
  ctx.moveTo(sx,sy-z);
  ctx.lineTo(sx+tw/2,sy+th/2-z);
  ctx.lineTo(sx,sy+th-z);
  ctx.lineTo(sx-tw/2,sy+th/2-z);
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=0.5;ctx.stroke()}
}

// Draw isometric box (building)
function drawBox(ctx,sx,sy,bh,cTop,cLeft,cRight){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom,bh2=bh*ISO.zoom;
  // Right face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);
  ctx.lineTo(sx+tw/2,sy+th/2-bh2);
  ctx.lineTo(sx+tw/2,sy+th/2);
  ctx.lineTo(sx,sy);
  ctx.closePath();ctx.fillStyle=cRight;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=0.5;ctx.stroke();
  // Left face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);
  ctx.lineTo(sx-tw/2,sy+th/2-bh2);
  ctx.lineTo(sx-tw/2,sy+th/2);
  ctx.lineTo(sx,sy);
  ctx.closePath();ctx.fillStyle=cLeft;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=0.5;ctx.stroke();
  // Top face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);
  ctx.lineTo(sx+tw/2,sy+th/2-bh2);
  ctx.lineTo(sx,sy+th-bh2);
  ctx.lineTo(sx-tw/2,sy+th/2-bh2);
  ctx.closePath();ctx.fillStyle=cTop;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.1)';ctx.lineWidth=0.5;ctx.stroke();
}

// Draw emoji centered on tile top
function drawEmoji(ctx,sx,sy,em,sz,bh){
  bh=bh||0;
  ctx.font=(sz*ISO.zoom)+'px serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(em,sx,sy-bh*ISO.zoom+ISO.TH*ISO.zoom*.1);
}

// Draw small label below tile
function drawLabel(ctx,sx,sy,text){
  ctx.font=(9*ISO.zoom)+'px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=2;
  ctx.strokeText(text,sx,sy+ISO.TH*ISO.zoom*.5);
  ctx.fillText(text,sx,sy+ISO.TH*ISO.zoom*.5);
}

var BAPP={

  factory:{h:60, cT:'#B0BEC5', cL:'#455A64', cR:'#607D8B'},
  animal: {h:28, cT:'#FFCC80', cL:'#A05020', cR:'#C06030'},

// Grass tile colors - checkerboard variation
function grassColor(col,row){
  var v=(col+row)%2;
  return v===0?'#52B788':'#43A573';
}
function grassStroke(col,row){
  return'rgba(0,0,0,.06)';
}

// Locked area overlay
function drawLocked(ctx,sx,sy){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(sx+tw/2,sy+th/2);
  ctx.lineTo(sx,sy+th);
  ctx.lineTo(sx-tw/2,sy+th/2);
  ctx.closePath();
  ctx.fillStyle='rgba(30,20,10,.55)';ctx.fill();
  // lock icon
  if(ISO.zoom>0.6){
    ctx.font=(11*ISO.zoom)+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,220,100,.7)';

// Ready indicator dot
function drawDot(ctx,sx,sy){
  ctx.beginPath();
  ctx.arc(sx+ISO.TW*ISO.zoom*.25,sy+2,5*ISO.zoom,0,Math.PI*2);
  ctx.fillStyle='#FF6B35';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();

// Main render
function renderISO(){
  var cv=ISO.canvas,ctx=ISO.ctx;
  if(!cv||!ctx||!S.p)return;
  var W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);

  // Sky/background gradient
  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#87CEEB');grad.addColorStop(1,'#c8e6c9');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  var p=S.p,vis=Math.min(MSZ,p.landSize||20);
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;

  // Collect items to draw, sorted by draw order (back to front)
  var items=[];
  var now=Date.now();
  for(var row=0;row<vis+4;row++){
    for(var col=0;col<vis+4;col++){
      var sc=isoToScreen(col,row);
      // Skip if off screen
      if(sc.x+tw<0||sc.x-tw>W||sc.y+th*4<0||sc.y>H+th*4)continue;
      var idx=row*MSZ+col;
      var bId=col<vis&&row<vis?p.town[idx]:null;
      var bd=bId?IT[bId]:null;
      var isLocked=col>=vis||row>=vis;
      items.push({col:col,row:row,sc:sc,idx:idx,bId:bId,bd:bd,isLocked:isLocked,sort:col+row});
    }
  }
  items.sort(function(a,b){return a.sort-b.sort||(a.row-b.row)||(a.col-b.col)});

  // Draw all tiles
  items.forEach(function(item){
    var col=item.col,row=item.row,sc=item.sc,bd=item.bd;
    var sx=sc.x,sy=sc.y;

    // Ground tile
    if(item.isLocked){
      drawTile(ctx,sx,sy,'#2D3A2A','rgba(0,0,0,.2)');
    } else {
      // Grass with path near town center
      var gc=grassColor(col,row);
      drawTile(ctx,sx,sy,gc,grassStroke(col,row));
      // Small grass detail
      if((col*7+row*3)%5===0&&!bd&&ISO.zoom>0.8){
        ctx.font=(8*ISO.zoom)+'px serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.globalAlpha=0.5;
        ctx.fillText(['🌿','·','·'][( col+row)%3],sx,sy+th*.7);
        ctx.globalAlpha=1;
      }
    }

    if(item.isLocked){
      drawLocked(ctx,sx,sy);return;
    }

    // Building / item
    if(!bd)return;
    var app=BAPP[bd.cat]||BAPP.bldg;

    // Farm: flat ground + crop emoji
    if(bd.cat==='farm'){
      // Soil top
      drawTile(ctx,sx,sy,'#8B6914','rgba(0,0,0,.1)');
      var f=p.farms[item.idx]||{};
      var cr=f.crop?CR[f.crop]:null;
      if(f.done&&cr){
        drawEmoji(ctx,sx,sy,cr.e,22,4);
      } else if(f.crop&&f.endTime){
        var pct=Math.min(1,(1-(f.endTime-now)/(cr.time*1000)));
        drawEmoji(ctx,sx,sy,pct>0.5?'🌱':'🌱',16,2);
      }
      // Ready dot
      if(f.done){drawDot(ctx,sx,sy)}
      return;
    }

    // Box-style building
    drawBox(ctx,sx,sy+th,app.h,app.cT,app.cL,app.cR);

    // Emoji on top of box
    if(ISO.zoom>0.5){
      var em=bd.e||'🏠';
      // Some buildings have special appearance
      drawEmoji(ctx,sx,sy+th,em.split('')[0]||em,bd.cat==='bldg'?20:bd.cat==='factory'?18:16,app.h+4);
    }

    // Label
    if(ISO.zoom>0.7){
      drawLabel(ctx,sx,sy+th,bd.n);
    }

    // Ready dot
    var dot=false;
    if(bd.cat==='animal'&&p.animalSlots[item.idx]&&p.animalSlots[item.idx].ready)dot=true;
    if(bd.cat==='factory'){var fac=p.factories[item.idx];if(fac&&fac.queue&&fac.queue.some(function(j){return j.done}))dot=true}
    if((bd.coin||bd.exp)&&p.collect[item.idx]&&p.collect[item.idx].lastD!==today())dot=true;
    if(dot)drawDot(ctx,sx,sy+th-app.h*ISO.zoom);

    // Decorations get smaller elements
    if(bd.cat==='deco'){
      // Just tile + tiny box + emoji, already handled
    }
  });

  // Edit mode grid overlay
  if(S.edit){
    items.forEach(function(item){
      if(item.isLocked)return;
      var sc=item.sc,sx=sc.x,sy=item.sc.y;
      var tw2=ISO.TW*ISO.zoom,th2=ISO.TH*ISO.zoom;
      if(!item.bd){
        ctx.beginPath();
        ctx.moveTo(sx,sy);ctx.lineTo(sx+tw2/2,sy+th2/2);
        ctx.lineTo(sx,sy+th2);ctx.lineTo(sx-tw2/2,sy+th2/2);
        ctx.closePath();
        var isPlace=S.placing&&!item.bd;
        ctx.strokeStyle=isPlace?'rgba(76,175,80,.8)':'rgba(255,255,255,.2)';
        ctx.lineWidth=isPlace?2:0.5;ctx.stroke();
        if(isPlace){ctx.fillStyle='rgba(76,175,80,.15)';ctx.fill()}
      }
    });
  }
}

// Setup ISO canvas events
function setupISO(){
  var cv=ISO.canvas;if(!cv)return;

  // Center the map initially
  var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);
  var cw=cv.width,ch=cv.height;
  ISO.offX=cw/2;
  ISO.offY=ch*.2;
  ISO.zoom=Math.min(1.4,cw/(vis*ISO.TW*.8));

  cv.addEventListener('mousedown',isoDown);
  cv.addEventListener('mousemove',isoMove);
  cv.addEventListener('mouseup',isoUp);
  cv.addEventListener('wheel',isoWheel,{passive:false});
  cv.addEventListener('touchstart',isoTStart,{passive:false});
  cv.addEventListener('touchmove',isoTMove,{passive:false});
  cv.addEventListener('touchend',isoTEnd);
  cv.addEventListener('click',isoClick);
}

var _moved=false;
function isoDown(e){ISO.dragging=true;ISO.dragX=e.clientX;ISO.dragY=e.clientY;ISO.dragOX=ISO.offX;ISO.dragOY=ISO.offY;_moved=false}
function isoMove(e){if(!ISO.dragging)return;var dx=e.clientX-ISO.dragX,dy=e.clientY-ISO.dragY;if(Math.abs(dx)+Math.abs(dy)>3)_moved=true;ISO.offX=ISO.dragOX+dx;ISO.offY=ISO.dragOY+dy;renderISO()}
function isoUp(){ISO.dragging=false}
function isoWheel(e){e.preventDefault();var delta=e.deltaY>0?0.9:1.1;ISO.zoom=Math.min(3,Math.max(0.25,ISO.zoom*delta));renderISO()}

function isoTStart(e){
  if(e.touches.length===2){ISO.pinchDist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);return}
  ISO.dragging=true;ISO.dragX=e.touches[0].clientX;ISO.dragY=e.touches[0].clientY;ISO.dragOX=ISO.offX;ISO.dragOY=ISO.offY;_moved=false;
}
function isoTMove(e){
  e.preventDefault();
  if(e.touches.length===2){var d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);if(ISO.pinchDist>0){ISO.zoom=Math.min(3,Math.max(0.25,ISO.zoom*d/ISO.pinchDist));renderISO()}ISO.pinchDist=d;return}
  if(!ISO.dragging)return;
  var dx=e.touches[0].clientX-ISO.dragX,dy=e.touches[0].clientY-ISO.dragY;
  if(Math.abs(dx)+Math.abs(dy)>3)_moved=true;
  ISO.offX=ISO.dragOX+dx;ISO.offY=ISO.dragOY+dy;renderISO();
}
function isoTEnd(e){
  ISO.pinchDist=0;
  if(!_moved&&e.changedTouches.length>0){
    var t=e.changedTouches[0];
    isoHandleClick(t.clientX,t.clientY);
  }
  ISO.dragging=false;
}
function isoClick(e){if(!_moved)isoHandleClick(e.clientX,e.clientY)}

function isoHandleClick(cx,cy){
  var cv=ISO.canvas;if(!cv)return;
  var rect=cv.getBoundingClientRect();
  var sx=(cx-rect.left)*(cv.width/rect.width);
  var sy=(cy-rect.top)*(cv.height/rect.height);
  // Convert to iso coords - need to account for tile height
  var rx=(sx-ISO.offX)/ISO.zoom;
  var ry=(sy-ISO.offY)/ISO.zoom - ISO.TH/2;
  var col=Math.round((rx/(ISO.TW/2)+ry/(ISO.TH/2))/2);
  var row=Math.round((ry/(ISO.TH/2)-rx/(ISO.TW/2))/2);
  var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);
  if(col<0||row<0||col>=vis||row>=vis)return;
  var idx=row*MSZ+col;
  var bId=S.p.town[idx],bd=bId?IT[bId]:null;
  cClick(idx,bId,bd);
}

// Zoom controls
function isoZoom(d){ISO.zoom=Math.min(3,Math.max(0.25,ISO.zoom*d));renderISO()}
function isoCtr(){
  var cv=ISO.canvas;if(!cv)return;
  var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);
  ISO.offX=cv.width/2;ISO.offY=cv.height*.2;
  ISO.zoom=Math.min(1.4,cv.width/(vis*ISO.TW*.8));
  renderISO();
}

// ============================================================
// ISOMETRIC ENGINE v2 - Township style complete rewrite
// ============================================================
var ISO={
  TW:96, TH:48,
  canvas:null, ctx:null,
  offX:0, offY:0, zoom:1,
  dragging:false, dragSX:0, dragSY:0, dragOX:0, dragOY:0,
  pinchDist:0, moved:false,
  movingBldg:null  // {idx, bId} being moved
};

// ---- Coordinate math ----
function i2s(col,row){
  return{
    x:(col-row)*ISO.TW/2*ISO.zoom+ISO.offX,
    y:(col+row)*ISO.TH/2*ISO.zoom+ISO.offY
  };
}
function s2i(sx,sy){
  var rx=(sx-ISO.offX)/ISO.zoom, ry=(sy-ISO.offY)/ISO.zoom-ISO.TH/2;
  var col=(rx/(ISO.TW/2)+ry/(ISO.TH/2))/2;
  var row=(ry/(ISO.TH/2)-rx/(ISO.TW/2))/2;
  return{col:Math.round(col),row:Math.round(row)};
}

// ---- Seeded random for stable decoration ----
function srand(x,y){var s=(x*2654435761^y*2246822519)>>>0;return(s&0xFFFF)/65535}

// ---- Drawing primitives ----
function dTile(ctx,sx,sy,fill){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  ctx.beginPath();
  ctx.moveTo(sx,sy);ctx.lineTo(sx+tw/2,sy+th/2);
  ctx.lineTo(sx,sy+th);ctx.lineTo(sx-tw/2,sy+th/2);
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
}

function dBox(ctx,sx,sy,bh,cT,cL,cR,outlineAlpha){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom,bh2=bh*ISO.zoom;
  var oa=outlineAlpha!==undefined?outlineAlpha:0.18;
  // Right face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);ctx.lineTo(sx+tw/2,sy+th/2-bh2);
  ctx.lineTo(sx+tw/2,sy+th/2);ctx.lineTo(sx,sy);
  ctx.closePath();ctx.fillStyle=cR;ctx.fill();
  if(oa>0){ctx.strokeStyle='rgba(0,0,0,'+oa+')';ctx.lineWidth=0.8;ctx.stroke()}
  // Left face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);ctx.lineTo(sx-tw/2,sy+th/2-bh2);
  ctx.lineTo(sx-tw/2,sy+th/2);ctx.lineTo(sx,sy);
  ctx.closePath();ctx.fillStyle=cL;ctx.fill();
  if(oa>0){ctx.strokeStyle='rgba(0,0,0,'+oa+')';ctx.lineWidth=0.8;ctx.stroke()}
  // Top face
  ctx.beginPath();
  ctx.moveTo(sx,sy-bh2);ctx.lineTo(sx+tw/2,sy+th/2-bh2);
  ctx.lineTo(sx,sy+th-bh2);ctx.lineTo(sx-tw/2,sy+th/2-bh2);
  ctx.closePath();ctx.fillStyle=cT;ctx.fill();
  if(oa>0){ctx.strokeStyle='rgba(0,0,0,'+oa+')';ctx.lineWidth=0.8;ctx.stroke()}
}

// ---- Ground tile rendering ----
function drawGround(ctx,sx,sy,col,row){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  var r=srand(col,row);
  var r2=srand(col+37,row+13);
  var r3=srand(col*13,row*7);
  // Smooth color variation - no harsh edges
  var g=Math.floor(150+r*40);
  var base='rgb(50,'+g+',70)';
  // Occasional dirt patch - soft
  if(r<0.06){base='rgb('+(140+r3*20)+','+(100+r3*15)+','+(60+r3*10)+')'}
  else if(r<0.12){base='rgb(55,'+(g-10)+',65)'}
  dTile(ctx,sx,sy,base);
  // NO stroke - completely seamless
  // Tiny flowers/grass on some tiles
  if(ISO.zoom>0.75){
    if(r>0.45&&r<0.52){
      ctx.save();ctx.globalAlpha=0.6;
      ctx.font=(7*ISO.zoom)+'px serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(r2>0.5?'🌸':'🌼',sx+(r3-.5)*tw*.25,sy+th*.6);
      ctx.restore();
    } else if(r>0.62&&r<0.72){
      ctx.save();ctx.globalAlpha=0.4;
      ctx.font=(5*ISO.zoom)+'px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='rgba(20,100,30,0.8)';
      ctx.fillText('|',sx+(r2-.5)*tw*.3,sy+th*.55);
      ctx.restore();
    }
  }
}

// ---- Draw a realistic tree (border decoration) ----
function drawTree(ctx,sx,sy,scale){
  scale=(scale||1)*ISO.zoom;
  var tw=ISO.TW*ISO.zoom;
  // Trunk - isometric box
  var tH=16*scale;var tW=8*scale;
  // Shadow
  ctx.beginPath();
  ctx.ellipse(sx,sy+ISO.TH*ISO.zoom*.6,tW*2.5,tW,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.fill();
  // Trunk box
  dBox(ctx,sx,sy+ISO.TH*ISO.zoom*.5,tH,'#8B6914','#5C3D0A','#7A5010');
  // Foliage layers - 3 stacked circles for depth
  var fy=sy+ISO.TH*ISO.zoom*.5-tH*1.1*ISO.zoom;
  var leafSz=tw*.45;
  [['rgba(34,139,34,0.9)',0],['rgba(50,180,50,0.85)',-5*scale],['rgba(100,200,60,0.8)',-10*scale]].forEach(function(l){
    ctx.beginPath();
    ctx.ellipse(sx,fy+l[1],leafSz,leafSz*0.65,0,0,Math.PI*2);
    ctx.fillStyle=l[0];ctx.fill();
  });
  // Highlight
  ctx.beginPath();
  ctx.ellipse(sx-leafSz*.2,fy-10*scale,leafSz*.3,leafSz*.2,-.3,0,Math.PI*2);
  ctx.fillStyle='rgba(180,255,120,0.3)';ctx.fill();
}

// ---- Draw locked border zone ----
function drawLockedZone(ctx,sx,sy,col,row){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  var r=srand(col*3+7,row*5+11);
  var r2=srand(col+100,row+200);
  var r3=srand(col*17+3,row*11+5);
  // Forest floor - dark green, NO outline
  var fg=Math.floor(15+r3*15);
  dTile(ctx,sx,sy,'rgb('+fg+','+(fg+20)+','+fg+')');
  // ALWAYS draw a tree or bush - fill completely
  if(r>0.15){
    // Tree - scale varies for natural look
    var scale=0.45+r2*0.65;
    drawTree(ctx,sx,sy,scale);
  } else {
    // Low bush
    var by=sy+th*.35;var bsz=tw*(0.22+r3*.12);
    // Bush shadow
    ctx.beginPath();ctx.ellipse(sx,by+4*ISO.zoom,bsz*.9,bsz*.35,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.fill();
    // Bush layers
    ['rgba(15,55,15,0.9)','rgba(20,75,20,0.85)','rgba(30,95,25,0.8)'].forEach(function(c,i){
      ctx.beginPath();ctx.ellipse(sx+(i-1)*bsz*.2,by-i*3*ISO.zoom,bsz*(1-i*.15),bsz*.6*(1-i*.1),0,0,Math.PI*2);
      ctx.fillStyle=c;ctx.fill();
    });
    // Highlight
    ctx.beginPath();ctx.ellipse(sx-bsz*.2,by-6*ISO.zoom,bsz*.25,bsz*.15,-.3,0,Math.PI*2);
    ctx.fillStyle='rgba(100,200,60,0.2)';ctx.fill();
  }
}

// ---- Draw detailed building ----
function drawBuilding(ctx,sx,sy,bId,bd){
  var app=BLD[bId]||{h:32,cT:'#FFCC80',cL:'#5D4037',cR:'#795548'};
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  var bh=app.h;

  if(app.tree){drawTree(ctx,sx,sy+th,app.scale||1);return}

  // Shadow
  ctx.save();
  ctx.globalAlpha=0.2;
  ctx.beginPath();
  ctx.ellipse(sx,sy+th,tw*.55,th*.35,0,0,Math.PI*2);
  ctx.fillStyle='#000';ctx.fill();
  ctx.restore();

  // Main box
  dBox(ctx,sx,sy+th,bh,app.cT,app.cL,app.cR);

  // Details based on type
  var cat=bd?bd.cat:'bldg';
  var z=ISO.zoom;

  if(cat==='bldg'&&z>0.5){
    // Windows on right face
    var wr=app.cR;
    var winY=sy+th-bh*z+bh*z*0.3;
    var winX=sx+tw*.25;
    ctx.fillStyle='rgba(200,235,255,0.6)';
    ctx.fillRect(winX-4*z,winY,7*z,5*z);
    ctx.fillRect(winX+8*z,winY,7*z,5*z);
    // Door
    ctx.fillStyle='rgba(80,40,10,0.8)';
    ctx.fillRect(sx-5*z,sy+th-8*z,10*z,8*z);
  }

  if(app.chimney&&z>0.4){
    // Factory chimney
    dBox(ctx,sx+tw*.2,sy+th-bh*z,28,'#607D8B','#263238','#37474F');
    // Smoke puff
    ctx.save();
    ctx.globalAlpha=0.4;
    ctx.beginPath();
    ctx.arc(sx+tw*.2,sy+th-(bh+28)*z-5*z,7*z,0,Math.PI*2);
    ctx.fillStyle='#CFD8DC';ctx.fill();
    ctx.restore();
  }

  if(cat==='farm'&&z>0.4){
    // Fence around farm
    ctx.strokeStyle='rgba(139,90,20,0.7)';ctx.lineWidth=1.5*z;
    ctx.beginPath();
    ctx.moveTo(sx-tw/2,sy+th/2);ctx.lineTo(sx,sy+th);ctx.lineTo(sx+tw/2,sy+th/2);
    ctx.stroke();
  }

  // Emoji label on top
  if(z>0.45&&bd){
    var em=bd.e||'?';
    ctx.font=(14*z)+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(em.charAt(0),sx,sy+th-bh*z-2*z);
  }
  // Name label
  if(z>0.65&&bd){
    var lsz=Math.max(7,9*z);
    ctx.font='bold '+lsz+'px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=2;
    ctx.strokeText(bd.n,sx,sy+th+2*z);
    ctx.fillStyle='#fff';
    ctx.fillText(bd.n,sx,sy+th+2*z);
  }
}

// ---- Ready dot ----

// ---- Farm state overlay ----
function drawFarmState(ctx,sx,sy,f){
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  if(!f||!f.crop)return;
  var cr=CR[f.crop];if(!cr)return;
  var now=Date.now();
  // Soil rows
  if(ISO.zoom>0.4){
    ctx.strokeStyle='rgba(90,50,10,0.4)';ctx.lineWidth=1.5*ISO.zoom;
    for(var r=0;r<3;r++){
      var ry=sy+th*.35+r*th*.2;
      ctx.beginPath();ctx.moveTo(sx-tw*.35,ry);ctx.lineTo(sx+tw*.35,ry);ctx.stroke();
    }
  }
  if(f.done){
    // Ready to harvest - show crop emoji big
    ctx.font=(22*ISO.zoom)+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(cr.e,sx,sy+th*.5);
    drawReadyDot(ctx,sx,sy,4);
  } else if(f.endTime&&f.endTime>Date.now()){
    var pct=(1-(f.endTime-Date.now())/(cr.time*1000));
    ctx.font=(pct>0.5?16:12)*ISO.zoom+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pct>0.7?cr.e:'🌱',sx,sy+th*.45);
    // Progress bar
    var bw=tw*.7,bx=sx-bw/2,by=sy+th*.8;
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(bx,by,bw,4*ISO.zoom);
    ctx.fillStyle='#76FF03';ctx.fillRect(bx,by,bw*pct,4*ISO.zoom);
  }
}

// ---- Main render ----
function renderISO(){
  var cv=ISO.canvas,ctx=ISO.ctx;
  if(!cv||!ctx||!S.p)return;
  var W=cv.width,H=cv.height,p=S.p;
  var vis=Math.min(MSZ,p.landSize||20);
  var tw=ISO.TW*ISO.zoom,th=ISO.TH*ISO.zoom;
  var now=Date.now();

  // Sky
  var grad=ctx.createLinearGradient(0,0,0,H*.6);
  grad.addColorStop(0,'#6EC6F0');grad.addColorStop(1,'#A5D6A7');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // Build render list: border + interior, sorted back-to-front
  var cells=[];
  var border=4; // how many locked cols/rows beyond vis
  var total=vis+border;
  for(var row=-1;row<total;row++){
    for(var col=-1;col<total;col++){
      var sc=i2s(col,row);
      if(sc.x+tw*2<0||sc.x-tw*2>W||sc.y+th*8<0||sc.y-th*3>H)continue;
      cells.push({col:col,row:row,sc:sc,sort:col+row});
    }
  }
  cells.sort(function(a,b){return a.sort-b.sort||(a.row-b.row)||(a.col-b.col)});

  cells.forEach(function(cell){
    var col=cell.col,row=cell.row,sc=cell.sc;
    var sx=sc.x,sy=sc.y;
    var isLocked=col<0||row<0||col>=vis||row>=vis;
    var idx=(row>=0&&row<MSZ&&col>=0&&col<MSZ)?row*MSZ+col:-1;
    var bId=idx>=0?p.town[idx]:null;
    var bd=bId?IT[bId]:null;

    if(isLocked){
      drawLockedZone(ctx,sx,sy,col,row);
      return;
    }

    // Ground
    drawGround(ctx,sx,sy,col,row);

    if(!bd)return;

    // Farm: draw soil + crop state
    if(bd.cat==='farm'){
      // Soil tile on top
      dTile(ctx,sx,sy,'#6B4226');
      dTile(ctx,sx,sy,'rgba(0,0,0,.08)');
      dBox(ctx,sx,sy+th,4,'#8B6914','#5A3D08','#7A520F');
      var f=p.farms[idx]||{};
      drawFarmState(ctx,sx,sy+th,f);
      return;
    }

    // Building
    drawBuilding(ctx,sx,sy,bId,bd);

    // Ready dot
    var dot=false;
    var app2=BLD[bId]||{h:32};
    if(bd.cat==='animal'&&p.animalSlots[idx]&&p.animalSlots[idx].ready)dot=true;
    if(bd.cat==='factory'){var fac=p.factories[idx];if(fac&&fac.queue&&fac.queue.some(function(j){return j.done}))dot=true}
    if((bd.coin||bd.exp)&&p.collect[idx]&&p.collect[idx].lastD!==today())dot=true;
    if(dot)drawReadyDot(ctx,sx,sy,app2.h||32);

    // Move highlight
    if(S.edit&&ISO.movingBldg&&ISO.movingBldg.idx===idx){
      dTile(ctx,sx,sy+th,'rgba(255,200,0,.35)');
    }
  });

  // Edit mode: show placement grid
  if(S.edit){
    cells.forEach(function(cell){
      var col=cell.col,row=cell.row,sc=cell.sc;
      if(col<0||row<0||col>=vis||row>=vis)return;
      var idx=row*MSZ+col;
      var bId2=p.town[idx];
      if(!bId2){
        var sx=sc.x,sy=sc.y,tw2=tw,th2=th;
        ctx.beginPath();
        ctx.moveTo(sx,sy+th2);ctx.lineTo(sx+tw2/2,sy+th2/2);
        ctx.lineTo(sx,sy);ctx.lineTo(sx-tw2/2,sy+th2/2);
        ctx.closePath();
        var isHov=S.placing?true:false;
        ctx.strokeStyle=isHov?'rgba(76,175,80,.6)':'rgba(255,255,255,.15)';
        ctx.lineWidth=isHov?1.5:.5;ctx.stroke();
        if(ISO.movingBldg){
      var mvb=IT[ISO.movingBldg.bId];
      var mvLbl=document.createElement('div');mvLbl.style.cssText='font-size:.7rem;font-weight:700;color:#1976D2;white-space:nowrap;flex-shrink:0';mvLbl.textContent='移動: '+(mvb?mvb.e+' '+mvb.n:'建築');ib.appendChild(mvLbl);
      var mvCancel=document.createElement('button');mvCancel.style.cssText='padding:3px 9px;border-radius:50px;border:1.5px solid #EF4444;background:#fff;color:#EF4444;font-size:.7rem;cursor:pointer;white-space:nowrap;flex-shrink:0';mvCancel.textContent='取消移動';mvCancel.addEventListener('click',function(){ISO.movingBldg=null;rTown()});ib.appendChild(mvCancel);
    } else if(S.placing){ctx.fillStyle='rgba(76,175,80,.12)';ctx.fill()}
      }
    });
  }
}

// ---- Event handling ----
function setupISO(){
  var cv=ISO.canvas;if(!cv)return;
  var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);
  ISO.offX=cv.width/2;
  ISO.offY=cv.height*.15;
  ISO.zoom=Math.min(1.2,cv.width/(vis*ISO.TW*.9));
  cv.addEventListener('mousedown',_iDown);
  cv.addEventListener('mousemove',_iMove);
  cv.addEventListener('mouseup',_iUp);
  cv.addEventListener('wheel',_iWheel,{passive:false});
  cv.addEventListener('touchstart',_iTStart,{passive:false});
  cv.addEventListener('touchmove',_iTMove,{passive:false});
  cv.addEventListener('touchend',_iTEnd);
}
function _iDown(e){ISO.dragging=true;ISO.dragSX=e.clientX;ISO.dragSY=e.clientY;ISO.dragOX=ISO.offX;ISO.dragOY=ISO.offY;ISO.moved=false}
function _iMove(e){
  if(!ISO.dragging)return;
  var dx=e.clientX-ISO.dragSX,dy=e.clientY-ISO.dragSY;
  if(Math.abs(dx)+Math.abs(dy)>4)ISO.moved=true;
  ISO.offX=ISO.dragOX+dx;ISO.offY=ISO.dragOY+dy;renderISO();
}
function _iUp(e){ISO.dragging=false;if(!ISO.moved)_iClick(e.clientX,e.clientY)}
function _iWheel(e){e.preventDefault();ISO.zoom=Math.min(3,Math.max(0.2,ISO.zoom*(e.deltaY>0?.88:1.14)));renderISO()}
function _iTStart(e){
  if(e.touches.length===2){ISO.pinchDist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);return}
  ISO.dragging=true;ISO.dragSX=e.touches[0].clientX;ISO.dragSY=e.touches[0].clientY;ISO.dragOX=ISO.offX;ISO.dragOY=ISO.offY;ISO.moved=false;
}
function _iTMove(e){
  e.preventDefault();
  if(e.touches.length===2){var d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);if(ISO.pinchDist>0){ISO.zoom=Math.min(3,Math.max(0.2,ISO.zoom*d/ISO.pinchDist));renderISO()}ISO.pinchDist=d;return}
  if(!ISO.dragging)return;
  var dx=e.touches[0].clientX-ISO.dragSX,dy=e.touches[0].clientY-ISO.dragSY;
  if(Math.abs(dx)+Math.abs(dy)>4)ISO.moved=true;
  ISO.offX=ISO.dragOX+dx;ISO.offY=ISO.dragOY+dy;renderISO();
}
function _iTEnd(e){ISO.pinchDist=0;ISO.dragging=false;if(!ISO.moved&&e.changedTouches.length>0){var t=e.changedTouches[0];_iClick(t.clientX,t.clientY)}}
function _iClick(cx,cy){
  var cv=ISO.canvas;if(!cv)return;
  var rect=cv.getBoundingClientRect();
  var sx=(cx-rect.left)*(cv.width/rect.width);
  var sy=(cy-rect.top)*(cv.height/rect.height);
  var gi=s2i(sx,sy);
  var col=gi.col,row=gi.row;
  var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);
  if(col<0||row<0||col>=vis||row>=vis)return;
  var idx=row*MSZ+col;
  var bId=S.p.town[idx],bd=bId?IT[bId]:null;
  // Move mode
  if(ISO.movingBldg){
    var from=ISO.movingBldg;
    if(!bId){
      // Move building
      S.p.town[idx]=from.bId;S.p.town[from.idx]=null;
      // Move associated data
      if(S.p.farms[from.idx]){S.p.farms[idx]=S.p.farms[from.idx];delete S.p.farms[from.idx]}
      if(S.p.animalSlots[from.idx]){S.p.animalSlots[idx]=S.p.animalSlots[from.idx];delete S.p.animalSlots[from.idx]}
      if(S.p.factories[from.idx]){S.p.factories[idx]=S.p.factories[from.idx];delete S.p.factories[from.idx]}
      if(S.p.collect[from.idx]){S.p.collect[idx]=S.p.collect[from.idx];delete S.p.collect[from.idx]}
      ISO.movingBldg=null;saveP();toast('移動完成！');renderISO();
    } else {toast('此格已有建築');renderISO()}
    return;
  }
  cClick(idx,bId,bd);
}
function isoZoom(f){ISO.zoom=Math.min(3,Math.max(0.2,ISO.zoom*f));renderISO()}
function isoCtr(){
  var cv=ISO.canvas;if(!cv)return;
  var vis=Math.min(MSZ,(S.p&&S.p.landSize)||20);
  ISO.offX=cv.width/2;ISO.offY=cv.height*.15;
  ISO.zoom=Math.min(1.2,cv.width/(vis*ISO.TW*.9));renderISO();
}

async function doLogin(){
  var name=(document.getElementById('ln')?.value||'').trim().toLowerCase();
  var pin=(document.getElementById('lp')?.value||'').trim();
  var err=document.getElementById('lerr');
  if(!name){err.textContent='請輸入帳號';return}
  if(!/^\d{4}$/.test(pin)){err.textContent='PIN需為4位數字';return}
  S.accounts=getAccs();
  var acc=S.accounts.find(function(a){return a.name===name&&a.pinHash===hPin(pin)});
  if(!acc){var pd=await loadPD(name);if(pd&&pd.pin===hPin(pin)){acc={name:name,displayName:pd.displayName||name,pinHash:hPin(pin)};if(!S.accounts.find(function(a){return a.name===name})){S.accounts.push(acc);saveAccs()}}}
  if(!acc){err.textContent='帳號或PIN錯誤';return}
  var p=await loadPD(name);if(!p)p=newP(name,pin,acc.displayName);
  ['farms','factories','animalSlots','bldgInv','collect','mgDone'].forEach(function(k){if(!p[k])p[k]={}});
  // Ensure warehouse exists on map
  var whPlaced=p.town.some(function(t){return t==='WH'});
  if(!whPlaced){
    // Place warehouse at a visible spot - row 2 col 2
    var whIdx=2*MSZ+2;
    if(p.town[whIdx])whIdx=3*MSZ+3;
    if(p.town[whIdx]){for(var wi=0;wi<p.town.length;wi++){if(!p.town[wi]){p.town[wi]='WH';break}}}
    else p.town[whIdx]='WH';
    saveP();
  }
  if(!p.displayName)p.displayName=acc.displayName||name;
  while(p.town.length<MSZ*MSZ)p.town.push(null);
  if(p.lastDay!==today()){p.coins+=20;p.totalCE=(p.totalCE||0)+20;p.lastDay=today();p.loginDays=(p.loginDays||0)+1}
  if(!p.orders||p.orders.length<1)genOrders();
  S.p=p;await saveP();startTick();go('home')
}

function cClick(idx,bId,bd){
  var p=S.p;
  // Placing mode
  if(S.placing){if(!bId){placeB(idx)}else toast('此格已有建築');return}
  if(!bId){return} // empty tile, nothing to do
  if(!bd)return;
  // Edit mode: tap building -> show move/remove popup immediately
  if(S.edit){
    showRem(idx,bd);return;
  }
  // Normal mode interactions
  if(bd.cat==='farm')return fClick(idx,bd);
  if(bd.cat==='animal')return aClick(idx,bd);
  if(bd.cat==='factory'){showFacPopup(idx,bId);return}
  // Collect daily produce
  if((bd.coin||bd.exp)&&p.collect[idx]&&p.collect[idx].lastD!==today()){
    if(bd.coin){p.coins+=bd.coin;p.totalCE=(p.totalCE||0)+bd.coin}
    if(bd.exp){p.exp+=bd.exp;checkLv()}
    p.collect[idx].lastD=today();
    saveP();renderISO();return
  }
  // Otherwise show info popup
  showBuildingPopup(idx,bd);
}

function placeB(idx){
  var p=S.p,b=IT[S.placing];
  p.town[idx]=S.placing;p.bldgInv[S.placing]--;if(p.bldgInv[S.placing]<=0)delete p.bldgInv[S.placing];

function flipCard(i){var mg=S.mg,c=mg.cards[i];if(c.faceUp||c.matched||mg.sel.length>=2)return;c.faceUp=true;mg.sel.push(i);renderMg1();if(mg.sel.length===2){var aa=mg.cards[mg.sel[0]],bb=mg.cards[mg.sel[1]];if(aa.pairId===bb.pairId){aa.matched=bb.matched=true;mg.matched++;mg.sel=[];if(mg.matched>=mg.pc){clrT();endMg1()}else renderMg1()}else{setTimeout(function(){aa.faceUp=bb.faceUp=false;mg.sel=[];renderMg1()},900)}}}

function nextBub(){
  var mg=S.mg;if(mg.round>=10){clrT();endMg2();return}
  var lv=mg.lv,maxN=Math.min(99,9+lv*3),ops=['add','sub','mul','div'],op=ops[rnd(0,3)],q,ans;
  if(op==='add'){var a=rnd(2,maxN),b=rnd(2,maxN);q=a+' + '+b;ans=a+b}
  else if(op==='sub'){var a=rnd(maxN/2,maxN),b=rnd(1,Math.floor(maxN/2));q=a+' − '+b;ans=a-b}
  else if(op==='mul'){var a=rnd(2,Math.min(12,2+lv)),b=rnd(2,Math.min(12,2+lv));q=a+' × '+b;ans=a*b}
  else{var a=rnd(2,Math.min(9,2+lv)),b=rnd(2,Math.min(9,2+lv));q=(a*b)+' ÷ '+a;ans=b}
  mg.eq={q:q,ans:ans};var opts={};opts[ans]=true;var tries=0;
  while(Object.keys(opts).length<9&&tries++<200){var w=ans+rnd(-Math.max(5,lv),Math.max(5,lv));if(w!==ans&&w>0)opts[w]=true}
  mg.opts=Object.keys(opts).map(Number).sort(function(){return Math.random()-.5});mg.round++;mg.proc=false;renderBub()
}

  body.appendChild(bg);a.appendChild(body);
}
